  --font-cn: "Songti Self", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", "宋体", serif;
  /* 手机端中文：系统宋体优先，避免 Noto Serif SC 在手机上渲染过粗 */
  --font-cn-mobile: "Songti Self", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", "宋体", serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-cn);
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(184, 164, 220, 0.18) 0%, transparent 50%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ====================================================
   银光呼吸发光背景 — 底图之下的银色光芒
   ==================================================== */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-glow .glow-orb {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(220, 210, 245, 0.30) 40%,
    rgba(200, 190, 235, 0.12) 65%,
    transparent 75%);
  filter: blur(36px);
  opacity: 0.35;
  animation: orb-breathe 6s ease-in-out infinite;
}
.bg-glow .glow-orb.orb1 {
  width: 420px; height: 420px;
  top: -120px; left: -80px;
}
.bg-glow .glow-orb.orb2 {
  width: 480px; height: 480px;
  bottom: -160px; right: -120px;
  animation-delay: 2s;
}
.bg-glow .glow-orb.orb3 {
  width: 340px; height: 340px;
  top: 42%; left: 55%;
  animation-delay: 3.2s;
}
.bg-glow .glow-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.75) 30%,
    rgba(215, 215, 235, 0.5) 50%,
    rgba(255, 255, 255, 0.75) 70%,
    transparent 100%);
  filter: blur(0.4px);
  opacity: 0.28;
  animation: line-shimmer 7s ease-in-out infinite;
}
.bg-glow .glow-line.ln1 { top: 22%; left: -5%; width: 110%; }
.bg-glow .glow-line.ln2 { top: 58%; left: -5%; width: 110%; animation-delay: 3.5s; }
.bg-glow .glow-line.ln3 { top: 80%; left: -5%; width: 110%; animation-delay: 1.2s; }
.bg-glow .glow-star {
  position: absolute;
  color: rgba(255, 255, 255, 0.8);
  font-size: 9px;
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
  animation: star-twinkle 3.2s ease-in-out infinite;
  opacity: 0;
}
.bg-glow .glow-star.gs1 { top: 14%; left: 18%; animation-delay: 0s; }
.bg-glow .glow-star.gs2 { top: 34%; right: 12%; animation-delay: 1.1s; }
.bg-glow .glow-star.gs3 { bottom: 30%; left: 22%; animation-delay: 0.6s; }
.bg-glow .glow-star.gs4 { bottom: 14%; right: 20%; animation-delay: 1.7s; }
.bg-glow .glow-star.gs5 { top: 60%; left: 10%; animation-delay: 2.2s; }
.bg-glow .glow-star.gs6 { bottom: 44%; right: 8%; animation-delay: 0.9s; }

/* ====== 银白色流星雨（Canvas 流线型） ====== */
.meteor-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
#meteor-canvas {
  display: block;
  width: 100%;
  height: 100%;
}


@keyframes orb-breathe {
  0%, 100% { opacity: 0.25; transform: scale(0.9); }
  50%      { opacity: 0.55; transform: scale(1.12); }
}
@keyframes line-shimmer {
  0%, 100% { opacity: 0.12; transform: translateX(-18px); }
  50%      { opacity: 0.5;  transform: translateX(18px); }
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.25); }
}

body::before {
  content: '';
  position: fixed;
  top: -160px;
  right: -120px;
  width: 380px;
  height: 380px;
  background: radial-gradient(circle, rgba(184, 164, 220, 0.32) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  bottom: -200px;
  left: -120px;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(155, 126, 222, 0.22) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  padding: 10px 22px 8px;
  z-index: 1;
  /* 垂直铺满视口：顶部对齐 + 底部留白，避免居中导致 slogan 无法上移 */
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

/* ====================================================
   HEADER — 浅紫色 + 发光 + 呼吸 + 漂浮
   ==================================================== */
.header {
  position: relative;
  text-align: center;
  margin: 0 0 0;  /* header底部不留白 */
  padding: 14px 0 4px;
  min-height: 82px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.title-halo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 210px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center,
    rgba(184, 164, 220, 0.32) 0%,
    rgba(155, 126, 222, 0.12) 35%,
    transparent 70%);
  filter: blur(28px);
  pointer-events: none;
  z-index: 0;
  animation: halo-breathe 5s ease-in-out infinite;
}

@keyframes halo-breathe {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
  50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
}

.title {
  position: relative;
  z-index: 2;
  font-family: 'Great Vibes', 'Allura', 'Pacifico', 'Snell Roundhand', 'Apple Chancery', cursive;
  font-size: 52px;
  font-weight: 700;
  line-height: 1.3;
  margin: 0;
  padding: 8px 20px 8px 12px;
  letter-spacing: 0;
  white-space: nowrap;
  overflow: visible;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation:
    title-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}

/* 中文副标题 — 与英文 slogan 完全一致的三重动画：float + shimmer + breathe */
.title-sub {
  position: relative;
  z-index: 2;
  margin: 0;
  font-family: "CorpSrcWinSong", var(--font-cn);  /* 司源赢宋 — SIL OFL 1.1 */
  font-size: 48px;
  font-weight: 800;
  letter-spacing: 6px;  /* 缩小字间距，使7字总宽接近英文 */
  white-space: nowrap;
  font-style: italic;
  display: inline-block;
  padding: 8px 8px 8px 22px;  /* 左侧 padding 加大 22px，让"今"右移约 10px 对齐英文 H */
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #F4EEFC 25%,
    #E4DAF2 50%,
    #F4EEFC 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation:
    title-sub-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}
/* 移除旧伪元素扫光 — 已统一为 shimmer 渐变动画 */
.title-sub::after {
  content: none;
}

@keyframes title-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}

/* 中文专用浮动：skewX(-16deg) 补偿司源赢宋无合成斜体，视觉接近旧版宋体 italic+skewX(-8deg) 的叠加倾斜 */
@keyframes title-sub-float {
  0%, 100% { transform: skewX(-16deg) translateY(0); }
  50%      { transform: skewX(-16deg) translateY(-7px); }
}

@keyframes title-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}
@keyframes sub-fade {
  0%, 100% { opacity: 0.82; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@keyframes title-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(160, 140, 210, 0.50))
      drop-shadow(0 0 22px rgba(180, 165, 220, 0.35))
      drop-shadow(0 0 40px rgba(212, 197, 232, 0.20));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(160, 140, 210, 0.75))
      drop-shadow(0 0 36px rgba(180, 165, 220, 0.55))
      drop-shadow(0 0 60px rgba(212, 197, 232, 0.35));
  }
}

.sparkle {
  position: absolute;
  font-size: 12px;
  color: var(--primary-light);
  filter: drop-shadow(0 0 4px rgba(155, 126, 222, 0.8));
  animation: sparkle 3s ease-in-out infinite;
  z-index: 1;
  opacity: 0;
}
.sparkle.s1 { top: 25%; left: 18%;  animation-delay: 0s;   }
.sparkle.s2 { top: 18%; right: 16%; animation-delay: 1.2s; }
.sparkle.s3 { bottom: 22%; left: 14%; animation-delay: 0.6s; }
.sparkle.s4 { bottom: 18%; right: 18%; animation-delay: 1.8s; }

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0.6); }
  50%      { opacity: 1; transform: scale(1.2); }
}

/* ====================================================
   MOOD BUBBLES — 首页情绪泡泡（漂浮在卡面上）
   ==================================================== */
.mood-bubbles {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: 1fr 1fr;
  grid-template-columns: repeat(3, auto);
  justify-content: center;
  align-content: space-between;
  justify-items: center;
  align-items: center;
  gap: 8px 8px;
  padding: 16px 0;
  z-index: 5;
  /* 容器不拦截点击：只让子按钮可点，魔法棒（z-index 下方）可正常接收点击 */
  pointer-events: none;
}
/* 上排（开心/沮丧/伤心）& 下排（平静/随机/赞美）：两行之间留出空隙，
   魔法棒（卡片中心 110px）正好从中露出，不被遮挡 */
.mood-chip:nth-child(1) { grid-row: 1; grid-column: 1; }
.mood-chip:nth-child(2) { grid-row: 1; grid-column: 2; }
.mood-chip:nth-child(3) { grid-row: 1; grid-column: 3; }
.mood-chip:nth-child(4) { grid-row: 2; grid-column: 1; }
.mood-chip:nth-child(5) { grid-row: 2; grid-column: 2; }
.mood-chip:nth-child(6) { grid-row: 2; grid-column: 3; }
.mood-bubbles.hidden { display: none; }

.mood-bubble {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-bubble:nth-child(1) { animation-delay: 0s; }
.mood-bubble:nth-child(2) { animation-delay: .5s; }
.mood-bubble:nth-child(3) { animation-delay: 1s; }
.mood-bubble:nth-child(4) { animation-delay: .2s; }
.mood-bubble:nth-child(5) { animation-delay: .8s; }
.mood-bubble:nth-child(6) { animation-delay: .35s; }
.mood-bubble:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 8px 24px rgba(122, 95, 192, 0.2),
    0 0 24px rgba(255, 255, 255, 0.7) inset,
    0 0 16px rgba(184, 164, 220, 0.4);
}
.mood-bubble:active { transform: scale(.94); }

@keyframes bubble-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* 兼容旧样式名 */
.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  pointer-events: auto;  /* 子按钮恢复可点击（父容器已 pointer-events:none） */
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-chip:nth-child(2) { animation-delay: .5s; }
.mood-chip:nth-child(3) { animation-delay: 1s; }
.mood-chip:nth-child(4) { animation-delay: .2s; }
.mood-chip:nth-child(5) { animation-delay: .8s; }
.mood-chip:nth-child(6) { animation-delay: .35s; }
.mood-chip:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 6px 20px rgba(122, 95, 192, 0.25),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 16px rgba(184, 164, 220, 0.45),
    0 0 30px rgba(155, 126, 222, 0.3);
}
.mood-chip:active {
  transform: scale(.94);
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.2),
    0 0 10px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.3);
}

/* ====================================================
   CATEGORY CHIPS — 已移除（用户要求去掉分类按钮，卡片上移）
   保留样式定义以便兼容，但容器不再渲染
   ==================================================== */
.category-list {
  display: none;
}

.chip {
  padding: 11px 4px;
  text-align: center;
  font-size: 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.65);
  color: var(--text-soft);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.22s ease;
  font-family: inherit;
  font-weight: 700;   /* 中文加粗 */
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  white-space: nowrap;
}

.chip:active { transform: scale(0.94); }
.chip.active {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 6px 16px rgba(122, 95, 192, 0.32);
}

/* ====================================================
   SIGN STAGE — 竖着的长方形签条
   ==================================================== */
.stage {
  margin-top: 13px;  /* 中卡间距≈0.5cm(约19px)，与英中间距均衡 */
  display: flex;
  flex-direction: column;
  align-items: center;
  perspective: 1200px;
  position: relative;  /* 让情绪泡泡 absolute 定位到卡面上 */
}

.sign-card-outer {
  position: relative;
  width: 100%;
  max-width: min(92vw, 320px);   /* 手机占屏更大，PC不超过320 */
  height: 558px;  /* 卡片高度延长1cm ≈ 38px */
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.sign-card-outer.flipped { transform: rotateY(180deg); }

.sign-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: visible;  /* 允许斜体文字溢出，靠 padding 控制视觉边界 */
}

/* ---------- FRONT ---------- */
.sign-face.front {
  background:
    radial-gradient(circle at 80% 10%, rgba(212, 197, 232, 0.5) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(184, 164, 220, 0.3) 0%, transparent 50%),
    linear-gradient(145deg, #fff 0%, var(--primary-mist) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: visible;  /* 让魔法棒光晕、水面涟漪可以扩散出卡片，营造叩击水面的扩散感 */
}

.sign-illustration {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.sign-illustration::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(122, 95, 192, 0.3);
  animation: rotate 14s linear infinite;
}

.sign-illustration .icon {
  font-size: 52px;
  animation: gentleFloat 3.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 12px rgba(122, 95, 192, 0.3));
}

.wand-label {
  margin: 24px 0 0;
  font-size: 16px;
  font-weight: 700;
  font-style: italic;
  font-family: var(--font-cn);
  letter-spacing: 2px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  background: linear-gradient(135deg,
    #B8A4DC 0%,
    #9B82D4 25%,
    #7A5FC0 50%,
    #9B82D4 75%,
    #B8A4DC 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: title-float 4.5s ease-in-out infinite,
             title-shimmer 6s linear infinite,
             title-breathe 4.5s ease-in-out infinite;
  filter:
    drop-shadow(0 0 6px rgba(155, 126, 222, 0.85))
    drop-shadow(0 0 14px rgba(140, 110, 200, 0.55));
}
.wand-label:hover { opacity: 0.85; }

@keyframes gentleFloat {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}
@keyframes rotate { to { transform: rotate(360deg); } }

.tap-hint {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 6px;
  margin-bottom: 24px;
  font-weight: 700;   /* 中文加粗 */
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
  color: white;
  border: none;
  padding: 14px 36px;
  border-radius: 100px;
  font-size: 14px;
  letter-spacing: 6px;
  cursor: pointer;
  font-weight: 700;   /* 中文加粗 */
  font-family: inherit;
  box-shadow: 0 10px 26px rgba(122, 95, 192, 0.4);
  transition: all 0.2s;
}
.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 0 4px 14px rgba(122, 95, 192, 0.36);
}
.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

/* ---------- BACK — 竖签条 + 半透发光呼吸 ---------- */
.sign-face.back {
  transform: rotateY(180deg);
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(24px) saturate(125%);
  -webkit-backdrop-filter: blur(24px) saturate(125%);
  border: 1px solid rgba(184, 164, 220, 0.35);
  border-radius: 18px;
  padding: 24px 26px 14px;
  display: flex;
  flex-direction: column;
  animation: card-breathe 5s ease-in-out infinite;
}

@keyframes card-breathe {
  0%, 100% {
    background: rgba(255, 255, 255, 0.55);
    border-color: rgba(184, 164, 220, 0.32);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 8px 32px rgba(122, 95, 192, 0.10),
      0 0 40px rgba(155, 126, 222, 0.12);
  }
  50% {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(155, 126, 222, 0.45);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.8) inset,
      0 8px 32px rgba(122, 95, 192, 0.18),
      0 0 70px rgba(155, 126, 222, 0.28);
  }
}

.sign-meta {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.sign-date {
  justify-self: start;

/* 签诗 — 非中文（英/日/德等）银白光泽 + shimmer + 呼吸发光 */
.sign-poem {
  margin: 0;
  font-size: 34px;
  line-height: 1.4;
  font-weight: 800;
  font-style: italic;
  opacity: 0;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
  padding: 4px 12px 8px;  /* 两侧留白防止截断 */
  /* 银白渐变 + shimmer 扫光（与英文 slogan 一致）*/
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.55s forwards, poem-silver-shimmer 6s linear 0.55s infinite;
  filter:
    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))
    drop-shadow(0 0 10px rgba(140, 120, 190, 0.55))
    drop-shadow(0 1px 2px rgba(80, 60, 140, 0.3));
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
}

/* 中文签诗 — 银白渐变发光斜体 + shimmer 扫光 + 呼吸发光（与英文 Slogan 统一） */
.sign-poem.sign-poem-cn {
  font-family: var(--font-cn);
  font-size: clamp(24px, 6vw, 34px);
  letter-spacing: 1px;
  font-weight: 800;
  font-style: italic;
  max-width: 100%;
  box-sizing: border-box;
  overflow-wrap: break-word;
  word-break: keep-all;
  width: 100%;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  padding: 4px 24px 8px;  /* 两侧留白 24px 防止截断 */
  position: relative;
  overflow: visible;
  animation: fadeUp 0.5s 0.55s forwards, poem-silver-shimmer 6s linear 0.55s infinite;
  filter:
    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))
    drop-shadow(0 0 10px rgba(140, 120, 190, 0.55))
    drop-shadow(0 1px 2px rgba(80, 60, 140, 0.3));
}

/* 移除旧的伪元素扫光效果 — 已改用 background-position shimmer 统一 */
.sign-poem.sign-poem-cn::after,
.sign-cn::after,
.sign-literal::after {
  content: none;
}

@keyframes cn-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

/* 中文主题词专用漂浮：保留 skewX 斜体 + translateY（与 title-sub-float 类似） */
@keyframes cn-float {
  0%, 100% { transform: skewX(-8deg) translateY(0); }
  50%      { transform: skewX(-8deg) translateY(-5px); }
}

/* 卡片外部提示：轻点卡片返回首页（在卡片下方，不在卡片内）
   放大字号 + 与 slogan 相同的三重动效（float + shimmer + breathe） */
.sign-back-hint {
  margin: 32px 0 0;
  font-size: 17px;
  color: var(--text-soft);
  text-align: center;
  letter-spacing: 2px;
  opacity: 0;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-weight: 700;
  font-style: italic;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(155, 126, 222, 0.5);
  transition: opacity 0.5s;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  background: linear-gradient(135deg,
    #B8A4DC 0%,
    #9B82D4 25%,
    #7A5FC0 50%,
    #9B82D4 75%,
    #B8A4DC 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: hint-float 4.5s ease-in-out infinite,
             hint-shimmer 6s linear infinite,
             hint-breathe 4.5s ease-in-out infinite;
}
.sign-back-hint.visible {
  opacity: 1;
  animation: fadeUp 0.5s 0.7s forwards,
             hint-float 4.5s ease-in-out infinite,
             hint-shimmer 6s linear infinite,
             hint-breathe 4.5s ease-in-out infinite;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(155, 126, 222, 0.5);
}

@keyframes hint-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes hint-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

@keyframes hint-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(160, 140, 210, 0.50))
      drop-shadow(0 0 22px rgba(180, 165, 220, 0.35));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(160, 140, 210, 0.75))
      drop-shadow(0 0 36px rgba(180, 165, 220, 0.55));
  }
}

@keyframes fadeUp {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes btn-float {

  50% { box-shadow: 0 0 24px rgba(138, 100, 255, 0.4), 0 1px 2px rgba(255, 255, 255, 0.3) inset; }

/* 首页按钮 — 略深 */
.btn-ghost.solid {
  background: rgba(122, 95, 192, 0.2);
  color: #4C3A92;
  border-color: rgba(122, 95, 192, 0.3);

/* ====================================================
   TOAST
   ==================================================== */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(42, 31, 61, 0.94);
  color: white;
  padding: 12px 22px;
  border-radius: 100px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  letter-spacing: 1px;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ====================================================
   WATER RIPPLE — 魔法棒叩击水面后的涟漪波纹
   ==================================================== */
/* 水波纹涟漪扩散 — 从卡片中心向外逐层扩散，延伸到卡片边缘之外 */
.water-ripple {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.2);
  opacity: 0;
  pointer-events: none;
  z-index: 10;  /* 提到卡片之上，让涟漪可见地扩散到卡片外 */
  /* 多重 box-shadow 模拟水面柔光晕染 */
  box-shadow:
    0 0 12px 4px rgba(200, 180, 240, 0.35),
    0 0 24px 8px rgba(180, 160, 230, 0.22),
    0 0 40px 12px rgba(160, 140, 220, 0.12);
}
/* ::before 和 ::after 作为第二、第三层涟漪 */
.water-ripple::before,
.water-ripple::after {
  content: '';
  position: absolute;
  inset: -4px;  /* 略大于父元素，造出层叠错位感 */
  border-radius: 50%;
  opacity: 0;
  border: 2px solid rgba(200, 180, 240, 0.45);
  box-shadow:
    0 0 16px 6px rgba(190, 170, 235, 0.2),
    0 0 32px 10px rgba(170, 150, 225, 0.1);
}
.water-ripple.active {
  animation: ripple-main 1.4s cubic-bezier(0.15, 0.55, 0.25, 1) both;
}
.water-ripple.active::before {
  animation: ripple-echo2 1.4s 0.18s cubic-bezier(0.15, 0.55, 0.25, 1) both;
}
.water-ripple.active::after {
  animation: ripple-echo3 1.4s 0.38s cubic-bezier(0.15, 0.55, 0.25, 1) both;
}

/* 主涟漪：从中心向外大幅扩散，延伸到卡片边缘之外 */
@keyframes ripple-main {
  0%   {
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 1;
    border: 3px solid rgba(220, 200, 250, 0.7);
    box-shadow:
      0 0 12px 4px rgba(200, 180, 240, 0.4),
      0 0 24px 8px rgba(180, 160, 230, 0.25),
      0 0 40px 12px rgba(160, 140, 220, 0.12);
  }
  30%  {
    opacity: 0.85;
    border-color: rgba(210, 190, 245, 0.55);
    box-shadow:
      0 0 20px 8px rgba(190, 170, 235, 0.28),
      0 0 40px 14px rgba(170, 150, 225, 0.16),
      0 0 60px 20px rgba(150, 130, 210, 0.08);
  }
  65%  {
    opacity: 0.35;
    border-color: rgba(200, 180, 240, 0.3);
    box-shadow:
      0 0 24px 10px rgba(180, 160, 230, 0.15),
      0 0 48px 16px rgba(160, 140, 220, 0.08),
      0 0 72px 24px rgba(140, 120, 200, 0.04);
  }
  100% {
    transform: translate(-50%, -50%) scale(14);
    opacity: 0;
    border-color: rgba(190, 170, 235, 0);
    box-shadow:
      0 0 0 0 rgba(180, 160, 230, 0),
      0 0 0 0 rgba(160, 140, 220, 0),
      0 0 0 0 rgba(140, 120, 200, 0);
  }
}

/* 第二层涟漪：稍延迟、稍小、颜色更淡 */
@keyframes ripple-echo2 {
  0%   {
    transform: scale(0.3);
    opacity: 0.9;
    border-color: rgba(210, 190, 245, 0.5);
    box-shadow:
      0 0 16px 6px rgba(190, 170, 235, 0.25),
      0 0 32px 10px rgba(170, 150, 225, 0.12);
  }
  35%  {
    opacity: 0.6;
    border-color: rgba(200, 180, 240, 0.35);
  }
  100% {
    transform: scale(10);
    opacity: 0;
    border-color: rgba(190, 170, 235, 0);
    box-shadow:
      0 0 0 0 rgba(190, 170, 235, 0),
      0 0 0 0 rgba(170, 150, 225, 0);
  }
}

/* 第三层涟漪：最后扩散、最淡 */
@keyframes ripple-echo3 {
  0%   {
    transform: scale(0.3);
    opacity: 0.7;
    border-color: rgba(205, 185, 245, 0.35);
    box-shadow:
      0 0 14px 5px rgba(185, 165, 235, 0.18),
      0 0 28px 9px rgba(165, 145, 220, 0.08);
  }
  40%  {
    opacity: 0.4;
  }
  100% {
    transform: scale(8);
    opacity: 0;
    border-color: rgba(190, 170, 235, 0);
    box-shadow:
      0 0 0 0 rgba(185, 165, 235, 0),
      0 0 0 0 rgba(165, 145, 220, 0);
  }
}

/* 点击魔法棒：叩击水面 —— 涟漪扩散 + 轻微下沉再弹起 */
.sign-illustration.tap-wave {
  animation: wand-tap 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave .icon {
  animation: wand-strike 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave::after {
  animation: tap-ripple 0.9s ease-out both;
}

@keyframes wand-tap {
  0%   { transform: translateY(0) scale(1); }
  18%  { transform: translateY(8px) scale(0.96); }
  32%  { transform: translateY(6px) scale(0.97); }
  55%  { transform: translateY(-14px) scale(1.08); }
  75%  { transform: translateY(-6px) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes wand-strike {
  0%   { transform: translateY(0) rotate(0deg); }
  18%  { transform: translateY(10px) rotate(-14deg) scale(0.9); }
  32%  { transform: translateY(8px) rotate(-10deg) scale(0.92); }
  55%  { transform: translateY(-18px) rotate(10deg) scale(1.12); }
  75%  { transform: translateY(-8px) rotate(4deg) scale(1.05); }
  100% { transform: translateY(0) rotate(0deg) scale(1); }
}

@keyframes tap-ripple {
  0%   { transform: scale(0.8); opacity: 0.9; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ====================================================
   SHAKE ANIMATION（已由水面波纹替代，保留定义不生效）
   ==================================================== */
.sign-card-outer.shaking {
  animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shake {

  { cat: 'angry', num: 306,

    source: '美国·心理治疗||内德拉·格洛弗·塔瓦布（Nedra Glover Tawwab）' },
  { cat: 'angry', num: 307,
    poem: 'Turn Anger into Energy', cn: '化怒为力', meaning: '愤怒带来的高唤醒状态可以转化为行动力。去跑步、写作或搬砖，愤怒的能量就能为你所用。',
    source: '美国·运动心理学||芝加哥大学（University of Chicago）' },
  { cat: 'angry', num: 308,
    poem: 'Cool Down, Then Speak', cn: '冷静再开口', meaning: '愤怒时大脑供血偏向杏仁核，容易话冲口而出。等皮质醇回落，说出来的话才更接近本意。',
    source: '人类·神经科学||加州大学洛杉矶分校（UCLA）' },
  { cat: 'angry', num: 309,
    poem: 'Shift the Scene', cn: '换一个场景', meaning: '离开让你愤怒的房间，哪怕只是去拿杯水。物理空间的改变，会强行中断愤怒的神经回路。',
    source: '美国·认知行为疗法||贝克认知研究所（Beck Institute）' },
  { cat: 'angry', num: 310,
    poem: 'Cold Water Splash', cn: '冷水泼脸', meaning: '冷水刺激面部会触发“潜水反射”，让心率瞬间减慢。这是生理上最快速的强制冷静法。',
    source: '人类·生理学||美国心脏协会（American Heart Association）' },
  { cat: 'angry', num: 311,
    poem: 'Punch a Pillow', cn: '捶打枕头', meaning: '不能对人发泄，就用物理方式释放肢体紧绷。安全地消耗掉多余能量，情绪就会恢复平衡。',
    source: '美国·运动心理学||美国心理学会（American Psychological Association）' },
  { cat: 'angry', num: 312,
    poem: 'Write the Rant', cn: '写下吐槽', meaning: '把想骂的话全写下来，不发给任何人。写完就撕掉，情绪从大脑转移到纸张，身体就轻松了。',
    source: '美国·心理学||詹姆斯·彭尼贝克（James Pennebaker）' },
  { cat: 'angry', num: 313,
    poem: '止怒莫若诗', cn: 'Nothing calms anger like poetry', meaning: '平息怒气最好的方法，是吟诗或写诗，让冲动的情绪流进字句里，代替拳头和争吵。',
    source: '中国·哲学||《管子》（先秦）' },
  { cat: 'angry', num: 313,
    poem: '知止而后有定', cn: 'Knowing when to stop brings stability', meaning: '愤怒起于片刻，若能在最初察觉它，就不会被它推着走。知道什么时候停下，才是力量的开始。',
    source: '中国·儒学||《大学》（先秦）' },
  { cat: 'angry', num: 314,
    poem: 'Ira furor brevis est', cn: '愤怒是短暂的疯狂',     meaning: '愤怒来去匆匆，若不在它最猛烈时做决定，伤害会小很多。',
    source: '古罗马·诗学||贺拉斯（Horace）' },
  { cat: 'angry', num: 401,
    poem: 'Pause Before You Act', cn: '行动前暂停', meaning: '愤怒的生理高峰只持续九十秒。撑过这三秒，身体就开始降温。这是比说任何话都管用的倒计时。',
    source: '人类·神经科学||吉尔·博尔特·泰勒（Jill Bolte Taylor）' },
  { cat: 'angry', num: 402,
    poem: 'Reframe the Story', cn: '换一个角度', meaning: '生气时你只看到一种可能。试着问自己：还有没有别的解释？换个说法，怒气值就会下降。',
    source: '美国·认知心理学||阿尔伯特·艾利斯（Albert Ellis）' },
  { cat: 'anxious', num: 401,
    poem: 'Anxiety Is a Signal', cn: '焦虑是信号', meaning: '适度焦虑是大脑在提醒“有重要的事需要准备”。一点紧张，是你在乎这件事的生理证据。',
    source: '美国·行为心理学||耶克斯与多德森定律（Yerkes-Dodson Law）' },
  { cat: 'anxious', num: 402,
    poem: 'Best Tension', cn: '最佳紧张', meaning: '耶克斯-多德森定律表明，中等焦虑时表现最优。焦虑本身是引擎，不一定需要被消除。',
    source: '美国·心理学||罗伯特·耶克斯（Robert Yerkes）' },
  { cat: 'anxious', num: 403,
    poem: 'Five-Minute Start', cn: '先做五分钟', meaning: '大脑畏惧困难，但行动能中断这种思维循环。先动五分钟，焦虑的燃料就会断供。',
    source: '美国·行为心理学||斯坦福大学（Stanford University）' },
  { cat: 'anxious', num: 404,
    poem: 'Box Breathing', cn: '箱式呼吸', meaning: '吸气四秒、屏息四秒、呼气四秒。三分钟后心率自然回落，压力激素下降。',
    source: '美国·呼吸训练||美国海军海豹突击队（Navy SEALs）' },
  { cat: 'anxious', num: 405,
    poem: 'Mindfulness, the Pause', cn: '正念暂停', meaning: '焦虑永远指向未来，只有此刻是安全的。通过呼吸将注意力拉回当下，大脑就能停止空转。',
    source: '美国·认知神经科学||乔·卡巴金（Jon Kabat-Zinn）' },
  { cat: 'anxious', num: 406,
    poem: 'Courage Walks with Fear', cn: '勇气与恐惧同行', meaning: '大胆的人也有焦虑，只是带着它继续前进。心跳加速和紧张兴奋，共享同一条生理通路。',
    source: '美国·存在心理学||罗洛·梅（Rollo May）' },
  { cat: 'anxious', num: 407,
    poem: 'The Now Is Safe', cn: '此刻安全', meaning: '扫描身体当下的感受：周围没有实际威胁，你正在被此刻稳稳托住。',
    source: '美国·认知行为疗法||美国焦虑与抑郁协会（ADAA）' },
  { cat: 'anxious', num: 408,
    poem: 'Growth over Panic', cn: '成长胜过恐慌', meaning: '将“我做不到”替换为“我还没做到”，压力激素会显著降低。大脑喜欢开放题而非死局。',
    source: '美国·发展心理学||卡罗尔·德韦克（Carol Dweck）' },
  { cat: 'anxious', num: 409,
    poem: 'Drop Your Shoulders', cn: '放下肩膀', meaning: '焦虑时先做一件事：把肩膀从耳边降下来。肌肉紧张会欺骗大脑继续报警，松开身体也是松开情绪。',
    source: '人类·生理学||哈佛医学院（Harvard Medical School）' },
  { cat: 'anxious', num: 410,
    poem: 'Look Out the Window', cn: '看看窗外', meaning: '望向远方，让视线离开屏幕。开阔的视野会降低大脑的警报级别，让眼睛和神经都休息。',
    source: '美国·认知科学||普林斯顿大学（Princeton University）' },
  { cat: 'anxious', num: 411,
    poem: 'Grounding 5-4-3-2-1', cn: '感官着陆', meaning: '找到5样能看到的，4样能摸到的，3样能听到的，2样能闻到的，1样能尝到的。感官回到地面，焦虑就无法起飞。',
    source: '美国·临床心理学||美国心理学会（American Psychological Association）' },
  { cat: 'anxious', num: 412,
    poem: 'Decaf Switch', cn: '少喝咖啡因', meaning: '焦虑期减少咖啡因摄入，能降低中枢神经的过度兴奋。暂时退出刺激，有助于系统恢复平静。',
    source: '人类·生理学||约翰霍普金斯大学（Johns Hopkins University）' },
  { cat: 'anxious', num: 413,
    poem: 'Ball Games Clear the Mind', cn: '球类清空大脑', meaning: '打羽毛球或篮球时，大脑必须全神贯注盯球。运动让认知资源被占满，焦虑自然没有空间。',
    source: '人类·运动心理学||美国运动医学会（ACSM）' },
  { cat: 'anxious', num: 414,
    poem: 'Sweat It Out', cn: '流汗排解', meaning: '一次高强度的有氧运动，能快速代谢体内的压力激素。让汗流出来，烦恼就跟着流走了。',
    source: '美国·运动科学||哈佛医学院（Harvard Medical School）' },
  { cat: 'anxious', num: 415,
    poem: '心无挂碍', cn: 'No attachments, no fear', meaning: '心里没有牵挂和阻碍，也就没有恐惧。把担忧暂时放下，本身就是一种勇敢。',
    source: '中国·佛学||《般若波罗蜜多心经》（唐代）' },
  { cat: 'anxious', num: 501,
    poem: 'Ground Your Senses', cn: '回到感官', meaning: '焦虑时找到五样能看到的、四样能摸到的、三样能听到的。感官回到此刻，大脑就没有空去预演未来。',
    source: '美国·临床心理学||美国心理学会（American Psychological Association）' },
  { cat: 'anxious', num: 502,
    poem: 'Worry Window', cn: '担忧窗口', meaning: '每天固定留二十分钟专门焦虑，时间一到就停。把担忧装进固定时段，它就会变成可控任务。',
    source: '美国·认知行为疗法||宾夕法尼亚大学（University of Pennsylvania）' },
  { cat: 'lonely', num: 501,
    poem: 'Lonely Is the Body Crying', cn: '孤独是身体在呼喊', meaning: '孤独是身体发出的“寻找连接”的信号，如同饥饿提醒你吃饭。这是健康且自然的生存本能。',
    source: '美国·社会神经科学||约翰·卡乔波（John Cacioppo）' },
  { cat: 'lonely', num: 502,
    poem: 'One Small Hello', cn: '一个小问候', meaning: '哪怕只是和快递员或收银员说一句话，孤独感也会下降。微小的连接同样在给心脏供氧。',
    source: '美国·社会心理学||加州大学伯克利分校（UC Berkeley）' },
  { cat: 'lonely', num: 503,
    poem: 'Reach Out First', cn: '先伸出手', meaning: '主动发出一条消息，身体便会分泌拥抱激素。孤独惧怕的是迈出第一步的犹豫。',
    source: '美国·神经经济学||保罗·扎克（Paul Zak）' },
  { cat: 'lonely', num: 504,
    poem: 'Company of Others', cn: '有人陪伴', meaning: '即使在同处一个空间没有深入交流，共同的记忆和同一种笑声也能降低皮质醇水平。',
    source: '美国·社会支持研究||杨百翰大学（Brigham Young University）' },
  { cat: 'lonely', num: 505,
    poem: 'Alone is a Charge', cn: '独处是充电', meaning: '独处不等于孤独，把独处当成恢复精力，身体会修得更快。真正的孤独，是没能好好陪伴自己。',
    source: '英国·心理学||安东尼·斯托尔（Anthony Storr）' },
  { cat: 'lonely', num: 506,
    poem: "A Pet's Warmth", cn: '宠物的温暖', meaning: '撸猫狗十分钟，拥抱激素上升，压力激素下降。有时最亲近的连结，来自另一双不同的眼睛。',
    source: '美国·人与动物研究||密苏里大学（University of Missouri）' },
  { cat: 'lonely', num: 507,
    poem: 'Small Circle, Deep Bonds', cn: '小圈子深连接', meaning: '两三个谈得来的人就足以提供能量。关系的质量比数量更能抵御孤独感。',
    source: '美国·心理学研究||罗伊·鲍迈斯特（Roy Baumeister）' },
  { cat: 'lonely', num: 508,
    poem: 'Belonging is Built', cn: '归属靠建造', meaning: '加入一个小组或学习一个爱好，人就会慢慢融入。归属感是用脚步一步步走出来的。',
    source: '美国·社会心理学||罗伊·鲍迈斯特（Roy Baumeister）' },
  { cat: 'lonely', num: 509,
    poem: 'Join a Gym Class', cn: '参加健身课', meaning: '在集体运动中，大家为了同一个节奏动起来，大脑会分泌社交性的拥抱激素。和陌生人一起流汗，也是一种连接。',
    source: '人类·社会心理学||密歇根大学（University of Michigan）' },
  { cat: 'lonely', num: 510,
    poem: 'Go to a Cafe', cn: '去咖啡馆坐坐', meaning: '什么都不做，待在有人声的咖啡馆。周围人的存在本身就会降低孤独感，这是最低成本的陪伴。',
    source: '美国·环境心理学||加州大学洛杉矶分校（UCLA）' },
  { cat: 'lonely', num: 511,
    poem: 'Cozy Podcast', cn: '听播客陪伴', meaning: '戴上耳机听别人聊天的播客，大脑会把它当成一次自然社交。人声能安抚孤独的神经回路。',
    source: '美国·心理学||斯坦福大学（Stanford University）' },
  { cat: 'lonely', num: 512,
    poem: 'Call a Family Member', cn: '给家人打电话', meaning: '熟悉的声音会激活大脑中安全感相关的记忆，哪怕只是闲聊五分钟。血脉的底层连接很难被切断。',
    source: '人类·社会心理学||哈佛大学（Harvard University）' },
  { cat: 'lonely', num: 513,
    poem: '举头望明月，低头思故乡',     cn: 'Gazing at the moon, longing for home', meaning: '孤独的夜晚，抬头看看月亮。无论你在哪里，月光都会温柔地照着你。这是一种跨越时空的陪伴。',
    source: '中国·诗学||李白（盛唐）《静夜思》' },
  { cat: 'lonely', num: 514,
    poem: 'No man is an island', cn: '没有人是一座孤岛', meaning: '英国诗人多恩的经典名言。每个人的生命都与他人息息相关，你总会找到那个连接你的港湾。',
    source: '英国·文学||约翰·多恩（John Donne）' },
  { cat: 'lonely', num: 601,
    poem: 'Join Something Small', cn: '加入小事', meaning: '每周固定参加一个活动，哪怕是线上读书会。重复见面是建立归属感最快的方式。',
    source: '美国·社会学||罗伊·鲍迈斯特（Roy Baumeister）' },
  { cat: 'lonely', num: 602,
    poem: 'Write a Letter', cn: '写一封信', meaning: '想一个很久没联系的人，发一段话出去。主动迈出一步，连接就重新启动，身体会回报拥抱激素。',
    source: '美国·社会神经科学||斯坦福大学（Stanford University）' },
  { cat: 'calm', num: 601,
    poem: 'Parasympathetic Reset', cn: '副交感重置', meaning: '平静时身体进入修复模式：心率变慢、消化加强、免疫活跃。平静是身体最划算的投资。',
    source: '人类·生理学||自主神经系统研究（Autonomic Research）' },
  { cat: 'calm', num: 602,
    poem: 'Mindfulness Works', cn: '正念有效', meaning: '每天十分钟正念，几周后杏仁核变小，前额叶增强。大脑的“火警”反应会越来越小。',
    source: '美国·认知神经科学||乔·卡巴金（Jon Kabat-Zinn）' },
  { cat: 'calm', num: 603,
    poem: 'Slow Down, Repair', cn: '慢下来修复', meaning: '紧张时修复机制停摆，平静时身体才开始修墙。慢一点，是给身体发送修复信号。',
    source: '人类·生理学||世界卫生组织（World Health Organization）' },
  { cat: 'calm', num: 604,
    poem: 'One Minute, One Breath', cn: '一呼一吸', meaning: '缓慢呼气比吸气长两拍，心率会自动下降。身体先平静下来，心就会跟着平稳。',
    source: '人类·生理学||哈佛大学（Harvard University）' },
  { cat: 'calm', num: 605,
    poem: 'The Present is Peace', cn: '此刻即安宁', meaning: '此刻没有需要追赶的，也没有需要解释的。把心放回眼前，焦虑将没有立足之地。',
    source: '美国·认知神经科学||美国心理学会（American Psychological Association）' },
  { cat: 'calm', num: 606,
    poem: 'Calm Deepens Sleep', cn: '平静深化睡眠', meaning: '睡前十五分钟放空，褪黑素顺畅分泌，睡眠会变深。睡好觉，第二天的负担会轻很多。',
    source: '睡眠科学||美国睡眠医学学会（American Academy of Sleep Medicine）' },
  { cat: 'calm', num: 607,
    poem: 'Peace is a Practice', cn: '平静是练习', meaning: '大脑的平静路径越练越粗。每天一小段安静时光，就是对神经系统进行刻意练习。',
    source: '美国·神经科学||加州大学伯克利分校（UC Berkeley）' },
  { cat: 'calm', num: 608,
    poem: 'Flow', cn: '心流', meaning: '紧张做不出好东西，平静可以。静下来，创造力才有空间生长。',
    source: '美国·积极心理学||米哈里·契克森米哈赖（Mihaly Csikszentmihalyi）' },
  { cat: 'calm', num: 609,
    poem: 'Body Scan', cn: '扫描身体', meaning: '从头到脚逐个部位感受紧张与松弛，五分钟就能激活副交感神经。身体松了，心就会跟着稳。',
    source: '美国·正念减压||乔·卡巴金（Jon Kabat-Zinn）' },
  { cat: 'calm', num: 610,
    poem: 'Nature Reset', cn: '自然重置', meaning: '在绿地待二十分钟，皮质醇水平就会明显下降。自然是最省钱的神经系统修复器。',
    source: '美国·环境心理学||密歇根大学（University of Michigan）' },
  { cat: 'calm', num: 611,
    poem: 'Gentle Stretch', cn: '轻柔拉伸', meaning: '睡前做十分钟温和的拉伸，肌肉的放松信号会传递到大脑。身体柔软了，神经也会跟着松弛。',
    source: '人类·生理学||哈佛医学院（Harvard Medical School）' },
  { cat: 'calm', num: 612,
    poem: 'Write a Gratitude Line', cn: '写下一句感恩', meaning: '睡前写下今天发生的一个小美好，大脑会把注意力锚定在正面信息上，帮助你带着暖意入睡。',
    source: '美国·积极心理学||罗伯特·埃蒙斯（Robert Emmons）' },
  { cat: 'calm', num: 613,
    poem: '知止而后有定', cn: 'Knowing where to stop brings stability', meaning: '知道要达到的境界，才能有坚定的方向。不随外物沉浮，内心的宁静才是真正的归宿。',

  { cat: 'calm', num: 613,

  { cat: 'calm', num: 614,
    poem: '静水流深', cn: 'Still waters run deep', meaning: '水面最安静的地方，往往藏得最深。真正的力量，总是在最沉静的时候积蓄。',
    source: '中国·道学||《道德经》（春秋）' },
  { cat: 'calm', num: 614,
    poem: '心无挂碍', cn: 'No attachments, no fear', meaning: '心里没有牵挂和阻碍，也就没有恐惧。把担忧暂时放下，本身就是一种勇敢。',

const STORAGE_KEY = 'sisterSign.history.v1';

const state = {
  currentSign: null,
  history: [],
  isDrawing: false,
  lastCountry: null,  // 上次抽到的国家，用于国家轮换
};

/* 从语料 source 字段提取国家名（取 '||' 前的「国家·领域」中的国家部分）*/
function getCountry(sign) {
  if (!sign.source) return 'unknown';
  const part = sign.source.split('||')[0];
  return part.split('·')[0].trim();
}

/* 国家轮换抽取：优先从与上次不同的国家池中抽取 */
function pickSign() {
  // 如果有上次国家记录，先尝试从不同国家的卡片中抽取
  if (state.lastCountry) {
    const diffPool = FORTUNES.filter(f => getCountry(f) !== state.lastCountry);
    if (diffPool.length > 0) {
      const pick = diffPool[Math.floor(Math.random() * diffPool.length)];
      state.lastCountry = getCountry(pick);
      return pick;
    }
  }
  // 退化为纯随机
  const pick = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
  state.lastCountry = getCountry(pick);
  return pick;
}

/* 情绪 → 推荐签分类（情绪签：与身体/神经/激素相关的正向科普） */
const MOOD_CATS = {
  happy:   ['happy'],
  sad:     ['sad'],
  angry:   ['angry'],
  anxious: ['anxious'],
  lonely:  ['lonely'],
  calm:    ['calm'],
};

function pickSignByMood(mood) {
  const cats = MOOD_CATS[mood] || null;
  if (!cats) return pickSign();
  const pool = FORTUNES.filter(f => cats.includes(f.cat));
  if (!pool.length) return pickSign();
  // 国家轮换：优先从与上次不同的国家中抽取
  if (state.lastCountry) {
    const diffPool = pool.filter(f => getCountry(f) !== state.lastCountry);
    if (diffPool.length > 0) {
      const pick = diffPool[Math.floor(Math.random() * diffPool.length)];
      state.lastCountry = getCountry(pick);
      return pick;
    }
  }
  // 退化：同国家池内随机
  const pick = pool[Math.floor(Math.random() * pool.length)];
  state.lastCountry = getCountry(pick);
  return pick;
}

function isAscii(str) {
  return /^[\x00-\x7F\s]+$/.test(str);
}

/* ====================================================
   日期 + 天气感知 — 显示「2026/08/19 · 晴 28℃」
   天气优先取 localStorage 手动设置；无则用本地时间推算季节天气
   ==================================================== */
const WEATHER_ICONS = {
  sun: '☀️', cloud: '☁️', rain: '🌧️', snow: '❄️', fog: '🌫️',
  thunder: '⛈️', wind: '💨', moon: '🌙', star: '✨'
};

function getSeasonWeather() {
  // 根据月份 + 时段给一个温和的默认天气（无需联网、离线可用）
  const d = new Date();
  const mon = d.getMonth() + 1;
  const h = d.getHours();
  if (mon >= 3 && mon <= 5)  return { icon: 'sun',  label: '晴' };
  if (mon >= 6 && mon <= 8)  return { icon: h >= 18 || h < 6 ? 'moon' : 'sun',  label: '晴' };
  if (mon >= 9 && mon <= 11) return { icon: 'sun',  label: '晴' };
  return { icon: h >= 18 || h < 6 ? 'moon' : 'sun', label: '晴' };
}

function getWeatherText() {
  const saved = localStorage.getItem('sisterSign.weather');
  if (saved) {
    try {
      const w = JSON.parse(saved);
      if (w && w.label) return w;
    } catch (e) {}
  }
  return getSeasonWeather();
}

function formatDateLine() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
  const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${y}/${m}/${day} 周${wd}`;
}

function formatWeatherLine() {
  const w = getWeatherText();
  const icon = WEATHER_ICONS[w.icon] || WEATHER_ICONS.sun;
  const temp = localStorage.getItem('sisterSign.temperature');
  const tempStr = temp ? ` · ${temp}℃` : '';
  return `${icon} ${w.label}${tempStr}`;
}

function renderSign(sign) {
  // 主题词视觉标准（66 张旧卡片）：
  //   大标题 = 银色发光衬线（英文）或 银色发光宋体（中文诗）→ 34px/700/italic + shimmer
  //   副题   = 浅紫宋体（中文）或 浅紫衬线（英文翻译）→ clamp(24px,6vw,34px)
  // 中文字符判定：包含 CJK 统一表意文字才算中文，法语/拉丁等非 ASCII 不算
  const poemIsCn = /[\u4e00-\u9fff]/.test(sign.poem);
  // 中文诗 → 银白大标题样式（宋体）；英文诗 → 银白衬线大标题样式
  const poemClass = poemIsCn ? 'sign-poem sign-poem-cn' : 'sign-poem english';
  const joinSegs = (segs) => segs.map(seg => `<span class="seg">${seg}</span>`)
    .join(segs.some(sg => /[\x00-\x7F]/.test(sg)) ? ' ' : '\u200B');  // 中文段用零宽空格连接，提供视觉节点但不渲染空隙
  // 中文签诗按语义断句；英文/法语按子句断行
  const poemHtml = poemIsCn
    ? `<span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.poem), 5))}</span>`
    : joinSegs(smartSegments(escapeHtml(sign.poem), 9, !poemIsCn));
  // cn 行：中文诗 → 英文翻译走浅紫衬线副题（sub）；非中文诗 → 中文/英文主题走浅紫副题
  const cnIsAscii = sign.cn && /[\x00-\x7F]/.test(sign.cn);
  const cnLine = sign.cn
    ? `<p class="${cnIsAscii ? (poemIsCn ? 'sign-cn-en sub' : 'sign-cn-en') : 'sign-cn'}">${cnIsAscii ? escapeHtml(sign.cn) : `<span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.cn), 20))}</span>`}</p>`
    : '';
  const literalLine = sign.literal
    ? `<p class="sign-literal"><span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.literal), 5))}</span></p>`
    : '';
  const meaningHtml = joinSegs(smartSegments(escapeHtml(sign.meaning), 16));
  const sourceHtml = sign.source
    ? (() => {
        const parts = sign.source.split('||');
        let html = '<span class="source-line">— ' + parts[0] + '</span>';
        if (parts[1]) html += '<span class="source-line">' + parts[1] + '</span>';
        return html;
      })()
    : '';
  return `
    <div class="sign-meta">
      <span class="sign-date">${formatDateLine()}</span>
      <span class="sign-weather">${formatWeatherLine()}</span>
      <span class="sign-brand">今朝·Good day</span>
    </div>
    <div class="sign-content">
      <div class="sign-top">
        ${poemIsCn
          ? `<p class="${poemClass}">${poemHtml}</p>\n        ${cnLine}`
          : `${cnLine}\n        <p class="${poemClass}">${poemHtml}</p>`}
        ${literalLine}
      </div>
      <div class="sign-mid">
        <p class="sign-meaning">${meaningHtml}</p>
      </div>
      <div class="sign-bottom">
        ${sign.source ? `<p class="sign-source">${sourceHtml}</p>` : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="copy-btn">📋 复制</button>
      <button class="btn-ghost solid" id="again-btn">🏠 首页</button>
    </div>
  `;
}

function escapeHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}


/* 智能断行：把长文本切成「语义段」，
   每段 inline-block 不换行，整段放不下才整体换到下一行，
   保证括号、单词、短句不被拆成两半。
   - 中文：按句末标点断句；过长无标点段再按字数拆
   - 英文：按空格断词（词不拆），逗号/句号后也断开 */
function smartSegments(text, maxCn = 9, keepSpace = false) {
  if (!text) return [];
  const segs = [];
  let cur = '';
  const flush = () => {
    const t = cur.trim();
    if (t) {
      // 纯标点段（如「。」「—」）并入前一段，避免孤立符号占一行
      if (!/[a-zA-Z0-9\u4e00-\u9fff]/.test(t) && segs.length > 0) {
        segs[segs.length - 1] += t;
      } else if (/[\u4e00-\u9fff]/.test(t) && t.length > maxCn && !/[，。！？、；：]/.test(t)) {
        const breakers = ['需要', '就是', '也是', '就能', '才是', '没有', '还有', '我们', '成为'];
        let cutAt = -1;
        for (const b of breakers) {
          const idx = t.indexOf(b, 4);
          if (idx > 0 && idx < t.length - 2 && idx <= maxCn) { cutAt = idx; break; }
        }
        if (cutAt > 0) {
          segs.push(t.slice(0, cutAt));
          segs.push(t.slice(cutAt));
        } else {
          for (let i = 0; i < t.length; i += maxCn) segs.push(t.slice(i, i + maxCn));
        }
      } else {
        // 过短段（1-2字中文）并入前段，避免孤立单字占一行
        if (segs.length > 0 && /[\u4e00-\u9fff]/.test(t) && t.length <= 2 && !/[，。！？、；：]/.test(t)) {
          segs[segs.length - 1] += t;
        } else {
          segs.push(t);
        }
      }
    }
    cur = '';
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    // 「·」与两侧空格保留（如 美国 · 孔子），不拆散
    if (ch === '·') { cur += ch; continue; }
    if (ch === '（' || ch === '(') {
      const close = text.indexOf(ch === '（' ? '）' : ')', i + 1);
      if (close > -1) {
        // 括号段与括号前累积的内容合并为完整一段（避免括号被拆两半）
        const full = cur + text.slice(i, close + 1);
        if (full.trim()) segs.push(full.trim());
        cur = '';
        i = close;
        continue;
      }
    }
    cur += ch;
if (ch === ' ') {
      // 纯标点累积（如「—」开头）不因空格打断，继续与后文合并
      const curTrim = cur.trim();
      if (curTrim && !/[a-zA-Z0-9\u4e00-\u9fff]/.test(curTrim)) continue;
      // keepSpace（英文签诗）：空格已由 cur += ch 累积，仅按标点断句，避免逐词竖排
      if (keepSpace) { continue; }
      flush(); continue;
    }
    // 硬断点：句末标点（。！？；）→ 保证句子完整换行
    if (/[。！？；!?;]/.test(ch)) { flush(); continue; }
    // 软断点：逗号/顿号/冒号 → 只有当前段已接近行宽上限才断开，
    // 否则保留在段内，避免「停一停，」「路反而顺。」被拆成孤立段
    if (/[，、：,]/.test(ch)) {
      flush();
      continue;
    }
    if (ch === '.') {
      const next = text[i + 1];
      if (next === undefined || next === ' ') { flush(); continue; }
    }
  }
  flush();
  return segs;
}

function drawSign(mood) {
  if (state.isDrawing) return;
  state.isDrawing = true;
  hideHome();   // 抽签后隐藏情绪泡泡

  const card  = document.getElementById('card');
  const drawBtn = document.getElementById('draw-btn');
  const wand  = document.getElementById('wand');
  if (drawBtn) drawBtn.disabled = true;

  if (navigator.vibrate) {
    try { navigator.vibrate(40); } catch(e) {}
  }

  // 魔法棒叩击水面：涟漪扩散 → 片刻后牌面翻开（不再摇晃）
  if (wand) {
    wand.classList.remove('tap-wave');
    void wand.offsetWidth;  // 强制重绘以重新触发动画
    wand.classList.add('tap-wave');
  }

  // 触发水面涟漪波纹
  const ripple = document.getElementById('water-ripple');
  if (ripple) {
    ripple.classList.remove('active');
    void ripple.offsetWidth;
    ripple.classList.add('active');
  }

  setTimeout(() => {
    if (wand) wand.classList.remove('tap-wave');
    card.classList.remove('shaking');
    const sign = mood ? pickSignByMood(mood) : pickSign();
    state.currentSign = sign;

    const back = document.getElementById('face-back');
    back.innerHTML = renderSign(sign);
    card.classList.add('flipped');

    // 显示卡片外的返回提示
    const hint = document.getElementById('back-hint');
    if (hint) hint.classList.add('visible');

    bindResultEvents();

    setTimeout(() => {
      state.isDrawing = false;
      if (drawBtn) drawBtn.disabled = false;
      addToHistory(sign);
    }, 700);
  }, 560);
}

function resetCard() {
  if (state.isDrawing) return;
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  state.currentSign = null;
  // 隐藏卡片外的返回提示
  const hint = document.getElementById('back-hint');
  if (hint) hint.classList.remove('visible');
  showHome();
}

/* 返回首页：显示情绪泡泡 */
function showHome() {
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) bubbles.classList.remove('hidden');
  setMeteorMode('sparse');
}

/* 抽签后：隐藏情绪泡泡 */
function hideHome() {
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) bubbles.classList.add('hidden');
  setMeteorMode('dense');
}

function bindResultEvents() {
  const copyBtn     = document.getElementById('copy-btn');
  const againBtn    = document.getElementById('again-btn');
  if (copyBtn) copyBtn.onclick = copySign;
  if (againBtn) againBtn.onclick = (e) => {
    e.stopPropagation();
    resetCard();
  };
  // 点击签文空白处 → 返回首页（绑在 back 面上，事件更可靠）
  const back = document.getElementById('face-back');
  if (back) {
    back.onclick = (e) => {
      // 点击按钮区域不触发返回
      if (e.target.closest('.btn-ghost, .actions, a, button')) return;
      resetCard();
    };
  }
}

function copySign() {
  const s = state.currentSign;
  if (!s) return;
  const lines = [];
  lines.push(`【${formatDateLine()} ${formatWeatherLine()}】`);
  lines.push('');
  if (s.poem) lines.push(s.poem);
  if (s.cn) lines.push(`（${s.cn}）`);
  if (s.literal) lines.push(`（${s.literal}）`);
  lines.push('');
  if (s.meaning) lines.push(`*${s.meaning}`);
  if (s.tip) lines.push(`*${s.tip}`);
  if (s.source) lines.push(`—— ${s.source.replace('||', '\n   ')}`);
  lines.push('');
  lines.push('《今朝·Good day》');
  const text = lines.join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('文字已复制 · 去发小红书'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('文字已复制 · 去发小红书');
  } catch (e) {
    showToast('复制失败，请长按选择文字');
  }
  document.body.removeChild(ta);
}

function addToHistory(sign) {
  state.history = state.history.filter(h => h.poem !== sign.poem);
  state.history.unshift({ ...sign, time: Date.now() });
  state.history = state.history.slice(0, 3);
  saveHistory();
}

function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state.history = JSON.parse(saved);
  } catch (e) {}
}

function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
  } catch (e) {}
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function init() {
  loadHistory();
  const drawBtn = document.getElementById('draw-btn');
  if (drawBtn) drawBtn.addEventListener('click', drawSign);
  const wand = document.getElementById('wand');
  if (wand) wand.addEventListener('click', drawSign);
  // 魔法棒下方文字也可点击抽卡
  const wandLabel = document.getElementById('wand-label');
  if (wandLabel) wandLabel.addEventListener('click', (e) => {
    e.stopPropagation();
    drawSign();
  });

  // 情绪入口：点击推荐对应签文
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) {
    bubbles.querySelectorAll('.mood-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        drawSign(chip.dataset.mood);
      });
    });
  }
}

init();

/* ====== 彗星拖尾流星雨（Canvas，缓慢优雅，低密度） ====== */
(function () {
  const container = document.getElementById('meteor-container');
  const canvas = document.getElementById('meteor-canvas');
  if (!container || !canvas) return;

  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let comets = [];
  let mode = 'sparse';
  let burstUntil = 0;
  let spawnAccum = 0;
  let last = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = container.clientWidth;
    H = container.clientHeight;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  /* 生成一颗彗星：左上→右下斜线，亮头+长锥形拖尾，缓慢移动 */
  function spawnComet(opts) {
    opts = opts || {};
    const fast = opts.fast || false;
    // 角度：固定左上→右下，斜率约 0.35~0.45
    const angle = 0.35 + Math.random() * 0.10;
    // 速度大幅降低：原来 5.5~11，现在 1.2~2.5（缓慢下落）
    const speed = (fast ? 2.0 : 1.2) + Math.random() * (fast ? 1.5 : 1.3);
    // 拖尾长度大幅加长：原来 200~480，现在 300~600
    const tailLen = 300 + Math.random() * 300;
    // 起点偏左上区域
    const startX = -80 + Math.random() * (W * 0.4);
    const startY = -60 + Math.random() * (H * 0.15);
    comets.push({
      x: startX,
      y: startY,
      vx: Math.cos(angle) * speed * 60,  // px/s
      vy: Math.sin(angle) * speed * 60,
      tailLen: tailLen,
      life: 1,
      decay: fast ? (0.003 + Math.random() * 0.003) : (0.0018 + Math.random() * 0.002),
      glow: 0.75 + Math.random() * 0.25,
      headSize: fast ? (5 + Math.random() * 3) : (6 + Math.random() * 4),
      tailWidth: fast ? (2 + Math.random() * 1) : (2.5 + Math.random() * 1.5)
    });
  }

  /* 抽卡时短暂密集（但仍保持彗星风格，只是稍快稍多） */
  function burst(n) {
    for (let i = 0; i < n; i++) spawnComet({ fast: true });
  }

  function update(dt) {
    const now = performance.now();
    if (now < burstUntil) {
      // 抽卡密集期：补给频率降低，保持彗星优雅感
      if (Math.random() < dt * 6) spawnComet({ fast: true });
    } else if (mode === 'sparse') {
      // 首页零星：每 2.5~5 秒一颗（大幅降低密度）
      spawnAccum += dt;
      if (spawnAccum > 2.5 + Math.random() * 2.5) {
        spawnAccum = 0;
        spawnComet();
      }
    }
    // 更新彗星
    for (let i = comets.length - 1; i >= 0; i--) {
      const c = comets[i];
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.life -= c.decay * dt * 60;
      if (c.life <= 0 || c.y > H + 150 || c.x > W + 150) {
        comets.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const c of comets) {
      const alpha = Math.min(1, c.life * 1.2);
      const gx = c.vx, gy = c.vy;
      const gmag = Math.sqrt(gx * gx + gy * gy) || 1;
      // 尾迹方向（反向）
      const tx = c.x - (gx / gmag) * c.tailLen;
      const ty = c.y - (gy / gmag) * c.tailLen;

      // 1. 外层柔光拖尾（宽、淡、模糊）
      const outerGrad = ctx.createLinearGradient(tx, ty, c.x, c.y);
      outerGrad.addColorStop(0, 'rgba(200, 180, 240, 0)');
      outerGrad.addColorStop(0.5, `rgba(200, 180, 240, ${0.06 * alpha * c.glow})`);
      outerGrad.addColorStop(0.85, `rgba(220, 200, 250, ${0.15 * alpha * c.glow})`);
      outerGrad.addColorStop(1, `rgba(230, 215, 255, ${0.25 * alpha * c.glow})`);
      ctx.strokeStyle = outerGrad;
      ctx.lineWidth = c.tailWidth * 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(c.x, c.y);
      ctx.stroke();

      // 2. 内层亮拖尾（窄、亮、银白渐变）
      const innerGrad = ctx.createLinearGradient(tx, ty, c.x, c.y);
      innerGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      innerGrad.addColorStop(0.6, `rgba(245, 240, 255, ${0.3 * alpha * c.glow})`);
      innerGrad.addColorStop(0.9, `rgba(255, 250, 245, ${0.65 * alpha * c.glow})`);
      innerGrad.addColorStop(1, `rgba(255, 255, 255, ${0.9 * alpha})`);
      ctx.strokeStyle = innerGrad;
      ctx.lineWidth = c.tailWidth;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(c.x, c.y);
      ctx.stroke();

      // 3. 头部光晕（径向渐变，带模糊发光）
      const headR = c.headSize * 3;
      const headGlow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, headR);
      headGlow.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
      headGlow.addColorStop(0.2, `rgba(245, 235, 255, ${0.7 * alpha})`);
      headGlow.addColorStop(0.5, `rgba(220, 200, 250, ${0.3 * alpha})`);
      headGlow.addColorStop(1, 'rgba(200, 180, 240, 0)');
      ctx.fillStyle = headGlow;
      ctx.beginPath();
      ctx.arc(c.x, c.y, headR, 0, Math.PI * 2);
      ctx.fill();

      // 4. 头部核心亮点
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.headSize * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.setMeteorMode = function (m) {
    mode = m;
    if (m === 'dense') {
      // 抽卡瞬间：适量彗星爆发（降低数量保持优雅）
      burstUntil = performance.now() + 1800;
      burst(8 + Math.floor(Math.random() * 5));   // 8~12 颗
    } else {
      burstUntil = 0;
    }
  };

  resize();
  requestAnimationFrame(loop);
})();

</script>
