<!DOCTYPE html>
<!-- ============================================================
     今朝·My Day — 情绪抽卡工具
     线上地址: https://gloriaetlaus-coder.github.io/light-wind/
     ============================================================

5. slogan完整：英文"How's Your Day?" + 中文"今天过得怎么样？" 上下不被截断
     6. 魔法按钮点击：.mood-bubbles容器必须 pointer-events:none、.mood-chip/icons用 pointer-events:auto，点击魔法棒能翻转抽卡（不要被容器遮挡拦截）
     7. 底部文字动效：.wand-label（点击魔法棒随机抽一张）与 .sign-back-hint（轻点卡片返回首页）都必须 = slogan 同款三重动画(title-float/shimmer/breathe)，且为银白渐变、放大字号、无下划线
     8. 底部无悬空：.app 必须有 min-height:100dvh + flex垂直居中，卡片下方不留大片空白
     9. 卡片高度：max-width:600px 用 min(76vh,600px)，max-width:360px 用 min(78vh,580px)
     10. 释义末句情绪价值：每条释义最后一句要给用户正向情绪价值（夸赞/治愈/鼓励），不要冷冰冰科普
     11. 品牌角标：卡片右上角显示"今朝·Good day"
     12. 控制台零报错（favicon 404除外）
     13. slogan颜色：英文/中文均银白渐变（#FFFFFF→#E8DEF5→#D4C5ED）
     14. 释义排版：连续段落（display:inline），无段间空行
     15. 保存图片：触屏设备弹层长按保存；保存图主题词明亮紫色 #9B82D4
     16. 中文slogan上移：title-sub margin-top 为负值，整体上移约0.5cm
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7A5FC0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今朝·Good day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Allura&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #7A5FC0;
  --primary-deep: #5C42A6;
  --primary-light: #B8A4DC;
  --primary-soft: #D4C5E8;
  --primary-pale: #F2EBFA;
  --primary-mist: #FAF6FF;
  --bg-1: #FAF7FF;
  --bg-2: #EFE6F8;
  --bg-3: #E5D9F2;
  --text: #2A1F3D;
  --text-soft: #5A4A75;
  --text-muted: #8B7AA6;
  --line: rgba(122, 95, 192, 0.14);
  --white: #ffffff;
  --shadow-lg: 0 18px 48px rgba(122, 95, 192, 0.16);
  --shadow-md: 0 8px 24px rgba(122, 95, 192, 0.12);
  --shadow-sm: 0 4px 12px rgba(122, 95, 192, 0.08);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --font-cn: "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", "宋体", serif;
  /* 手机端中文：系统宋体优先，避免 Noto Serif SC 在手机上渲染过粗 */
  --font-cn-mobile: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", "宋体", serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-cn);
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(184, 164, 220, 0.18) 0%, transparent 50%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ====================================================
   银光呼吸发光背景 — 底图之下的银色光芒
   ==================================================== */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-glow .glow-orb {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(220, 210, 245, 0.30) 40%,
    rgba(200, 190, 235, 0.12) 65%,
    transparent 75%);
  filter: blur(36px);
  opacity: 0.35;
  animation: orb-breathe 6s ease-in-out infinite;
}
.bg-glow .glow-orb.orb1 {
  width: 420px; height: 420px;
  top: -120px; left: -80px;
}
.bg-glow .glow-orb.orb2 {
  width: 480px; height: 480px;
  bottom: -160px; right: -120px;
  animation-delay: 2s;
}
.bg-glow .glow-orb.orb3 {
  width: 340px; height: 340px;
  top: 42%; left: 55%;
  animation-delay: 3.2s;
}
.bg-glow .glow-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.75) 30%,
    rgba(215, 215, 235, 0.5) 50%,
    rgba(255, 255, 255, 0.75) 70%,
    transparent 100%);
  filter: blur(0.4px);
  opacity: 0.28;
  animation: line-shimmer 7s ease-in-out infinite;
}
.bg-glow .glow-line.ln1 { top: 22%; left: -5%; width: 110%; }
.bg-glow .glow-line.ln2 { top: 58%; left: -5%; width: 110%; animation-delay: 3.5s; }
.bg-glow .glow-line.ln3 { top: 80%; left: -5%; width: 110%; animation-delay: 1.2s; }
.bg-glow .glow-star {
  position: absolute;
  color: rgba(255, 255, 255, 0.8);
  font-size: 9px;
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
  animation: star-twinkle 3.2s ease-in-out infinite;
  opacity: 0;
}
.bg-glow .glow-star.gs1 { top: 14%; left: 18%; animation-delay: 0s; }
.bg-glow .glow-star.gs2 { top: 34%; right: 12%; animation-delay: 1.1s; }
.bg-glow .glow-star.gs3 { bottom: 30%; left: 22%; animation-delay: 0.6s; }
.bg-glow .glow-star.gs4 { bottom: 14%; right: 20%; animation-delay: 1.7s; }
.bg-glow .glow-star.gs5 { top: 60%; left: 10%; animation-delay: 2.2s; }
.bg-glow .glow-star.gs6 { bottom: 44%; right: 8%; animation-delay: 0.9s; }

@keyframes orb-breathe {
  0%, 100% { opacity: 0.25; transform: scale(0.9); }
  50%      { opacity: 0.55; transform: scale(1.12); }
}
@keyframes line-shimmer {
  0%, 100% { opacity: 0.12; transform: translateX(-18px); }
  50%      { opacity: 0.5;  transform: translateX(18px); }
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.25); }
}

body::before {
  content: '';
  position: fixed;
  top: -160px;
  right: -120px;
  width: 380px;
  height: 380px;
  background: radial-gradient(circle, rgba(184, 164, 220, 0.32) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  bottom: -200px;
  left: -120px;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(155, 126, 222, 0.22) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  padding: 10px 22px 8px;
  z-index: 1;
  /* 垂直铺满视口：顶部对齐 + 底部留白，避免居中导致 slogan 无法上移 */
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

/* ====================================================
   HEADER — 浅紫色 + 发光 + 呼吸 + 漂浮
   ==================================================== */
.header {
  position: relative;
  text-align: center;
  margin: 0 0 0;  /* header底部不留白 */
  padding: 14px 0 4px;
  min-height: 82px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.title-halo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 210px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center,
    rgba(184, 164, 220, 0.32) 0%,
    rgba(155, 126, 222, 0.12) 35%,
    transparent 70%);
  filter: blur(28px);
  pointer-events: none;
  z-index: 0;
  animation: halo-breathe 5s ease-in-out infinite;
}

@keyframes halo-breathe {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
  50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
}

.title {
  position: relative;
  z-index: 2;
  font-family: 'Great Vibes', 'Allura', 'Pacifico', 'Snell Roundhand', 'Apple Chancery', cursive;
  font-size: 52px;
  font-weight: 700;
  line-height: 1.3;
  margin: 0;
  padding: 8px 20px 8px 12px;
  letter-spacing: 0;
  white-space: nowrap;
  overflow: visible;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation:
    title-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}

/* 中文副标题 — 与英文 slogan 完全一致的三重动画：float + shimmer + breathe */
.title-sub {
  position: relative;
  z-index: 2;
  margin: 19px 0 0;   /* 中文slogan：与英文间距0.5cm(约19px) */
  font-family: var(--font-cn);
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 4px;
  white-space: nowrap;
  font-style: italic;
  display: inline-block;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #F4EEFC 25%,
    #E4DAF2 50%,
    #F4EEFC 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation:
    title-sub-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}
/* 移除旧伪元素扫光 — 已统一为 shimmer 渐变动画 */
.title-sub::after {
  content: none;
}

@keyframes title-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}

/* 中文专用浮动：保留 skewX 斜体 + translateY 漂浮（合并到一个 transform 中避免覆盖） */
@keyframes title-sub-float {
  0%, 100% { transform: skewX(-8deg) translateY(0); }
  50%      { transform: skewX(-8deg) translateY(-7px); }
}

@keyframes title-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}
@keyframes sub-fade {
  0%, 100% { opacity: 0.82; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@keyframes title-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(160, 140, 210, 0.50))
      drop-shadow(0 0 22px rgba(180, 165, 220, 0.35))
      drop-shadow(0 0 40px rgba(212, 197, 232, 0.20));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(160, 140, 210, 0.75))
      drop-shadow(0 0 36px rgba(180, 165, 220, 0.55))
      drop-shadow(0 0 60px rgba(212, 197, 232, 0.35));
  }
}

.sparkle {
  position: absolute;
  font-size: 12px;
  color: var(--primary-light);
  filter: drop-shadow(0 0 4px rgba(155, 126, 222, 0.8));
  animation: sparkle 3s ease-in-out infinite;
  z-index: 1;
  opacity: 0;
}
.sparkle.s1 { top: 25%; left: 18%;  animation-delay: 0s;   }
.sparkle.s2 { top: 18%; right: 16%; animation-delay: 1.2s; }
.sparkle.s3 { bottom: 22%; left: 14%; animation-delay: 0.6s; }
.sparkle.s4 { bottom: 18%; right: 18%; animation-delay: 1.8s; }

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0.6); }
  50%      { opacity: 1; transform: scale(1.2); }
}

/* ====================================================
   MOOD BUBBLES — 首页情绪泡泡（漂浮在卡面上）
   ==================================================== */
.mood-bubbles {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: 1fr 1fr;
  grid-template-columns: repeat(3, auto);
  justify-content: center;
  align-content: space-between;
  justify-items: center;
  align-items: center;
  gap: 8px 8px;
  padding: 16px 0;
  z-index: 5;
  /* 容器不拦截点击：只让子按钮可点，魔法棒（z-index 下方）可正常接收点击 */
  pointer-events: none;
}
/* 上排（开心/沮丧/伤心）& 下排（平静/随机/赞美）：两行之间留出空隙，
   魔法棒（卡片中心 110px）正好从中露出，不被遮挡 */
.mood-chip:nth-child(1) { grid-row: 1; grid-column: 1; }
.mood-chip:nth-child(2) { grid-row: 1; grid-column: 2; }
.mood-chip:nth-child(3) { grid-row: 1; grid-column: 3; }
.mood-chip:nth-child(4) { grid-row: 2; grid-column: 1; }
.mood-chip:nth-child(5) { grid-row: 2; grid-column: 2; }
.mood-chip:nth-child(6) { grid-row: 2; grid-column: 3; }
.mood-bubbles.hidden { display: none; }

.mood-bubble {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-bubble:nth-child(1) { animation-delay: 0s; }
.mood-bubble:nth-child(2) { animation-delay: .5s; }
.mood-bubble:nth-child(3) { animation-delay: 1s; }
.mood-bubble:nth-child(4) { animation-delay: .2s; }
.mood-bubble:nth-child(5) { animation-delay: .8s; }
.mood-bubble:nth-child(6) { animation-delay: .35s; }
.mood-bubble:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 8px 24px rgba(122, 95, 192, 0.2),
    0 0 24px rgba(255, 255, 255, 0.7) inset,
    0 0 16px rgba(184, 164, 220, 0.4);
}
.mood-bubble:active { transform: scale(.94); }

@keyframes bubble-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* 兼容旧样式名 */
.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  pointer-events: auto;  /* 子按钮恢复可点击（父容器已 pointer-events:none） */
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-chip:nth-child(2) { animation-delay: .5s; }
.mood-chip:nth-child(3) { animation-delay: 1s; }
.mood-chip:nth-child(4) { animation-delay: .2s; }
.mood-chip:nth-child(5) { animation-delay: .8s; }
.mood-chip:nth-child(6) { animation-delay: .35s; }
.mood-chip:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 6px 20px rgba(122, 95, 192, 0.25),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 16px rgba(184, 164, 220, 0.45),
    0 0 30px rgba(155, 126, 222, 0.3);
}
.mood-chip:active {
  transform: scale(.94);
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.2),
    0 0 10px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.3);
}

/* ====================================================
   CATEGORY CHIPS — 已移除（用户要求去掉分类按钮，卡片上移）
   保留样式定义以便兼容，但容器不再渲染
   ==================================================== */
.category-list {
  display: none;
}

.chip {
  padding: 11px 4px;
  text-align: center;
  font-size: 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.65);
  color: var(--text-soft);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.22s ease;
  font-family: inherit;
  font-weight: 700;   /* 中文加粗 */
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  white-space: nowrap;
}

.chip:active { transform: scale(0.94); }
.chip.active {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 6px 16px rgba(122, 95, 192, 0.32);
}

/* ====================================================
   SIGN STAGE — 竖着的长方形签条
   ==================================================== */
.stage {
  margin-top: 13px;  /* 中卡间距≈0.5cm(约19px)，与英中间距均衡 */
  display: flex;
  flex-direction: column;
  align-items: center;
  perspective: 1200px;
  position: relative;  /* 让情绪泡泡 absolute 定位到卡面上 */
}

.sign-card-outer {
  position: relative;
  width: 100%;
  max-width: min(92vw, 320px);   /* 手机占屏更大，PC不超过320 */
  height: 558px;  /* 卡片高度延长1cm ≈ 38px */
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.sign-card-outer.flipped { transform: rotateY(180deg); }

.sign-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: visible;  /* 允许斜体文字溢出，靠 padding 控制视觉边界 */
}

/* ---------- FRONT ---------- */
.sign-face.front {
  background:
    radial-gradient(circle at 80% 10%, rgba(212, 197, 232, 0.5) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(184, 164, 220, 0.3) 0%, transparent 50%),
    linear-gradient(145deg, #fff 0%, var(--primary-mist) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: visible;  /* 让魔法棒光晕、水面涟漪可以扩散出卡片，营造叩击水面的扩散感 */
}

.sign-illustration {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.sign-illustration::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(122, 95, 192, 0.3);
  animation: rotate 14s linear infinite;
}

.sign-illustration .icon {
  font-size: 52px;
  animation: gentleFloat 3.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 12px rgba(122, 95, 192, 0.3));
}

.wand-label {
  margin: 24px 0 0;
  font-size: 16px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: 2px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  background: linear-gradient(135deg,
    #B8A4DC 0%,
    #9B82D4 25%,
    #7A5FC0 50%,
    #9B82D4 75%,
    #B8A4DC 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: title-float 4.5s ease-in-out infinite,
             title-shimmer 6s linear infinite,
             title-breathe 4.5s ease-in-out infinite;
  filter:
    drop-shadow(0 0 6px rgba(155, 126, 222, 0.85))
    drop-shadow(0 0 14px rgba(140, 110, 200, 0.55));
}
.wand-label:hover { opacity: 0.85; }

@keyframes gentleFloat {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}
@keyframes rotate { to { transform: rotate(360deg); } }

.tap-hint {

.btn-primary {

/* ---------- BACK — 竖签条 + 半透发光呼吸 ---------- */
.sign-face.back {

@keyframes card-breathe {

    background: rgba(255, 255, 255, 0.55);
    border-color: rgba(184, 164, 220, 0.32);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 8px 32px rgba(122, 95, 192, 0.10),

.sign-meta {

}

.sign-date {

}

.sign-weather {

/* 签诗 — 非中文（英/日/德等）银白光泽 + shimmer + 漂浮 */
.sign-poem {
  margin: 0;
  font-size: 34px;
  line-height: 1.4;
  font-weight: 700;
  font-style: italic;
  opacity: 0;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
  /* 银白渐变 + shimmer 扫光（与英文 slogan 一致）*/
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.55s forwards, poem-silver-shimmer 6s linear 0.55s infinite;
  filter:
    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))
    drop-shadow(0 0 10px rgba(140, 120, 190, 0.55))
    drop-shadow(0 1px 2px rgba(80, 60, 140, 0.3));
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
}

/* 中文签诗 — 深紫色 + 发光斜体 + shimmer 扫光（与英文统一）*/
.sign-poem.sign-poem-cn {
  font-family: var(--font-cn);
  font-size: clamp(20px, 6.5vw, 26px);
  letter-spacing: 0.5px;
  font-weight: 700;
  font-style: italic;
  max-width: 100%;
  box-sizing: border-box;
  /* 中文主题词：深紫渐变 + shimmer 扫光（与英文 slogan 一致的 background-position 动画）*/
  background: linear-gradient(135deg,
    #6C52A8 0%,
    #5C42A6 30%,
    #7A5FC0 50%,
    #5C42A6 70%,
    #6C52A8 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  padding: 4px 20px 8px;  /* 底部多留白防截断 */
  filter:
    drop-shadow(0 0 6px rgba(155, 130, 222, 0.45))
    drop-shadow(0 0 14px rgba(155, 130, 222, 0.25));
  position: relative;
  overflow: visible;
  animation: fadeUp 0.5s 0.55s forwards, cn-shimmer 6s linear 0.55s infinite;
}
/* 移除旧的伪元素扫光效果 — 已改用 background-position shimmer 统一 */
.sign-poem.sign-poem-cn::after,
.sign-cn::after,
.sign-literal::after {
  content: none;
}

@keyframes cn-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

/* 中文主题词专用漂浮：保留 skewX 斜体 + translateY（与 title-sub-float 类似） */
@keyframes cn-float {
  0%, 100% { transform: skewX(-8deg) translateY(0); }
  50%      { transform: skewX(-8deg) translateY(-5px); }
}

.sign-poem.english {
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
  font-size: 34px;
  letter-spacing: 0;
  font-style: italic;
  line-height: 1.35;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
}

@keyframes poem-silver-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

.seg {

}

.sign-meaning .seg {

  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

.sign-poem.english .seg {
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

@keyframes poem-fade-in {

}

.sign-content {

}

}

/* 中文主题词 — 浅紫渐变 + 发光 + shimmer（与英文主题词风格类似但不完全一样）*/
.sign-cn {
  margin: 14px auto 0;
  font-size: clamp(24px, 6vw, 34px);
  text-align: center;
  letter-spacing: 0.5px;
  font-weight: 700;
  font-family: var(--font-cn);
  font-style: italic;
  opacity: 0;
  overflow-wrap: break-word;
  word-break: keep-all;
  position: relative;
  overflow: visible;
  padding: 4px 6px 8px;
  max-width: 100%;
  box-sizing: border-box;
  width: fit-content;
  background: linear-gradient(135deg,
    #D4C5ED 0%,
    #C4B0E8 25%,
    #B8A4DC 50%,
    #C4B0E8 75%,
    #D4C5ED 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

    drop-shadow(0 0 5px rgba(180, 160, 230, 0.7))
    drop-shadow(0 0 12px rgba(160, 140, 210, 0.4))
    drop-shadow(0 1px 2px rgba(120, 100, 170, 0.2));
}

.skew-wrap {
  display: inline-block;
  max-width: 100%;
  margin: 0 auto;
  text-align: center;
}

/* 中文直译 — 深紫渐变 + shimmer 扫光 */
.sign-literal {
  margin: 10px 0 0;
  font-size: clamp(20px, 6.5vw, 26px);
  line-height: 1.35;
  text-align: center;
  letter-spacing: 1px;
  font-weight: 700;
  font-family: var(--font-cn);
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.58s forwards;
  overflow-wrap: break-word;
  word-break: keep-all;
  max-width: 100%;
  box-sizing: border-box;

  overflow: visible;
  padding: 4px 16px 8px;  /* 底部留白防截断 */
  /* 浅紫渐变 + 发光，与英文主题词风格类似但不完全一样 */
  background: linear-gradient(135deg,
    #E8DEF5 0%,
    #D4C5ED 25%,
    #C4B0E8 50%,
    #D4C5ED 75%,
    #E8DEF5 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.58s forwards, cn-shimmer 6s linear 0.58s infinite;
  filter:
    drop-shadow(0 0 5px rgba(180, 160, 230, 0.7))
    drop-shadow(0 0 12px rgba(160, 140, 210, 0.4))
    drop-shadow(0 1px 2px rgba(120, 100, 170, 0.2));
}

.sign-cn-en {
  margin: 10px 0 0;
  font-size: 34px;
  line-height: 1.35;
  text-align: center;
  letter-spacing: 0;
  font-weight: 700;
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
  font-style: italic;
  opacity: 0;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  /* 非中文主题词 — 淡紫渐变 + shimmer */
  background: linear-gradient(135deg,
    #D4C5ED 0%,
    #C4B0E8 25%,
    #B8A4DC 50%,
    #C4B0E8 75%,
    #D4C5ED 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.55s forwards, poem-silver-shimmer 6s linear 0.55s infinite;

    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))

.sign-tip {
  margin: 0;

/* 出处 — 紧凑两行，无额外空行 */
.sign-source {

  color: var(--text-muted);
  text-align: center;

.sign-source .source-line {

  line-height: 1.2;
  margin: 0;
  padding: 0;
}

/* 卡片外部提示：轻点卡片返回首页（在卡片下方，不在卡片内）
   放大字号 + 与 slogan 相同的三重动效（float + shimmer + breathe） */
.sign-back-hint {
  margin: 32px 0 0;
  font-size: 17px;
  color: var(--text-soft);
  text-align: center;
  letter-spacing: 2px;
  opacity: 0;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-weight: 700;
  font-style: italic;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(155, 126, 222, 0.5);
  transition: opacity 0.5s;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  background: linear-gradient(135deg,
    #B8A4DC 0%,
    #9B82D4 25%,
    #7A5FC0 50%,
    #9B82D4 75%,
    #B8A4DC 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: hint-float 4.5s ease-in-out infinite,
             hint-shimmer 6s linear infinite,
             hint-breathe 4.5s ease-in-out infinite;
}
.sign-back-hint.visible {
  opacity: 1;
  animation: fadeUp 0.5s 0.7s forwards,
             hint-float 4.5s ease-in-out infinite,
             hint-shimmer 6s linear infinite,
             hint-breathe 4.5s ease-in-out infinite;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(155, 126, 222, 0.5);
}

@keyframes hint-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes hint-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

@keyframes hint-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(160, 140, 210, 0.50))
      drop-shadow(0 0 22px rgba(180, 165, 220, 0.35));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(160, 140, 210, 0.75))
      drop-shadow(0 0 36px rgba(180, 165, 220, 0.55));
  }
}

@keyframes fadeUp {
  from { opacity: 0; }
  to { opacity: 1; }
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: auto;
  padding-top: 14px;
}

.btn-ghost {
  padding: 8px 6px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #6C52A8;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 999px;
  font-size: 13px;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  letter-spacing: 1px;
  box-shadow: 0 0 20px rgba(138, 100, 255, 0.25), 0 1px 2px rgba(255, 255, 255, 0.2) inset;
  animation: btn-float 3.5s ease-in-out infinite, btn-breathe 4s ease-in-out infinite;
  text-shadow: 0 1px 4px rgba(255, 255, 255, 0.3);
}
.btn-ghost:nth-child(2) { animation-delay: 0.5s, 0.3s; }
.btn-ghost:active {
  transform: scale(0.96);
  box-shadow: 0 0 12px rgba(138, 100, 255, 0.2), 0 1px 2px rgba(255, 255, 255, 0.15) inset;
}
@keyframes btn-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes btn-breathe {
  0%, 100% { box-shadow: 0 0 16px rgba(138, 100, 255, 0.2), 0 1px 2px rgba(255, 255, 255, 0.2) inset; }
  50% { box-shadow: 0 0 24px rgba(138, 100, 255, 0.4), 0 1px 2px rgba(255, 255, 255, 0.3) inset; }
}
/* 首页按钮 — 略深 */
.btn-ghost.solid {
  background: rgba(122, 95, 192, 0.2);
  color: #4C3A92;
  border-color: rgba(122, 95, 192, 0.3);
}

/* ====================================================
   TOAST
   ==================================================== */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(42, 31, 61, 0.94);
  color: white;
  padding: 12px 22px;
  border-radius: 100px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  letter-spacing: 1px;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ====================================================
   WATER RIPPLE — 魔法棒叩击水面后的涟漪波纹
   ==================================================== */
.water-ripple {
  position: absolute;
  left: 50%;
  top: 54%;
  width: 30px;
  height: 30px;
  border: 2px solid rgba(140, 165, 230, 0.55);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.3);
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}
.water-ripple::before,
.water-ripple::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 2px solid rgba(140, 165, 230, 0.4);
  border-radius: 50%;
  opacity: 0;
}
.water-ripple.active {
  animation: ripple-main 1s ease-out both;
}
.water-ripple.active::before {
  animation: ripple-echo 1s 0.12s ease-out both;
}
.water-ripple.active::after {
  animation: ripple-echo 1s 0.28s ease-out both;
}

@keyframes ripple-main {
  0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.9; }
  100% { transform: translate(-50%, -50%) scale(7);   opacity: 0; }
}
@keyframes ripple-echo {
  0%   { transform: scale(0.5); opacity: 0.8; }
  100% { transform: scale(3.2); opacity: 0; }
}

/* 点击魔法棒：叩击水面 —— 涟漪扩散 + 轻微下沉再弹起 */
.sign-illustration.tap-wave {
  animation: wand-tap 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave .icon {
  animation: wand-strike 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave::after {
  animation: tap-ripple 0.9s ease-out both;
}

@keyframes wand-tap {
  0%   { transform: translateY(0) scale(1); }
  18%  { transform: translateY(8px) scale(0.96); }
  32%  { transform: translateY(6px) scale(0.97); }
  55%  { transform: translateY(-14px) scale(1.08); }
  75%  { transform: translateY(-6px) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes wand-strike {
  0%   { transform: translateY(0) rotate(0deg); }
  18%  { transform: translateY(10px) rotate(-14deg) scale(0.9); }
  32%  { transform: translateY(8px) rotate(-10deg) scale(0.92); }
  55%  { transform: translateY(-18px) rotate(10deg) scale(1.12); }
  75%  { transform: translateY(-8px) rotate(4deg) scale(1.05); }
  100% { transform: translateY(0) rotate(0deg) scale(1); }
}

@keyframes tap-ripple {
  0%   { transform: scale(0.8); opacity: 0.9; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ====================================================
   SHAKE ANIMATION（已由水面波纹替代，保留定义不生效）
   ==================================================== */
.sign-card-outer.shaking {
  animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0); }
  15%  { transform: translateX(-8px) rotate(-1.5deg); }
  30%  { transform: translateX(8px)  rotate(1.5deg); }
  45%  { transform: translateX(-6px) rotate(-1deg); }
  60%  { transform: translateX(6px)  rotate(1deg); }
  75%  { transform: translateX(-4px) rotate(-0.6deg); }
  90%  { transform: translateX(4px)  rotate(0.6deg); }
}

/* ====================================================
   RESPONSIVE
   ==================================================== */
@media (max-width: 600px) {
  :root { --font-cn: var(--font-cn-mobile); }
  .title { font-size: 42px; }
  .title-sub { font-size: 28px; margin-top: 12px; }  /* 手机端：间距减少0.2~0.3cm(19px→12px) */
  .header { min-height: 58px; padding: 12px 0 2px; margin-bottom: 2px; }
  .app { padding: 10px 16px 10px; }
  .sign-card-outer { max-width: min(92vw, 340px); height: min(78vh, 640px); }
  .sign-cn { font-size: clamp(26px, 8vw, 32px); }  /* 手机端中文主题词放大 */
  .sign-meaning { font-size: 15px; }  /* 手机端释义字号放大 */
  .stage { margin-top: 13px; }  /* 手机断点：中卡间距≈0.5cm */
}

@media (max-width: 360px) {
  :root { --font-cn: var(--font-cn-mobile); }
  .app { padding: 10px 14px 8px; }

function pickSign() {
  return FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
}

/* 情绪 → 推荐签分类（情绪签：与身体/神经/激素相关的正向科普） */
const MOOD_CATS = {
  happy:   ['happy'],
  sad:     ['sad'],
  angry:   ['angry'],
  anxious: ['anxious'],
  lonely:  ['lonely'],
  calm:    ['calm'],
};

function pickSignByMood(mood) {
  const cats = MOOD_CATS[mood] || null;
  if (!cats) return pickSign();
  const pool = FORTUNES.filter(f => cats.includes(f.cat));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : pickSign();
}

function isAscii(str) {
  return /^[\x00-\x7F\s]+$/.test(str);
}

/* ====================================================
   日期 + 天气感知 — 显示「2026/08/19 · 晴 28℃」
   天气优先取 localStorage 手动设置；无则用本地时间推算季节天气
   ==================================================== */
const WEATHER_ICONS = {
  sun: '☀️', cloud: '☁️', rain: '🌧️', snow: '❄️', fog: '🌫️',
  thunder: '⛈️', wind: '💨', moon: '🌙', star: '✨'
};

function getSeasonWeather() {
  // 根据月份 + 时段给一个温和的默认天气（无需联网、离线可用）
  const d = new Date();
  const mon = d.getMonth() + 1;
  const h = d.getHours();
  if (mon >= 3 && mon <= 5)  return { icon: 'sun',  label: '晴' };
  if (mon >= 6 && mon <= 8)  return { icon: h >= 18 || h < 6 ? 'moon' : 'sun',  label: '晴' };
  if (mon >= 9 && mon <= 11) return { icon: 'sun',  label: '晴' };
  return { icon: h >= 18 || h < 6 ? 'moon' : 'sun', label: '晴' };
}

function getWeatherText() {
  const saved = localStorage.getItem('sisterSign.weather');
  if (saved) {
    try {
      const w = JSON.parse(saved);
      if (w && w.label) return w;
    } catch (e) {}
  }
  return getSeasonWeather();
}

function formatDateLine() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
  const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${y}/${m}/${day} 周${wd}`;
}

function formatWeatherLine() {
  const w = getWeatherText();
  const icon = WEATHER_ICONS[w.icon] || WEATHER_ICONS.sun;
  const temp = localStorage.getItem('sisterSign.temperature');
  const tempStr = temp ? ` · ${temp}℃` : '';
  return `${icon} ${w.label}${tempStr}`;
}

function renderSign(sign) {
  // 中文主题词：若 poem 本身是中文（成语/谚语），poem 即中文主题 → 银色发光大标题；
  // 若 poem 是英文（心理签），cn 中文 → 银色发光大标题
  const poemIsCn = !isAscii(sign.poem);
  const poemClass = poemIsCn ? 'sign-poem sign-poem-cn' : 'sign-poem english';
  const joinSegs = (segs) => segs.map(seg => `<span class="seg">${seg}</span>`)
    .join(segs.some(sg => /[\x00-\x7F]/.test(sg)) ? ' ' : '\u200B');  // 中文段用零宽空格连接，提供换行点但不渲染空隙
  // 英文签诗按子句断段（keepSpace），避免逐词竖排；中文按语义断句
  const poemHtml = poemIsCn
    ? `<span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.poem), 5))}</span>`
    : joinSegs(smartSegments(escapeHtml(sign.poem), 9, !poemIsCn));
  // cn：若 poem 是中文，cn 是英文翻译 → 英文小号样式；若 poem 是英文，cn 是中文主题 → 银色大样式
  const cnIsAscii = sign.cn && /[\x00-\x7F]/.test(sign.cn);
  const cnLine = sign.cn
    ? `<p class="${cnIsAscii ? 'sign-cn-en' : 'sign-cn'}">${cnIsAscii ? escapeHtml(sign.cn) : `<span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.cn), 20))}</span>`}</p>`
    : '';
  const literalLine = sign.literal
    ? `<p class="sign-literal"><span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.literal), 5))}</span></p>`
    : '';
  const meaningHtml = joinSegs(smartSegments(escapeHtml(sign.meaning), 16));
  const sourceHtml = sign.source
    ? (() => {
        const parts = sign.source.split('||');
        let html = '<span class="source-line">— ' + parts[0] + '</span>';
        if (parts[1]) html += '<span class="source-line">' + parts[1] + '</span>';
        return html;
      })()
    : '';
  return `
    <div class="sign-meta">
      <span class="sign-date">${formatDateLine()}</span>
      <span class="sign-weather">${formatWeatherLine()}</span>
      <span class="sign-brand">今朝·Good day</span>
    </div>
    <div class="sign-content">
      <div class="sign-top">
        <p class="${poemClass}">${poemHtml}</p>
        ${cnLine}
        ${literalLine}
      </div>
      <div class="sign-mid">
        <p class="sign-meaning">${meaningHtml}</p>
      </div>
      <div class="sign-bottom">
        ${sign.source ? `<p class="sign-source">${sourceHtml}</p>` : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="copy-btn">📋 复制</button>
      <button class="btn-ghost solid" id="again-btn">🏠 首页</button>
    </div>
  `;
}

function escapeHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}


/* 智能断行：把长文本切成「语义段」，
   每段 inline-block 不换行，整段放不下才整体换到下一行，
   保证括号、单词、短句不被拆成两半。
   - 中文：按句末标点断句；过长无标点段再按字数拆
   - 英文：按空格断词（词不拆），逗号/句号后也断开 */
function smartSegments(text, maxCn = 9, keepSpace = false) {
  if (!text) return [];
  const segs = [];
  let cur = '';
  const flush = () => {
    const t = cur.trim();
    if (t) {
      // 纯标点段（如「。」「—」）并入前一段，避免孤立符号占一行
      if (!/[a-zA-Z0-9\u4e00-\u9fff]/.test(t) && segs.length > 0) {
        segs[segs.length - 1] += t;
      } else if (/[\u4e00-\u9fff]/.test(t) && t.length > maxCn && !/[，。！？、；：]/.test(t)) {
        const breakers = ['需要', '就是', '也是', '就能', '才是', '没有', '还有', '我们', '成为'];
        let cutAt = -1;
        for (const b of breakers) {
          const idx = t.indexOf(b, 4);
          if (idx > 0 && idx < t.length - 2 && idx <= maxCn) { cutAt = idx; break; }
        }
        if (cutAt > 0) {
          segs.push(t.slice(0, cutAt));
          segs.push(t.slice(cutAt));
        } else {
          for (let i = 0; i < t.length; i += maxCn) segs.push(t.slice(i, i + maxCn));
        }
      } else {
        // 过短段（1-2字中文）并入前段，避免孤立单字占一行
        if (segs.length > 0 && /[\u4e00-\u9fff]/.test(t) && t.length <= 2 && !/[，。！？、；：]/.test(t)) {
          segs[segs.length - 1] += t;
        } else {
          segs.push(t);
        }
      }
    }
    cur = '';
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    // 「·」与两侧空格保留（如 美国 · 孔子），不拆散
    if (ch === '·') { cur += ch; continue; }
    if (ch === '（' || ch === '(') {
      const close = text.indexOf(ch === '（' ? '）' : ')', i + 1);
      if (close > -1) {
        // 括号段与括号前累积的内容合并为完整一段（避免括号被拆两半）
        const full = cur + text.slice(i, close + 1);
        if (full.trim()) segs.push(full.trim());
        cur = '';
        i = close;
        continue;
      }
    }
    cur += ch;
if (ch === ' ') {
      // 纯标点累积（如「—」开头）不因空格打断，继续与后文合并
      const curTrim = cur.trim();
      if (curTrim && !/[a-zA-Z0-9\u4e00-\u9fff]/.test(curTrim)) continue;
      // keepSpace（英文签诗）：空格已由 cur += ch 累积，仅按标点断句，避免逐词竖排
      if (keepSpace) { continue; }
      flush(); continue;
    }
    // 硬断点：句末标点（。！？；）→ 保证句子完整换行
    if (/[。！？；!?;]/.test(ch)) { flush(); continue; }
    // 软断点：逗号/顿号/冒号 → 只有当前段已接近行宽上限才断开，
    // 否则保留在段内，避免「停一停，」「路反而顺。」被拆成孤立段
    if (/[，、：,]/.test(ch)) {
      flush();
      continue;
    }
    if (ch === '.') {
      const next = text[i + 1];
      if (next === undefined || next === ' ') { flush(); continue; }
    }
  }
  flush();
  return segs;
}

function drawSign(mood) {
  if (state.isDrawing) return;
  state.isDrawing = true;
  hideHome();   // 抽签后隐藏情绪泡泡

  const card  = document.getElementById('card');
  const drawBtn = document.getElementById('draw-btn');
  const wand  = document.getElementById('wand');
  if (drawBtn) drawBtn.disabled = true;

  if (navigator.vibrate) {
    try { navigator.vibrate(40); } catch(e) {}
  }

  // 魔法棒叩击水面：涟漪扩散 → 片刻后牌面翻开（不再摇晃）
  if (wand) {
    wand.classList.remove('tap-wave');
    void wand.offsetWidth;  // 强制重绘以重新触发动画
    wand.classList.add('tap-wave');
  }

  // 触发水面涟漪波纹
  const ripple = document.getElementById('water-ripple');
  if (ripple) {
    ripple.classList.remove('active');
    void ripple.offsetWidth;
    ripple.classList.add('active');
  }

  setTimeout(() => {
    if (wand) wand.classList.remove('tap-wave');
    card.classList.remove('shaking');
    const sign = mood ? pickSignByMood(mood) : pickSign();
    state.currentSign = sign;

    const back = document.getElementById('face-back');
    back.innerHTML = renderSign(sign);
    card.classList.add('flipped');

    // 显示卡片外的返回提示
    const hint = document.getElementById('back-hint');
    if (hint) hint.classList.add('visible');

    bindResultEvents();

    setTimeout(() => {
      state.isDrawing = false;
      if (drawBtn) drawBtn.disabled = false;
      addToHistory(sign);
    }, 700);
  }, 560);
}

function resetCard() {
  if (state.isDrawing) return;
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  state.currentSign = null;
  // 隐藏卡片外的返回提示
  const hint = document.getElementById('back-hint');
  if (hint) hint.classList.remove('visible');
  showHome();
}

/* 返回首页：显示情绪泡泡 */
function showHome() {
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) bubbles.classList.remove('hidden');
}

/* 抽签后：隐藏情绪泡泡 */
function hideHome() {
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) bubbles.classList.add('hidden');
}

function bindResultEvents() {
  const copyBtn     = document.getElementById('copy-btn');
  const againBtn    = document.getElementById('again-btn');
  if (copyBtn) copyBtn.onclick = copySign;
  if (againBtn) againBtn.onclick = (e) => {
    e.stopPropagation();
    resetCard();
  };
  // 点击签文空白处 → 返回首页（绑在 back 面上，事件更可靠）
  const back = document.getElementById('face-back');
  if (back) {
    back.onclick = (e) => {
      // 点击按钮区域不触发返回
      if (e.target.closest('.btn-ghost, .actions, a, button')) return;
      resetCard();
    };
  }
}

function copySign() {
  const s = state.currentSign;
  if (!s) return;
  const lines = [];
  lines.push(`【${formatDateLine()} ${formatWeatherLine()}】`);
  lines.push('');
  if (s.poem) lines.push(s.poem);
  if (s.cn) lines.push(`（${s.cn}）`);
  if (s.literal) lines.push(`（${s.literal}）`);
  lines.push('');
  if (s.meaning) lines.push(`*${s.meaning}`);
  if (s.tip) lines.push(`*${s.tip}`);
  if (s.source) lines.push(`—— ${s.source.replace('||', '\n   ')}`);
  lines.push('');
  lines.push('《今朝·Good day》');
  const text = lines.join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('文字已复制 · 去发小红书'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('文字已复制 · 去发小红书');
  } catch (e) {
    showToast('复制失败，请长按选择文字');
  }
  document.body.removeChild(ta);
}

function addToHistory(sign) {
  state.history = state.history.filter(h => h.poem !== sign.poem);
  state.history.unshift({ ...sign, time: Date.now() });
  state.history = state.history.slice(0, 3);
  saveHistory();
}

function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state.history = JSON.parse(saved);
  } catch (e) {}
}

function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
  } catch (e) {}
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function init() {
  loadHistory();
  const drawBtn = document.getElementById('draw-btn');
  if (drawBtn) drawBtn.addEventListener('click', drawSign);
  const wand = document.getElementById('wand');
  if (wand) wand.addEventListener('click', drawSign);
  // 魔法棒下方文字也可点击抽卡
  const wandLabel = document.getElementById('wand-label');
  if (wandLabel) wandLabel.addEventListener('click', (e) => {
    e.stopPropagation();
    drawSign();
  });

  // 情绪入口：点击推荐对应签文
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) {
    bubbles.querySelectorAll('.mood-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        drawSign(chip.dataset.mood);
      });
    });
  }
}

init();
</script>
</body>
