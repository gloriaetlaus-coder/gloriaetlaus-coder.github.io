<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📰 News · 每日简报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }

  /* 主体两栏 */
  .main { display: flex; height: 100vh; }

  /* 左侧栏: 头部信息 + 日历 */
  .cal {
    width: 360px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #d2d2d7;
    padding: 18px 18px 22px; overflow-y: auto;
    display: flex; flex-direction: column;
  }

  /* 顶部信息块(原来是独立 headline, 现在合并到日历上方) */
  .sidebar-hero {
    text-align: center; padding: 14px 14px 18px;
    background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
    border: 1px solid #e5e9f2; border-radius: 14px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(99, 102, 241, 0.05);
  }
  .sidebar-hero .logo { font-size: 1.8rem; margin-bottom: 4px; }
  .sidebar-hero .title {
    font-size: 1.15rem; font-weight: 800; color: #4338ca;
    letter-spacing: 1.5px; margin-bottom: 8px;
  }
  .sidebar-hero .badge {
    display: inline-block; padding: 4px 14px;
    background: #eef2ff; border: 1px solid #c7d2fe;
    border-radius: 20px; font-size: 0.72rem; color: #4338ca; font-weight: 500;
    margin-bottom: 12px;
  }
  .sidebar-hero .footer-text {
    font-size: 0.72rem; color: #8e8e93; line-height: 1.6;
  }
  .sidebar-hero .footer-text a { color: #0071e3; text-decoration: none; }
  .sidebar-hero .footer-text a:hover { text-decoration: underline; }

  /* 日历控件 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .nav-btn {
    width: 30px; height: 30px; border: none; background: #f5f5f7; border-radius: 50%;
    cursor: pointer; font-size: 14px; color: #1d1d1f; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #e8e8ed; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekdays div { text-align: center; font-size: 11px; color: #8e8e93; padding: 4px 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cell {
    aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%; cursor: default; position: relative;
  }
  .cell .num {
    font-size: 14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background 0.12s;
  }
  .cell.out { color: #c7c7cc; }
  .cell.available { cursor: pointer; }
  .cell.available:hover .num { background: #e8e8ed; }
  .cell.today .num { background: #ff3b30; color: #ffffff; font-weight: 600; }
  .cell.selected .num { background: #0071e3; color: #ffffff; font-weight: 600; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #0071e3; margin-top: 3px; }
  .cell.today .dot, .cell.selected .dot { background: #ffffff; }
  .cal-hint { margin-top: 14px; font-size: 12px; color: #8e8e93; line-height: 1.6; text-align: center; }

  /* 右侧阅读区 */
  .reader { flex: 1; display: flex; flex-direction: column; background: #f5f5f7; min-width: 0; }
  iframe { flex: 1; width: 100%; border: none; background: #f5f5f7; }

  .empty {
    flex: 1; display: none; align-items: center; justify-content: center; flex-direction: column;
    color: #8e8e93; gap: 10px; text-align: center; padding: 24px;
  }
  .empty .big { font-size: 40px; }

  /* 手机端: 上下堆叠 */
  @media (max-width: 860px) {
    .main { flex-direction: column; height: auto; }
    .cal { width: 100%; border-right: none; border-bottom: 1px solid #d2d2d7; max-height: 56vh; }
    .reader { height: 78vh; }
  }
</style>
</head>
<body>

  <div class="main">
    <!-- 左侧栏: 头部信息 + 日历 -->
    <aside class="cal">
      <div class="sidebar-hero">
        <div class="logo">🌍</div>
        <div class="title">NEWS 每日简报</div>
        <div class="badge">📡 过去24小时重要资讯</div>
        <div class="footer-text">
          News 资讯工作台 · 每日自动抓取海外资讯并翻译推送<br>
          由 QClaw Agent 驱动 · <a href="https://gloriaetlaus-coder.github.io/news/">查看历史档案 →</a>
        </div>
      </div>

      <div class="cal-head">
        <button class="nav-btn" type="button" onclick="prev()" aria-label="上个月">‹</button>
        <div class="cal-title" id="cal-title">—</div>
        <button class="nav-btn" type="button" onclick="next()" aria-label="下个月">›</button>
      </div>
      <div class="weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="cal-hint">● 蓝点 = 当日有简报，点击即可查看</div>
    </aside>

    <!-- 右侧阅读 -->
    <section class="reader">
      <iframe id="frame" title="简报内容" style="display:none;"></iframe>
      <div class="empty" id="empty">
        <div class="big">🗓️</div>
        <div>点击左侧带蓝点的日期，查看那一天的海内外简报</div>
      </div>
    </section>
  </div>

<script>
  var DATES_URL = './dates.json';
  var BASE = 'https://gloriaetlaus-coder.github.io/news/';
  var dates = new Set();
  var view = { y: 0, m: 0 };
  var selected = null;
  var frame = document.getElementById('frame');
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }

  function init() {
    fetch(DATES_URL).then(function (r) { return r.ok ? r.json() : []; }).then(function (arr) {
      (arr || []).forEach(function (d) { dates.add(d); });
      var hash = location.hash.replace('#', '');
      if (hash && dates.has(hash)) selected = hash;
      else if (dates.size) selected = Array.from(dates).sort().pop();
      var t = new Date();
      if (selected) {
        var p = selected.split('-');
        view = { y: +p[0], m: +p[1] - 1 };
      } else {
        view = { y: t.getFullYear(), m: t.getMonth() };
      }
      render();
      if (selected) load(selected); else showEmpty();
    }).catch(function () {
      var t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; render(); showEmpty();
    });
  }

  function render() {
    var y = view.y, m = view.m;
    document.getElementById('cal-title').textContent = y + '年' + (m + 1) + '月';
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var first = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var t = new Date();
    var todayKey = ymd(t.getFullYear(), t.getMonth(), t.getDate());

    for (var i = 0; i < first; i++) grid.appendChild(makeCell(daysInPrev - first + 1 + i, true, null, todayKey));
    for (var d = 1; d <= daysInMonth; d++) grid.appendChild(makeCell(d, false, ymd(y, m, d), todayKey));
    var total = first + daysInMonth;
    var trail = Math.ceil(total / 7) * 7 - total;
    for (var k = 1; k <= trail; k++) grid.appendChild(makeCell(k, true, null, todayKey));
  }

  function makeCell(d, out, key, todayKey) {
    var c = document.createElement('div');
    c.className = 'cell' + (out ? ' out' : '');
    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = d;
    c.appendChild(num);
    if (!out) {
      if (key === todayKey) c.classList.add('today');
      if (key === selected) c.classList.add('selected');
      if (dates.has(key)) {
        c.classList.add('available');
        var dot = document.createElement('div');
        dot.className = 'dot';
        c.appendChild(dot);
        c.addEventListener('click', function () { select(key); });
      }
    }
    return c;
  }

  function select(key) {
    selected = key;
    if (history && history.replaceState) history.replaceState(null, '', '#' + key);
    else location.hash = key;
    render();
    load(key);
  }

  function load(key) {
    var p = key.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    document.getElementById('empty').style.display = 'none';
    frame.style.display = 'block';
    var url = BASE + p[0] + '/' + p[1] + '/' + p[2] + '/';
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
  }

  function showEmpty() {
    frame.style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  }

  function prev() { view.m--; if (view.m < 0) { view.m = 11; view.y--; } render(); }
  function next() { view.m++; if (view.m > 11) { view.m = 0; view.y++; } render(); }

  window.addEventListener('hashchange', function () {
    var hash = location.hash.replace('#', '');
    if (hash && dates.has(hash) && hash !== selected) select(hash);
  });

  init();
</script>
</body>
</html>
