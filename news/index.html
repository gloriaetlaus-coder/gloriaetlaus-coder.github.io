<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>📰 News · 每日简报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }

  /* 主体两栏 */
  .main { display: flex; height: 100vh; }

  /* 左侧栏: 头部信息 + 日历 */
  .cal {
    width: 360px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #d2d2d7;
    padding: 18px 18px 22px; overflow-y: auto;
    display: flex; flex-direction: column;
    position: relative; transition: width 0.3s ease, padding 0.3s ease;
  }

  /* 折叠按钮 */
  .collapse-btn {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px;
    border: 1px solid #e5e9f2; background: #ffffff; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #6b7280; font-weight: 700;
    transition: all 0.2s; z-index: 5;
    padding: 0;
  }
  .collapse-btn:hover { background: #f5f5f7; color: #1d1d1f; }

  /* 折叠状态 */
  .main.collapsed .cal {
    width: 36px; padding: 10px 4px;
    border-right: none;
    overflow: hidden;
    background: transparent;
  }
  .main.collapsed .cal > *:not(.collapse-btn):not(.mobile-cal-label) { display: none; }
  .main.collapsed .collapse-btn {
    position: static; margin: 0 auto;
    border-color: #d2d2d7;
  }

  /* 顶部信息块(原来是独立 headline, 现在合并到日历上方) */
  .sidebar-hero {
    text-align: center; padding: 14px 14px 18px;
    background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
    border: 1px solid #e5e9f2; border-radius: 14px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(99, 102, 241, 0.05);
  }
  .sidebar-hero .logo { font-size: 1.8rem; margin-bottom: 4px; }
  .sidebar-hero .title {
    font-size: 1.15rem; font-weight: 800; color: #4338ca;
    letter-spacing: 1.5px; margin-bottom: 8px;
  }
  .sidebar-hero .badge {
    display: inline-block; padding: 4px 14px;
    background: #eef2ff; border: 1px solid #c7d2fe;
    border-radius: 20px; font-size: 0.72rem; color: #4338ca; font-weight: 500;
    margin-bottom: 12px;
  }
  .sidebar-hero .footer-text {
    font-size: 0.72rem; color: #8e8e93; line-height: 1.6;
  }
  .sidebar-hero .footer-text a { color: #0071e3; text-decoration: none; }
  .sidebar-hero .footer-text a:hover { text-decoration: underline; }

  /* 日历控件 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .nav-btn {
    width: 30px; height: 30px; border: none; background: #f5f5f7; border-radius: 50%;
    cursor: pointer; font-size: 14px; color: #1d1d1f; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #e8e8ed; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekdays div { text-align: center; font-size: 11px; color: #8e8e93; padding: 4px 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cell {
    aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%; cursor: default; position: relative;
  }
  .cell .num {
    font-size: 14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background 0.12s;
  }
  .cell.out { color: #c7c7cc; }
  .cell.available { cursor: pointer; }
  .cell.available:hover .num { background: #e8e8ed; }
  .cell.today .num { background: #ff3b30; color: #ffffff; font-weight: 600; }
  .cell.selected .num { background: #0071e3; color: #ffffff; font-weight: 600; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #0071e3; margin-top: 3px; }
  .cell.today .dot, .cell.selected .dot { background: #ffffff; }
  .cal-hint { margin-top: 14px; font-size: 12px; color: #8e8e93; line-height: 1.6; text-align: center; }
  .mobile-cal-label { display: none; }

  /* 右侧阅读区 */
  .reader { flex: 1; display: block; background: #f5f5f7; min-width: 0; align-self: flex-start; }
  iframe { width: calc(100% + 20px); margin-left: -10px; display: block; border: 0; background: transparent; }

  .empty {
    flex: 1; display: none; align-items: center; justify-content: center; flex-direction: column;
    color: #8e8e93; gap: 10px; text-align: center; padding: 24px;
  }
  .empty .big { font-size: 40px; }

  /* 手机 / 窄屏 + Safari「请求桌面版网站」模式(980px) 都走紧凑布局, 关键规则 !important 兜底 */
  @media (max-width: 1024px) {
    /* 移动端标题已用 mobile-cal-label, 隐藏桌面侧栏 hero 避免重复 */
    .sidebar-hero { display: none !important; }
    .main {
      flex-direction: column !important;
      height: auto !important;
      min-height: 100vh;
    }
    .cal {
      width: 100% !important;
      border-right: none;
      padding: 10px 12px 12px;
      overflow-x: hidden;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .reader {
      flex: 0 0 auto;
      height: auto;
      width: 100%;
    }
    /* 紧凑 hero */
    .sidebar-hero {
      padding: 8px 10px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px; text-align: left;
      border-radius: 10px;
    }
    .sidebar-hero .logo { font-size: 1.3rem; margin-bottom: 0; }
    .sidebar-hero .title { font-size: 0.92rem; margin-bottom: 0; letter-spacing: 1px; }
    .sidebar-hero .badge, .sidebar-hero .footer-text { display: none; }
    .cal-head { margin-bottom: 6px; }
    .cal-title { font-size: 13px; }
    .nav-btn { width: 26px; height: 26px; font-size: 12px; }
    .weekdays div { font-size: 10px; padding: 2px 0; }
    .grid { gap: 2px; }
    .cell .num { font-size: 12px; width: 26px; height: 26px; }
    .dot { width: 3px; height: 3px; margin-top: 2px; }
    .cal-hint { display: none; }
    /* 折叠态: 顶部薄条 */
    .main.collapsed .cal {
      width: 100% !important;
      padding: 6px 12px !important;
      display: flex !important; align-items: center; justify-content: space-between;
      background: #ffffff;
      min-height: 36px;
    }
    /* 移动端顶部标题栏: 🌍 + NEWS 每日简报 (始终可见, 点击地球展开/收起) */
    .mobile-cal-label {
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 0 12px;
      cursor: pointer;
      width: 100%;
      white-space: nowrap;
    }
    .mobile-cal-label .globe { font-size: 34px; line-height: 1; }
    .mobile-cal-label .title-text {
      display: inline-block;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 800;
      color: #4f46e5;
      letter-spacing: 0.5px;
    }
    /* 移动端用 🌍 当折叠按钮, 隐藏原 › 按钮 */
    .collapse-btn { display: none !important; }
    /* 禁止横向滚动 + 确保内容满宽 */
    html, body {
      overflow-x: hidden !important; overflow-y: auto;
      max-width: 100vw; width: 100%;
      position: relative;
      touch-action: pan-y;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
    }
    body { max-width: 100vw !important; }
    .main { width: 100% !important; overflow-x: hidden; touch-action: pan-y; }
    .reader { width: 100% !important; overflow-x: hidden; touch-action: pan-y; }
    /* iframe 用外层 div 物理裁剪 (iframe 比 div 宽 20px, 边缘 10px 橡皮筋被吃掉) */
    .reader { overflow: hidden; max-width: 100vw; width: 100%; }
    .iframe-clip {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: calc(100% + 20px) !important;
      margin-left: -10px !important;
      display: block;
      border: 0;
      background: transparent;
    }
  }
</style>
</head>
<body>

  <div class="main">
    <!-- 左侧栏: 头部信息 + 日历 -->
    <aside class="cal">
      <button class="collapse-btn" type="button" onclick="toggleCollapse()" aria-label="折叠/展开侧栏" id="collapse-btn">‹</button>
      <div class="mobile-cal-label" onclick="toggleCollapse()" role="button" aria-label="展开/收起日历">
        <span class="globe">🌍</span>
        <span class="title-text">NEWS&nbsp;每日简报</span>
      </div>
      <div class="sidebar-hero">
        <div class="logo">🌍</div>
        <div class="title">NEWS 每日简报</div>
        <div class="badge">📡 过去24小时重要资讯</div>
        <div class="footer-text">
          News 资讯工作台 · 每日自动抓取海外资讯并翻译推送
        </div>
      </div>

      <div class="cal-head">
        <button class="nav-btn" type="button" onclick="prev()" aria-label="上个月">‹</button>
        <div class="cal-title" id="cal-title">—</div>
        <button class="nav-btn" type="button" onclick="next()" aria-label="下个月">›</button>
      </div>
      <div class="weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="cal-hint">● 蓝点 = 当日有简报，点击即可查看</div>
    </aside>

    <!-- 右侧阅读 -->
    <section class="reader">
      <div class="iframe-clip"><iframe id="frame" title="简报内容" style="display:none;"></iframe></div>
      <div class="empty" id="empty">
        <div class="big">🗓️</div>
        <div>点击左侧带蓝点的日期，查看那一天的海内外简报</div>
      </div>
    </section>
  </div>

<script>
  var DATES_URL = './dates.json';
  var BASE = 'https://gloriaetlaus-coder.github.io/news/';
  var dates = new Set();
  var view = { y: 0, m: 0 };
  var selected = null;
  var frame = document.getElementById('frame');
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }

  function applyResponsiveCollapse() {
    var main = document.querySelector('.main');
    var btn = document.getElementById('collapse-btn');
    if (window.innerWidth <= 1024) {
      main.classList.add('collapsed');
      btn.textContent = '›';
      btn.setAttribute('aria-label', '展开侧栏');
    }
  }

  function init() {
    applyResponsiveCollapse();
    fetch(DATES_URL).then(function (r) { return r.ok ? r.json() : []; }).then(function (arr) {
      (arr || []).forEach(function (d) { dates.add(d); });
      var hash = location.hash.replace('#', '');
      if (hash && dates.has(hash)) selected = hash;
      else if (dates.size) selected = Array.from(dates).sort().pop();
      var t = new Date();
      if (selected) {
        var p = selected.split('-');
        view = { y: +p[0], m: +p[1] - 1 };
      } else {
        view = { y: t.getFullYear(), m: t.getMonth() };
      }
      render();
      if (selected) load(selected); else showEmpty();
    }).catch(function () {
      var t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; render(); showEmpty();
    });
  }

  function render() {
    var y = view.y, m = view.m;
    document.getElementById('cal-title').textContent = y + '年' + (m + 1) + '月';
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var first = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var t = new Date();
    var todayKey = ymd(t.getFullYear(), t.getMonth(), t.getDate());

    for (var i = 0; i < first; i++) grid.appendChild(makeCell(daysInPrev - first + 1 + i, true, null, todayKey));
    for (var d = 1; d <= daysInMonth; d++) grid.appendChild(makeCell(d, false, ymd(y, m, d), todayKey));
    var total = first + daysInMonth;
    var trail = Math.ceil(total / 7) * 7 - total;
    for (var k = 1; k <= trail; k++) grid.appendChild(makeCell(k, true, null, todayKey));
  }

  function makeCell(d, out, key, todayKey) {
    var c = document.createElement('div');
    c.className = 'cell' + (out ? ' out' : '');
    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = d;
    c.appendChild(num);
    if (!out) {
      if (key === todayKey) c.classList.add('today');
      if (key === selected) c.classList.add('selected');
      if (dates.has(key)) {
        c.classList.add('available');
        var dot = document.createElement('div');
        dot.className = 'dot';
        c.appendChild(dot);
        c.addEventListener('click', function () { select(key); });
      }
    }
    return c;
  }

  function select(key) {
    selected = key;
    if (history && history.replaceState) history.replaceState(null, '', '#' + key);
    else location.hash = key;
    render();
    load(key);
    // 手机端选完日期自动收起日历, 把空间留给简报正文
    if (window.innerWidth <= 1024) {
      var main = document.querySelector('.main');
      if (!main.classList.contains('collapsed')) toggleCollapse();
    }
  }

  function resizeIframe() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      var h = Math.max(
        doc.documentElement ? doc.documentElement.scrollHeight : 0,
        doc.body ? doc.body.scrollHeight : 0
      );
      frame.style.height = (h + 4) + 'px';  // +4 防止舍入误差造成最后一行被裁
    } catch(e) { /* 同源才访问; cross-origin 时保持默认高度 */ }
  }
  frame.addEventListener('load', resizeIframe);

  function load(key) {
    var p = key.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    document.getElementById('empty').style.display = 'none';
    frame.style.display = 'block';
    var url = BASE + p[0] + '/' + p[1] + '/' + p[2] + '/';
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
  }

  function showEmpty() {
    frame.style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  }

  function prev() { view.m--; if (view.m < 0) { view.m = 11; view.y--; } render(); }
  function next() { view.m++; if (view.m > 11) { view.m = 0; view.y++; } render(); }

  function toggleCollapse() {
    var main = document.querySelector('.main');
    var btn = document.getElementById('collapse-btn');
    main.classList.toggle('collapsed');
    btn.textContent = main.classList.contains('collapsed') ? '›' : '‹';
    btn.setAttribute('aria-label', main.classList.contains('collapsed') ? '展开侧栏' : '折叠侧栏');
  }

  window.addEventListener('hashchange', function () {
    var hash = location.hash.replace('#', '');
    if (hash && dates.has(hash) && hash !== selected) select(hash);
  });
  window.addEventListener('resize', applyResponsiveCollapse);

  init();
</script>
<script>
  // 终极拦截: 页面水平 touchmove 直接 preventDefault (iframe 边缘橡皮筋 + 任何横滑)
  (function(){
    var sx=0, sy=0, isH=false;
    document.addEventListener('touchstart', function(e){
      var t=e.touches[0]; sx=t.clientX; sy=t.clientY; isH=false;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
      if (isH) { e.preventDefault(); return; }
      var t=e.touches[0]; var dx=Math.abs(t.clientX-sx); var dy=Math.abs(t.clientY-sy);
      if (dx>dy && dx>6) { isH=true; e.preventDefault(); }
    }, {passive:false});
  })();
  </script>
<script>
  // 注册 Service Worker (v=2 强制浏览器重抓 SW 文件)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'RELOAD') { window.location.reload(); }
    });
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      window.location.reload();
    });
    navigator.serviceWorker.register('/news/sw.js?v=2').then(function(reg) {
      reg.update();
    }).catch(function(err) { console.log('SW:', err); });
  }
  </script>
</body>
</html>
