<!DOCTYPE html>
<!-- ============================================================
     今朝·My Day — 情绪抽卡工具
     线上地址: gloriaetlaus-coder.github.io
     ============================================================

5. slogan完整：英文"How's Your Day?" + 中文"今天过得怎么样？" 上下不被截断
     6. 魔法按钮点击：.mood-bubbles容器必须 pointer-events:none、.mood-chip/icons用 pointer-events:auto，点击魔法棒能翻转抽卡（不要被容器遮挡拦截）
     7. 底部文字动效：.wand-label（点击魔法棒随机抽一张）与 .sign-back-hint（轻点卡片返回首页）都必须 = slogan 同款三重动画(title-float/shimmer/breathe)，且为银白渐变、放大字号、无下划线
     8. 底部无悬空：.app 必须有 min-height:100dvh + flex垂直居中，卡片下方不留大片空白
     9. 卡片高度：max-width:600px 用 min(76vh,600px)，max-width:360px 用 min(78vh,580px)
     10. 释义末句情绪价值：每条释义最后一句要给用户正向情绪价值（夸赞/治愈/鼓励），不要冷冰冰科普
     11. 品牌角标：卡片右上角显示"今朝·Good day"
     12. 控制台零报错（favicon 404除外）
     13. slogan颜色：英文/中文均银白渐变（#FFFFFF→#E8DEF5→#D4C5ED）
     14. 释义排版：连续段落（display:inline），无段间空行
     15. 保存图片：触屏设备弹层长按保存；保存图主题词明亮紫色 #9B82D4
     16. 中文slogan上移：title-sub margin-top 为负值，整体上移约0.5cm
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7A5FC0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今朝·Good day</title>
<style>
/* 自托管宋体子集 — 手机端与 PC 字体完全一致 */
@font-face {
  font-family: "Songti Self";
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  src: url(./SongtiSelf-Regular.woff2) format("woff2");
}
@font-face {
  font-family: "Songti Self";
  font-weight: 700;
  font-style: normal;
  font-display: swap;
  src: url(./SongtiSelf-Bold.woff2) format("woff2");
}
/* Songti Self weight 600 removed: data identical to weight 700, browser falls back to 700 */
/* Songti Self weight 800 removed: data identical to weight 700, browser falls back to 700 */
@font-face {
  font-family: "CorpSrcWinSong";  /* 司源赢宋 — SIL OFL 1.1 */
  font-weight: 700;
  font-style: italic;
  font-display: swap;
  src: url(./CorpSrcWinSong-BoldItalic.woff2);
}


:root {
  --primary: #7A5FC0;
  --primary-deep: #5C42A6;
  --primary-light: #B8A4DC;
  --primary-soft: #D4C5E8;
  --primary-pale: #F2EBFA;
  --primary-mist: #FAF6FF;
  --bg-1: #FAF7FF;
  --bg-2: #EFE6F8;
  --bg-3: #E5D9F2;
  --text: #2A1F3D;
  --text-soft: #5A4A75;
  --text-muted: #8B7AA6;
  --line: rgba(122, 95, 192, 0.14);
  --white: #ffffff;
  --shadow-lg: 0 18px 48px rgba(122, 95, 192, 0.16);
  --shadow-md: 0 8px 24px rgba(122, 95, 192, 0.12);
  --shadow-sm: 0 4px 12px rgba(122, 95, 192, 0.08);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --font-cn: "Songti Self", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", "宋体", serif;
  /* 手机端中文：系统宋体优先，避免 Noto Serif SC 在手机上渲染过粗 */
  --font-cn-mobile: "Songti Self", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", "宋体", serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  padding-top: env(safe-area-inset-top);
  font-family: var(--font-cn);
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(184, 164, 220, 0.18) 0%, transparent 50%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  min-height: 100vh;
  min-height: 100svh;  /* svh=小视口(地址栏可见时)，确保内容不超出可见区域 */
  overflow-x: hidden;
  scroll-behavior: auto;  /* 禁止 smooth scroll，防止移动端地址栏收起时自动滚动 */
  scroll-padding-top: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* 强制移动端打开时从顶端开始，不偏移 */
@media (max-width: 600px) {
  html { scroll-behavior: auto; }
  body { scroll-behavior: auto; }
}

/* ====================================================
   银光呼吸发光背景 — 底图之下的银色光芒
   ==================================================== */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-glow .glow-orb {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(220, 210, 245, 0.30) 40%,
    rgba(200, 190, 235, 0.12) 65%,
    transparent 75%);
  filter: blur(36px);
  opacity: 0.35;
  animation: orb-breathe 6s ease-in-out infinite;
}
.bg-glow .glow-orb.orb1 {
  width: 420px; height: 420px;
  top: -120px; left: -80px;
}
.bg-glow .glow-orb.orb2 {
  width: 480px; height: 480px;
  bottom: -160px; right: -120px;
  animation-delay: 2s;
}
.bg-glow .glow-orb.orb3 {
  width: 340px; height: 340px;
  top: 42%; left: 55%;
  animation-delay: 3.2s;
}
.bg-glow .glow-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.75) 30%,
    rgba(215, 215, 235, 0.5) 50%,
    rgba(255, 255, 255, 0.75) 70%,
    transparent 100%);
  filter: blur(0.4px);
  opacity: 0.28;
  animation: line-shimmer 7s ease-in-out infinite;
}
.bg-glow .glow-line.ln1 { top: 22%; left: -5%; width: 110%; }
.bg-glow .glow-line.ln2 { top: 58%; left: -5%; width: 110%; animation-delay: 3.5s; }
.bg-glow .glow-line.ln3 { top: 80%; left: -5%; width: 110%; animation-delay: 1.2s; }
.bg-glow .glow-star {
  position: absolute;
  color: rgba(255, 255, 255, 0.8);
  font-size: 9px;
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
  animation: star-twinkle 3.2s ease-in-out infinite;
  opacity: 0;
}
.bg-glow .glow-star.gs1 { top: 14%; left: 18%; animation-delay: 0s; }
.bg-glow .glow-star.gs2 { top: 34%; right: 12%; animation-delay: 1.1s; }
.bg-glow .glow-star.gs3 { bottom: 30%; left: 22%; animation-delay: 0.6s; }
.bg-glow .glow-star.gs4 { bottom: 14%; right: 20%; animation-delay: 1.7s; }
.bg-glow .glow-star.gs5 { top: 60%; left: 10%; animation-delay: 2.2s; }
.bg-glow .glow-star.gs6 { bottom: 44%; right: 8%; animation-delay: 0.9s; }

/* ====== 银白色流星雨（Canvas 流线型） ====== */
.meteor-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
#meteor-canvas {
  display: block;
  width: 100%;
  height: 100%;
}


@keyframes orb-breathe {
  0%, 100% { opacity: 0.25; transform: scale(0.9); }
  50%      { opacity: 0.55; transform: scale(1.12); }
}
@keyframes line-shimmer {
  0%, 100% { opacity: 0.12; transform: translateX(-18px); }
  50%      { opacity: 0.5;  transform: translateX(18px); }
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.25); }
}

body::before {
  content: '';
  position: fixed;
  top: -160px;
  right: -120px;
  width: 380px;
  height: 380px;
  background: radial-gradient(circle, rgba(184, 164, 220, 0.32) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  bottom: -200px;
  left: -120px;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(155, 126, 222, 0.22) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app {
  padding-top: env(safe-area-inset-top);
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  padding: 10px 22px 8px;
  z-index: 1;
  /* 不设 min-height — 让内容自然撑开，从顶端开始，避免 dvh/vh 包含地址栏区域导致下推偏移 */
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

/* ====================================================
   HEADER — 浅紫色 + 发光 + 呼吸 + 漂浮
   ==================================================== */
.header {
  position: relative;
  text-align: center;
  margin: 0 0 0;  /* header底部不留白 */
  padding: 14px 0 4px;
  min-height: 82px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

/* 人工审核入口按钮（首页右上角，不参与卡片布局） */
.review-entry-btn {
  position: absolute;
  top: 12px;
  right: 14px;
  z-index: 5;
  padding: 6px 12px;
  font-size: 12px;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: #6C52A8;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(184, 164, 220, 0.5);
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.25s ease;
  box-shadow: 0 2px 8px rgba(122, 95, 192, 0.10);
}
.review-entry-btn:hover {
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 14px rgba(122, 95, 192, 0.22);
  transform: translateY(-1px);
}

.title-halo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 210px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center,
    rgba(184, 164, 220, 0.32) 0%,
    rgba(155, 126, 222, 0.12) 35%,
    transparent 70%);
  filter: blur(28px);
  pointer-events: none;
  z-index: 0;
  animation: halo-breathe 5s ease-in-out infinite;
}

@keyframes halo-breathe {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
  50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
}

.title {
  position: relative;
  z-index: 2;
  font-family: 'Great Vibes', 'Allura', 'Pacifico', 'Snell Roundhand', 'Apple Chancery', cursive;
  font-size: 52px;
  font-weight: 700;
  line-height: 1.3;
  margin: 0;
  padding: 8px 20px 8px 12px;
  letter-spacing: 0;
  white-space: nowrap;
  overflow: visible;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation:
    title-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}

/* 中文副标题 — 与英文 slogan 完全一致的三重动画：float + shimmer + breathe */
.title-sub {
  position: relative;
  z-index: 2;
  margin: 0;
  font-family: "CorpSrcWinSong", var(--font-cn);  /* 司源赢宋 — SIL OFL 1.1 */
  font-size: 48px;
  font-weight: 800;
  letter-spacing: 6px;  /* 缩小字间距，使7字总宽接近英文 */
  white-space: nowrap;
  font-style: italic;
  display: inline-block;
  padding: 8px 8px 8px 22px;  /* 左侧 padding 加大 22px，让"今"右移约 10px 对齐英文 H */
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #F4EEFC 25%,
    #E4DAF2 50%,
    #F4EEFC 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation:
    title-sub-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}
/* 移除旧伪元素扫光 — 已统一为 shimmer 渐变动画 */
.title-sub::after {
  content: none;
}

@keyframes title-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}

/* 中文专用浮动：skewX(-16deg) 补偿司源赢宋无合成斜体，视觉接近旧版宋体 italic+skewX(-8deg) 的叠加倾斜 */
@keyframes title-sub-float {
  0%, 100% { transform: skewX(-16deg) translateY(0); }
  50%      { transform: skewX(-16deg) translateY(-7px); }
}

@keyframes title-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}
@keyframes sub-fade {
  0%, 100% { opacity: 0.82; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@keyframes title-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(160, 140, 210, 0.50))
      drop-shadow(0 0 22px rgba(180, 165, 220, 0.35))
      drop-shadow(0 0 40px rgba(212, 197, 232, 0.20));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(160, 140, 210, 0.75))
      drop-shadow(0 0 36px rgba(180, 165, 220, 0.55))
      drop-shadow(0 0 60px rgba(212, 197, 232, 0.35));
  }
}

.sparkle {
  position: absolute;
  font-size: 12px;
  color: var(--primary-light);
  filter: drop-shadow(0 0 4px rgba(155, 126, 222, 0.8));
  animation: sparkle 3s ease-in-out infinite;
  z-index: 1;
  opacity: 0;
}
.sparkle.s1 { top: 25%; left: 18%;  animation-delay: 0s;   }
.sparkle.s2 { top: 18%; right: 16%; animation-delay: 1.2s; }
.sparkle.s3 { bottom: 22%; left: 14%; animation-delay: 0.6s; }
.sparkle.s4 { bottom: 18%; right: 18%; animation-delay: 1.8s; }

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0.6); }
  50%      { opacity: 1; transform: scale(1.2); }
}

/* ====================================================
   MOOD BUBBLES — 首页情绪泡泡（漂浮在卡面上）
   ==================================================== */
.mood-bubbles {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: 1fr 1fr;
  grid-template-columns: repeat(3, auto);
  justify-content: center;
  align-content: space-between;
  justify-items: center;
  align-items: center;
  gap: 8px 8px;
  padding: 16px 0;
  z-index: 5;
  /* 容器不拦截点击：只让子按钮可点，魔法棒（z-index 下方）可正常接收点击 */
  pointer-events: none;
}
/* 上排（开心/沮丧/伤心）& 下排（平静/随机/赞美）：两行之间留出空隙，
   魔法棒（卡片中心 110px）正好从中露出，不被遮挡 */
.mood-chip:nth-child(1) { grid-row: 1; grid-column: 1; }
.mood-chip:nth-child(2) { grid-row: 1; grid-column: 2; }
.mood-chip:nth-child(3) { grid-row: 1; grid-column: 3; }
.mood-chip:nth-child(4) { grid-row: 2; grid-column: 1; }
.mood-chip:nth-child(5) { grid-row: 2; grid-column: 2; }
.mood-chip:nth-child(6) { grid-row: 2; grid-column: 3; }
.mood-bubbles.hidden { display: none; }

.mood-bubble {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-bubble:nth-child(1) { animation-delay: 0s; }
.mood-bubble:nth-child(2) { animation-delay: .5s; }
.mood-bubble:nth-child(3) { animation-delay: 1s; }
.mood-bubble:nth-child(4) { animation-delay: .2s; }
.mood-bubble:nth-child(5) { animation-delay: .8s; }
.mood-bubble:nth-child(6) { animation-delay: .35s; }
.mood-bubble:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 8px 24px rgba(122, 95, 192, 0.2),
    0 0 24px rgba(255, 255, 255, 0.7) inset,
    0 0 16px rgba(184, 164, 220, 0.4);
}
.mood-bubble:active { transform: scale(.94); }

@keyframes bubble-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* 兼容旧样式名 */
.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  pointer-events: auto;  /* 子按钮恢复可点击（父容器已 pointer-events:none） */
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-chip:nth-child(2) { animation-delay: .5s; }
.mood-chip:nth-child(3) { animation-delay: 1s; }
.mood-chip:nth-child(4) { animation-delay: .2s; }
.mood-chip:nth-child(5) { animation-delay: .8s; }
.mood-chip:nth-child(6) { animation-delay: .35s; }
.mood-chip:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 6px 20px rgba(122, 95, 192, 0.25),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 16px rgba(184, 164, 220, 0.45),
    0 0 30px rgba(155, 126, 222, 0.3);
}
.mood-chip:active {
  transform: scale(.94);
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.2),
    0 0 10px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.3);
}

/* ====================================================
   CATEGORY CHIPS — 已移除（用户要求去掉分类按钮，卡片上移）
   保留样式定义以便兼容，但容器不再渲染
   ==================================================== */
.category-list {
  display: none;
}

.chip {
  padding: 11px 4px;
  text-align: center;
  font-size: 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.65);
  color: var(--text-soft);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.22s ease;
  font-family: inherit;
  font-weight: 700;   /* 中文加粗 */
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  white-space: nowrap;
}

.chip:active { transform: scale(0.94); }
.chip.active {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 6px 16px rgba(122, 95, 192, 0.32);
}

/* ====================================================
   SIGN STAGE — 竖着的长方形签条
   ==================================================== */
.stage {
  margin-top: 13px;  /* 中卡间距≈0.5cm(约19px)，与英中间距均衡 */
  display: flex;
  flex-direction: column;
  align-items: center;
  perspective: 1200px;
  position: relative;  /* 让情绪泡泡 absolute 定位到卡面上 */
}

.sign-card-outer {
  position: relative;
  width: 100%;
  max-width: min(92vw, 320px);   /* 手机占屏更大，PC不超过320 */
  height: 558px;  /* 卡片高度延长1cm ≈ 38px */
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.sign-card-outer.flipped { transform: rotateY(180deg); }

.sign-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: visible;  /* 允许斜体文字溢出，靠 padding 控制视觉边界 */
}

/* ---------- FRONT ---------- */
.sign-face.front {
  background:
    radial-gradient(circle at 80% 10%, rgba(212, 197, 232, 0.5) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(184, 164, 220, 0.3) 0%, transparent 50%),
    linear-gradient(145deg, #fff 0%, var(--primary-mist) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: visible;  /* 让魔法棒光晕、水面涟漪可以扩散出卡片，营造叩击水面的扩散感 */
}

.sign-illustration {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.sign-illustration::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(122, 95, 192, 0.3);
  animation: rotate 14s linear infinite;
}

.sign-illustration .icon {
  font-size: 52px;
  animation: gentleFloat 3.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 12px rgba(122, 95, 192, 0.3));
}

.wand-label {
  margin: 24px 0 0;
  font-size: 16px;
  font-weight: 700;
  font-style: italic;
  font-family: var(--font-cn);
  letter-spacing: 2px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  background: linear-gradient(135deg,
    #B8A4DC 0%,
    #9B82D4 25%,
    #7A5FC0 50%,
    #9B82D4 75%,
    #B8A4DC 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: title-float 4.5s ease-in-out infinite,
             title-shimmer 6s linear infinite,
             title-breathe 4.5s ease-in-out infinite;
  filter:
    drop-shadow(0 0 6px rgba(155, 126, 222, 0.85))
    drop-shadow(0 0 14px rgba(140, 110, 200, 0.55));
}
.wand-label:hover { opacity: 0.85; }

/* 第二阶段审核入口按钮 */
.qa-btn {
  display: inline-block;
  margin: 14px 0 0;
  padding: 6px 18px;
  font-size: 12px;
  font-weight: 700;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  letter-spacing: 0.5px;
  color: #7e60c0;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(184, 164, 220, 0.4);
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: all 0.25s ease;
  box-shadow: 0 2px 8px rgba(122, 95, 192, 0.08);
}
.qa-btn:hover {
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 14px rgba(122, 95, 192, 0.18);
  transform: translateY(-1px);
}
.qa-btn:active { transform: scale(0.95); }

@keyframes gentleFloat {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}
@keyframes rotate { to { transform: rotate(360deg); } }

.tap-hint {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 6px;
  margin-bottom: 24px;
  font-weight: 700;   /* 中文加粗 */
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
  color: white;
  border: none;
  padding: 14px 36px;
  border-radius: 100px;
  font-size: 14px;
  letter-spacing: 6px;
  cursor: pointer;
  font-weight: 700;   /* 中文加粗 */
  font-family: inherit;
  box-shadow: 0 10px 26px rgba(122, 95, 192, 0.4);
  transition: all 0.2s;
}
.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 0 4px 14px rgba(122, 95, 192, 0.36);
}
.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

/* ---------- BACK — 竖签条 + 半透发光呼吸 ---------- */
.sign-face.back {
  transform: rotateY(180deg);
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(24px) saturate(125%);
  -webkit-backdrop-filter: blur(24px) saturate(125%);
  border: 1px solid rgba(184, 164, 220, 0.35);
  border-radius: 18px;
  padding: 24px 26px 14px;
  display: flex;
  flex-direction: column;
  animation: card-breathe 5s ease-in-out infinite;
}

@keyframes card-breathe {
  0%, 100% {
    background: rgba(255, 255, 255, 0.55);
    border-color: rgba(184, 164, 220, 0.32);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 8px 32px rgba(122, 95, 192, 0.10),
      0 0 40px rgba(155, 126, 222, 0.12);
  }
  50% {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(155, 126, 222, 0.45);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.8) inset,
      0 8px 32px rgba(122, 95, 192, 0.18),
      0 0 70px rgba(155, 126, 222, 0.28);
  }
}

.sign-meta {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.sign-date {
  justify-self: start;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 1px;
  white-space: nowrap;
}

.sign-weather {
  justify-self: center;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 1.5px;
  white-space: nowrap;
}

.sign-brand {
  justify-self: end;
  color: #B8A6DA;
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 600;
  font-style: italic;
  white-space: nowrap;
}

/* 签诗 — 非中文（英/日/德等）银白光泽 + shimmer + 呼吸发光 */
.sign-poem {
  margin: 0;
  font-size: 34px;
  line-height: 1.4;
  font-weight: 600;
  font-style: italic;
  font-synthesis: none;  /* 禁止字体合成，斜体由 transform:skewX 实现 */
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-wrap: balance;
  text-align: center;
  padding: 4px 12px 8px;  /* 两侧留白防止截断 */
  opacity: 0;  /* 必须显式设为 0，否则 fadeUp 延迟期间英文主题词先于其他元素可见 */
  /* 银白渐变 + shimmer 扫光（与英文 slogan 一致）*/
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.55s forwards, poem-silver-shimmer 6s linear 0.55s infinite;
  filter:
    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))
    drop-shadow(0 0 10px rgba(140, 120, 190, 0.55))
    drop-shadow(0 1px 2px rgba(80, 60, 140, 0.3));
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
}

/* 中文签诗 — 斜体+发光由 .skew-wrap 统一处理，此处仅保留排版属性 */
.sign-poem.sign-poem-cn {
  font-family: var(--font-cn);
  font-size: clamp(24px, 6vw, 34px);
  letter-spacing: 1px;
  font-weight: 700;
  font-style: italic;
  font-synthesis: none;
  max-width: 100%;
  box-sizing: border-box;
  overflow-wrap: break-word;
  word-break: keep-all;
  white-space: normal;
  text-wrap: balance;
  width: 100%;
  padding: 4px 12px 8px;
  position: relative;
  overflow: visible;
  animation: fadeUp 0.5s 0.55s forwards;
}

/* 移除旧的伪元素扫光效果 — 已改用 background-position shimmer 统一 */
.sign-poem.sign-poem-cn::after,
.sign-cn::after,
.sign-literal::after {
  content: none;
}

@keyframes cn-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

/* 中文主题词专用漂浮：保留 skewX 斜体 + translateY（与 title-sub-float 类似） */
@keyframes cn-float {
  0%, 100% { transform: skewX(-8deg) translateY(0); }
  50%      { transform: skewX(-8deg) translateY(-5px); }
}

.sign-poem.english {
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
  font-size: 34px;
  letter-spacing: 0;
  font-style: italic;
  line-height: 1.35;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
}

@keyframes poem-silver-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

.seg {
  display: inline-block;
  vertical-align: top;
}

/* 中文主题词短句：允许自然换行，不强制 nowrap */
.sign-poem.sign-poem-cn .seg {
  white-space: normal;
  overflow-wrap: break-word;
  word-break: keep-all;
  text-wrap: balance;
}

.sign-meaning .seg {
  display: inline;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

.sign-poem.english .seg {
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

@keyframes poem-fade-in {
  to { opacity: 1; }
}

.sign-content {
  flex: 1;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 8px 0 4px;
}

.sign-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;   /* 确保 block 级子元素内容居中 */
  width: 100%;
}

.sign-mid {
  display: flex;
  justify-content: center;
  align-items: center;
}

.sign-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
}

.sign-meaning {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: #8B7AA6;  /* 浅紫色，与首页提示语相近，可读性好 */
  text-align: center;
  letter-spacing: 0.5px;
  opacity: 0;
  animation: fadeUp 0.5s 0.5s forwards, meaning-breathe 5s ease-in-out 1s infinite;
  text-shadow: 0 0 6px rgba(184, 164, 220, 0.3);  /* 微弱案光 */
  font-family: var(--font-cn);
  font-weight: 600;
  padding: 0 14px;  /* 两侧留白防止截断 */
}

/* 释义专属：极克制呼吸发光，不加漂浮，只微调 text-shadow + opacity */
@keyframes meaning-breathe {
  0%, 100% {
    text-shadow: 0 0 6px rgba(184, 164, 220, 0.25);
    opacity: 0.88;
  }
  50% {
    text-shadow: 0 0 10px rgba(184, 164, 220, 0.45), 0 0 18px rgba(200, 180, 235, 0.15);
    opacity: 1;
  }
}

/* 中文主题词 — 斜体+发光由 .skew-wrap 统一处理，此处仅保留排版属性 */
.sign-cn {
  margin: 14px 0 0;
  font-size: clamp(24px, 6vw, 34px);
  text-align: center;
  letter-spacing: 0.5px;
  font-weight: 700;
  font-synthesis: none;
  font-family: var(--font-cn);
  font-style: italic;
  opacity: 0;
  overflow-wrap: break-word;
  word-break: keep-all;
  position: relative;
  overflow: visible;
  padding: 4px 16px 8px;
  max-width: 100%;
  box-sizing: border-box;
  width: 100%;
  animation: fadeUp 0.5s 0.55s forwards;
}

.skew-wrap {
  display: inline-block;
  max-width: 100%;
  margin: 0 auto;
  text-align: center;
  transform: skewX(-14deg);  /* 宋体无原生斜体字形，用 transform 物理倾斜实现斜体效果 */
  /* 渐变和 background-clip:text 必须在 skew-wrap 自身上，否则 transform 倾斜文字不可见 */
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: poem-silver-shimmer 6s linear infinite;
  filter:
    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))
    drop-shadow(0 0 10px rgba(140, 120, 190, 0.55))
    drop-shadow(0 1px 2px rgba(80, 60, 140, 0.3));
}

/* 中文直译 — 斜体+发光由 .skew-wrap 统一处理，此处仅保留排版属性 */
.sign-literal {
  margin: 10px 0 0;
  font-size: clamp(20px, 6.5vw, 26px);
  line-height: 1.35;
  text-align: center;
  letter-spacing: 1px;
  font-weight: 700;
  font-synthesis: none;
  font-family: var(--font-cn);
  font-style: italic;
  opacity: 0;
  overflow-wrap: break-word;
  word-break: keep-all;
  position: relative;
  overflow: visible;
  padding: 4px 16px 8px;
  animation: fadeUp 0.5s 0.58s forwards;
}

.sign-cn-en {
  margin: 10px 0 0;
  font-size: 34px;
  line-height: 1.35;
  text-align: center;
  letter-spacing: 0;
  font-weight: 700;
  font-synthesis: none;  /* 禁止字体合成，斜体由 transform:skewX 实现 */
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
  font-style: italic;
  opacity: 0;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  /* 非中文主题词 — 银白渐变 + shimmer + 呼吸发光（与 Slogan 统一） */
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.55s forwards, poem-silver-shimmer 6s linear 0.55s infinite;
  filter:
    drop-shadow(0 0 4px rgba(160, 140, 210, 0.85))
    drop-shadow(0 0 10px rgba(140, 120, 190, 0.55))
    drop-shadow(0 1px 2px rgba(80, 60, 140, 0.3));
  padding: 4px 16px 8px;
}

/* 中文诗的原文副题 — 银白渐变 + shimmer 扫光 */
.sign-cn-en.sub {
  font-size: 34px;
  font-weight: 600;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #E8DEF5 25%,
    #D4C5ED 50%,
    #E8DEF5 75%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.5s 0.58s forwards, poem-silver-shimmer 6s linear 0.58s infinite;
  filter:
    drop-shadow(0 0 5px rgba(180, 160, 230, 0.7))
    drop-shadow(0 0 12px rgba(160, 140, 210, 0.4))
    drop-shadow(0 1px 2px rgba(120, 100, 170, 0.2));
}

.sign-tip {
  margin: 0;
  font-size: 12px;
  line-height: 1.7;
  color: var(--primary-light);
  text-align: center;
  letter-spacing: 1px;
  font-weight: 700;  /* 中文加粗 */
  font-family: var(--font-cn);
  opacity: 0;
  animation: fadeUp 0.5s 0.6s forwards;
}

/* 出处 — 紧凑两行，无额外空行 */
.sign-source {
  margin: 8px 0 0;
  font-size: 11px;
  color: #A89BC4;  /* 银紫色，比释义#8B7AA6更浅，拉开视觉层次 */
  text-align: center;
  letter-spacing: 1.5px;
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.65s forwards;
  font-family: var(--font-cn);
  font-weight: 700;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: keep-all;
  padding: 0 8px;
  line-height: 1.2;  /* 压紧行高，消除两行间空行 */
}
.sign-source .source-line {
  display: block;
  line-height: 1.2;
  margin: 0;
  padding: 0;
}

/* 卡片外部提示：轻点卡片返回首页（在卡片下方，不在卡片内）
   放大字号 + 与 slogan 相同的三重动效（float + shimmer + breathe） */
.sign-back-hint {
  margin: 32px 0 0;
  font-size: 17px;
  color: var(--text-soft);
  text-align: center;
  letter-spacing: 2px;
  opacity: 0;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-weight: 700;
  font-style: italic;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(155, 126, 222, 0.5);
  transition: opacity 0.5s;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  background: linear-gradient(135deg,
    #B8A4DC 0%,
    #9B82D4 25%,
    #7A5FC0 50%,
    #9B82D4 75%,
    #B8A4DC 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: hint-float 4.5s ease-in-out infinite,
             hint-shimmer 6s linear infinite,
             hint-breathe 4.5s ease-in-out infinite;
}
.sign-back-hint.visible {
  opacity: 1;
  animation: fadeUp 0.5s 0.7s forwards,
             hint-float 4.5s ease-in-out infinite,
             hint-shimmer 6s linear infinite,
             hint-breathe 4.5s ease-in-out infinite;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(155, 126, 222, 0.5);
}

@keyframes hint-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes hint-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

@keyframes hint-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(160, 140, 210, 0.50))
      drop-shadow(0 0 22px rgba(180, 165, 220, 0.35));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(160, 140, 210, 0.75))
      drop-shadow(0 0 36px rgba(180, 165, 220, 0.55));
  }
}

@keyframes fadeUp {
  from { opacity: 0; }
  to { opacity: 1; }
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: auto;
  padding-top: 14px;
}

.btn-ghost {
  padding: 8px 6px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #6C52A8;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 999px;
  font-size: 13px;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  letter-spacing: 1px;
  box-shadow: 0 0 20px rgba(138, 100, 255, 0.25), 0 1px 2px rgba(255, 255, 255, 0.2) inset;
  animation: btn-float 3.5s ease-in-out infinite, btn-breathe 4s ease-in-out infinite;
  text-shadow: 0 1px 4px rgba(255, 255, 255, 0.3);
}
.btn-ghost:nth-child(2) { animation-delay: 0.5s, 0.3s; }
.btn-ghost:hover {
  box-shadow: 0 0 16px rgba(168, 130, 255, 0.45), 0 0 32px rgba(168, 130, 255, 0.25), 0 1px 2px rgba(255, 255, 255, 0.15) inset;
  border-color: rgba(168, 130, 255, 0.5);
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
}
.btn-ghost:active {
  transform: scale(0.96);
  box-shadow: 0 0 12px rgba(138, 100, 255, 0.2), 0 1px 2px rgba(255, 255, 255, 0.15) inset;
}
@keyframes btn-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes btn-breathe {
  0%, 100% { box-shadow: 0 0 16px rgba(138, 100, 255, 0.2), 0 1px 2px rgba(255, 255, 255, 0.2) inset; }
  50% { box-shadow: 0 0 24px rgba(138, 100, 255, 0.4), 0 1px 2px rgba(255, 255, 255, 0.3) inset; }
}
/* 首页按钮 — 略深 */
.btn-ghost.solid {
  background: rgba(122, 95, 192, 0.2);
  color: #4C3A92;
  border-color: rgba(122, 95, 192, 0.3);
}

/* ====================================================
   TOAST
   ==================================================== */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(42, 31, 61, 0.94);
  color: white;
  padding: 12px 22px;
  border-radius: 100px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  letter-spacing: 1px;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ====================================================
   WATER RIPPLE — 魔法棒叩击水面后的涟漪波纹
   ==================================================== */
/* 水波纹涟漪扩散 — 从卡片中心向外逐层扩散，延伸到卡片边缘之外 */
.water-ripple {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.2);
  opacity: 0;
  pointer-events: none;
  z-index: 10;  /* 提到卡片之上，让涟漪可见地扩散到卡片外 */
  /* 多重 box-shadow 模拟水面柔光晕染 */
  box-shadow:
    0 0 12px 4px rgba(200, 180, 240, 0.35),
    0 0 24px 8px rgba(180, 160, 230, 0.22),
    0 0 40px 12px rgba(160, 140, 220, 0.12);
}
/* ::before 和 ::after 作为第二、第三层涟漪 */
.water-ripple::before,
.water-ripple::after {
  content: '';
  position: absolute;
  inset: -4px;  /* 略大于父元素，造出层叠错位感 */
  border-radius: 50%;
  opacity: 0;
  border: 2px solid rgba(200, 180, 240, 0.45);
  box-shadow:
    0 0 16px 6px rgba(190, 170, 235, 0.2),
    0 0 32px 10px rgba(170, 150, 225, 0.1);
}
.water-ripple.active {
  animation: ripple-main 1.4s cubic-bezier(0.15, 0.55, 0.25, 1) both;
}
.water-ripple.active::before {
  animation: ripple-echo2 1.4s 0.18s cubic-bezier(0.15, 0.55, 0.25, 1) both;
}
.water-ripple.active::after {
  animation: ripple-echo3 1.4s 0.38s cubic-bezier(0.15, 0.55, 0.25, 1) both;
}

/* 主涟漪：从中心向外大幅扩散，延伸到卡片边缘之外 */
@keyframes ripple-main {
  0%   {
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 1;
    border: 3px solid rgba(220, 200, 250, 0.7);
    box-shadow:
      0 0 12px 4px rgba(200, 180, 240, 0.4),
      0 0 24px 8px rgba(180, 160, 230, 0.25),
      0 0 40px 12px rgba(160, 140, 220, 0.12);
  }
  30%  {
    opacity: 0.85;
    border-color: rgba(210, 190, 245, 0.55);
    box-shadow:
      0 0 20px 8px rgba(190, 170, 235, 0.28),
      0 0 40px 14px rgba(170, 150, 225, 0.16),
      0 0 60px 20px rgba(150, 130, 210, 0.08);
  }
  65%  {
    opacity: 0.35;
    border-color: rgba(200, 180, 240, 0.3);
    box-shadow:
      0 0 24px 10px rgba(180, 160, 230, 0.15),
      0 0 48px 16px rgba(160, 140, 220, 0.08),
      0 0 72px 24px rgba(140, 120, 200, 0.04);
  }
  100% {
    transform: translate(-50%, -50%) scale(14);
    opacity: 0;
    border-color: rgba(190, 170, 235, 0);
    box-shadow:
      0 0 0 0 rgba(180, 160, 230, 0),
      0 0 0 0 rgba(160, 140, 220, 0),
      0 0 0 0 rgba(140, 120, 200, 0);
  }
}

/* 第二层涟漪：稍延迟、稍小、颜色更淡 */
@keyframes ripple-echo2 {
  0%   {
    transform: scale(0.3);
    opacity: 0.9;
    border-color: rgba(210, 190, 245, 0.5);
    box-shadow:
      0 0 16px 6px rgba(190, 170, 235, 0.25),
      0 0 32px 10px rgba(170, 150, 225, 0.12);
  }
  35%  {
    opacity: 0.6;
    border-color: rgba(200, 180, 240, 0.35);
  }
  100% {
    transform: scale(10);
    opacity: 0;
    border-color: rgba(190, 170, 235, 0);
    box-shadow:
      0 0 0 0 rgba(190, 170, 235, 0),
      0 0 0 0 rgba(170, 150, 225, 0);
  }
}

/* 第三层涟漪：最后扩散、最淡 */
@keyframes ripple-echo3 {
  0%   {
    transform: scale(0.3);
    opacity: 0.7;
    border-color: rgba(205, 185, 245, 0.35);
    box-shadow:
      0 0 14px 5px rgba(185, 165, 235, 0.18),
      0 0 28px 9px rgba(165, 145, 220, 0.08);
  }
  40%  {
    opacity: 0.4;
  }
  100% {
    transform: scale(8);
    opacity: 0;
    border-color: rgba(190, 170, 235, 0);
    box-shadow:
      0 0 0 0 rgba(185, 165, 235, 0),
      0 0 0 0 rgba(165, 145, 220, 0);
  }
}

/* 点击魔法棒：叩击水面 —— 涟漪扩散 + 轻微下沉再弹起 */
.sign-illustration.tap-wave {
  animation: wand-tap 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave .icon {
  animation: wand-strike 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave::after {
  animation: tap-ripple 0.9s ease-out both;
}

@keyframes wand-tap {
  0%   { transform: translateY(0) scale(1); }
  18%  { transform: translateY(8px) scale(0.96); }
  32%  { transform: translateY(6px) scale(0.97); }
  55%  { transform: translateY(-14px) scale(1.08); }
  75%  { transform: translateY(-6px) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes wand-strike {
  0%   { transform: translateY(0) rotate(0deg); }
  18%  { transform: translateY(10px) rotate(-14deg) scale(0.9); }
  32%  { transform: translateY(8px) rotate(-10deg) scale(0.92); }
  55%  { transform: translateY(-18px) rotate(10deg) scale(1.12); }
  75%  { transform: translateY(-8px) rotate(4deg) scale(1.05); }
  100% { transform: translateY(0) rotate(0deg) scale(1); }
}

@keyframes tap-ripple {
  0%   { transform: scale(0.8); opacity: 0.9; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ====================================================
   SHAKE ANIMATION（已由水面波纹替代，保留定义不生效）
   ==================================================== */
.sign-card-outer.shaking {
  animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0); }
  15%  { transform: translateX(-8px) rotate(-1.5deg); }
  30%  { transform: translateX(8px)  rotate(1.5deg); }
  45%  { transform: translateX(-6px) rotate(-1deg); }
  60%  { transform: translateX(6px)  rotate(1deg); }
  75%  { transform: translateX(-4px) rotate(-0.6deg); }
  90%  { transform: translateX(4px)  rotate(0.6deg); }
}

  .sign-card-outer { max-width: min(92vw, 340px); height: min(78svh, 620px); }  /* svh=小视口高度，78%确保header+卡片+按钮一屏装下 */

  .sign-meaning { font-size: 15px; color: #8B7AA6; font-weight: 700; }  /* 手机端释义字号+字重增大，颜色与PC统一浅紫 */

}

@media (max-width: 360px) {

  .header { min-height: 44px; padding: 4px 0 2px; margin-bottom: 0; }

  .stage { margin-top: 8px; }  /* 中卡间距 13→8px 缩小约0.13cm */

  .category-list { grid-template-columns: repeat(4, 1fr); font-size: 11px; }

}

@media (min-width: 600px) {
