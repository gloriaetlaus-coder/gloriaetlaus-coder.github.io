    margin-bottom: 12px; position: relative;

  .en {

    padding-right: 34px;
  }
  .cn {
    margin-top: 10px; padding-left: 12px; border-left: 3px solid var(--tint);
    font-size: 14px; line-height: 1.75; color: var(--cn-text);

  body.mode-en .cn { display: none; }

            cn: "人形机器人（通用机器人）的实用性，大致等于：AI 软件有多出色，乘以机器人中 AI 芯片有多出色，再乘以机电灵巧度（尤其是手）有多出色。这三者都在指数级改善，而机器人的实用性，就是这三者相乘的结果。" }
        ]
      }
    ]
  }
};

var person = 'eileen';
var speechIdx = 0;

var personTabs = document.getElementById('personTabs');
var speechGrid = document.getElementById('speechGrid');
var speechView = document.getElementById('speechView');
var modeSwitch = document.getElementById('modeSwitch');
var modeButtons = modeSwitch.querySelectorAll('button');
var saved = null;
try { saved = localStorage.getItem('never-mode'); } catch (e) {}

function applyMode(mode) {
  document.body.classList.remove('mode-en', 'mode-cn');
  if (mode === 'en') document.body.classList.add('mode-en');
  if (mode === 'cn') document.body.classList.add('mode-cn');
  modeButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.mode === mode); });
  try { localStorage.setItem('never-mode', mode); } catch (e) {}
}

modeButtons.forEach(function (b) {
  b.addEventListener('click', function () { applyMode(b.dataset.mode); });
});

function renderSpeechGrid() {
  var data = DATA[person];
  speechGrid.innerHTML = '';
  data.speeches.forEach(function (s, i) {
    var btn = document.createElement('button');
    btn.className = 'speech-chip' + (i === speechIdx ? ' active' : '');
    btn.innerHTML = '<span class="icon">' + (s.icon || '🎙️') + '</span><span class="s-title">' + s.title + '</span><span class="s-year">' + s.subtitle + '</span>';
    btn.addEventListener('click', function () { speechIdx = i; renderSpeechGrid(); renderSpeechView(); });
    speechGrid.appendChild(btn);
  });
}

function renderSpeechView() {
  var data = DATA[person];
  var s = data.speeches[speechIdx];
  var quotesHtml = '';
  s.quotes.forEach(function (q, i) {
    quotesHtml += '<div class="quote-card"><span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<p class="en">' + q.en + '</p>' +
      '<p class="cn">' + q.cn + '</p></div>';
  });
  speechView.innerHTML =
    '<div class="sv-head">' +
      '<h2><span class="en-title">' + s.title + '</span> <span class="sub">· ' + s.subtitle + '</span></h2>' +
      '<div class="links-row"><span class="links-label">原声视频</span>' +
      '<a class="media-link" href="https://www.bilibili.com/video/' + s.video.bv + '/" target="_blank" rel="noopener"><span class="play-icon">▶</span> ' + s.video.label + '</a></div>' +
      '<p class="src-note">' + s.src + '</p>' +
      '</div>' +
      '<div class="quotes">' + quotesHtml + '</div>';
}

personTabs.querySelectorAll('.person-tab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    person = tab.dataset.person;
    speechIdx = 0;
    personTabs.querySelectorAll('.person-tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
    renderSpeechGrid();
    renderSpeechView();
  });
});

if (saved === 'en' || saved === 'cn' || saved === 'both') applyMode(saved === 'cn' ? 'both' : saved);
renderSpeechGrid();
renderSpeechView();
</script>
</body>
</html>
