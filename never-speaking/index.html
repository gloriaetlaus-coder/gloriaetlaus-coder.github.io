      {en:"With every word we utter, with every action we take, we know our kids are watching us. We as parents are their most important role models. And let me tell you, Barack and I take that same approach to our jobs as President and First Lady because we know that our words and actions matter, not just to our girls, but to the children across this country — kids who tell us, \"I saw you on TV.\" \"I wrote a report on you for school.\"", cn:"我们说的每一句话、做的每一件事，我们都知道孩子们在看着我们。作为父母，我们是他们最重要的榜样。我还要告诉你们，我和巴拉克在总统和第一夫人的工作里也是同样的做法，因为我们知道，我们的言行举止不只关系到我们的女儿，更关系到全国的孩子——那些告诉我们“我在电视上看到你们了”、“我在学校写过一篇关于你们的报告”的孩子们。"},
    ]},
  ]},
  "2026-10-26": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"下厨做饭：在厨房这样说", blocks:[
      {en:"Dinner's ready!", cn:"开饭了，家里最常用的一句招呼。ready 在这儿就是“做好了、可以吃了”，语气轻快热情，潜台词是“快来，趁热吃”。老外喊这一句，全家人就知道往餐桌走了。"},
      {en:"Can you pass me the salt?", cn:"吃饭时想让旁边的人递盐，就说这句。pass 是“递过去”，潜台词是“我够不着，麻烦你顺手递一下”。餐桌上最自然的小请求，说得越随意越像本地人。"},
      {en:"Taste this and tell me what you think.", cn:"刚做好一道菜，递给对方尝尝：尝尝这个，告诉我你觉得怎么样。潜台词是“我对这道菜有点没底，你的意见我很在意”。老外下厨时爱用这句拉人试菜，顺带夸一句好吃就皆大欢喜。"},
      {en:"Just a pinch of salt.", cn:"说调味分量时用：只要一小撮盐。pinch 是用手指捏起的一小撮，潜台词是“别多放，一点点就够了”。聊菜谱、教别人做菜时，这句比说几克更生活化。"},
      {en:"I'm starving — what's for dinner?", cn:"饿扁了回家第一句：我饿坏了，今晚吃啥。starving 是夸张说法，意思是“饿得不行了”，潜台词是“快告诉我有好吃的，我已经等不及了”。语气带点撒娇，家里人听了都想赶紧开饭。"},
      {en:"Who's doing the dishes tonight?", cn:"吃完饭问一句：今晚谁洗碗。doing the dishes 就是“洗碗”，潜台词是“分工得说清楚，别都指望我”。老外家里饭后分工很直接，先问一句，省得互相等。"},
      {en:"Let's just order in tonight.", cn:"累得不想做饭时提议：今晚就点外卖吧。order in 是“叫外卖到家”，潜台词是“今天放过自己一马，吃点现成的”。语气轻松，等于给全家人一个偷懒的正当理由。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Fall Forward —— 勇敢向前", person:"Denzel Washington", blocks:[
      {en:"I've found that nothing in life is worthwhile unless you take risks. Nothing. Nelson Mandela said: \"There is no passion to be found playing small—in settling for a life that's less than the one you're capable of living.\"", cn:"我发现，人生中没有什么值得做的事是不需要冒险的。没有。纳尔逊·曼德拉说过：“在小打小闹里、在将就一个比你本可以过的人生更差的人生里，是找不到激情的。”"},
      {en:"I'm sure in your experiences—in school… in applying to college… in picking your major… in deciding what you want to do with life—people have told you to make sure you have something to \"fall back on.\" But I've never understood that concept, having something to fall back on. If I'm going to fall, I don't want to fall back on anything, except my faith. I want to fall… forward. At least I figure that way I'll see what I'm about to hit. Fall forward.", cn:"我相信，在你们的经历里——在学校里、在申请大学时、在选专业时、在决定人生要做什么时——一定有人告诉过你们，要确保自己有退路。但我从来不理解“退路”这个概念。如果注定要跌倒，我不想往任何东西上靠，除了我的信念。我要向前跌倒。至少这样，我能看清自己即将撞上什么。向前跌倒。"},
      {en:"Here's what I mean: Reggie Jackson struck out twenty-six-hundred times in his career—the most in the history of baseball. But you don't hear about the strikeouts. People remember the home runs. Fall forward. Thomas Edison conducted 1,000 failed experiments. Did you know that? I didn't either—because #1,001 was the light bulb. Fall forward. Every failed experiment is one step closer to success. You've got to take risks.", cn:"我的意思是：雷吉·杰克逊职业生涯里被三振了2600次——是棒球史上最多的。但人们谈论的不是那些三振，人们记住的是全垒打。向前跌倒。托马斯·爱迪生做了1000次失败的实验。你知道吗？我也不知道——因为第1001次就是电灯泡。向前跌倒。每一次失败的实验，都离成功更近一步。你必须敢于冒险。"},
    ]},
  ]},
  "2026-10-27": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"看电影：买票进场这样说", blocks:[
      {en:"Two tickets for the 7:30 show, please.", cn:"买票时最直接的一句：请给我两张七点半那场的票。show 在这儿就是“场次”，潜台词是“我就看这场，别给我推别的”。说的时候把时间咬清楚，售票员直接出票，不用来回确认。"},
      {en:"Is it in English with subtitles?", cn:"问一句：是英文原声配字幕吗。with subtitles 是“带字幕”，潜台词是“我要听原声，但字幕得有，不然跟不上”。看外语片前先问一句，省得坐进去才发现是配音版。"},
      {en:"Could we sit a bit further back?", cn:"进场挑座位时说：我们能坐靠后一点吗。further back 是“更靠后”，潜台词是“前排脖子疼，中间偏后看得最舒服”。老外选座很讲究视野，提要求一点不客气。"},
      {en:"Let's grab some popcorn first.", cn:"进场前拉着同伴说：先买点爆米花吧。grab 是“顺手拿、顺手买”，潜台词是“看电影没爆米花总觉得少了点仪式感”。语气轻松，像在说“走，标配走起”。"},
      {en:"Do you want butter on the popcorn?", cn:"买爆米花时店员或同伴会问：爆米花要加黄油吗。butter on 是“淋上黄油”，潜台词是“原味还是加料，你定”。老外看电影的经典一问，答一句 Yes, please 就行。"},
      {en:"The trailers are still on — we're not late.", cn:"赶到影厅发现还在放预告片，安慰同伴一句：预告片还没放完，我们没迟到。trailers 是“预告片”，潜台词是“别慌，正片还没开始，喘口气慢慢坐”。"},
      {en:"Can we keep our phones on silent?", cn:"开场前互相提醒：咱们把手机调成静音吧。on silent 是“静音状态”，潜台词是“别让铃声毁了这场电影，也别打扰别人”。语气是商量，不是命令，朋友间说着很自然。"},
      {en:"That ending totally caught me off guard.", cn:"散场聊观后感时说：那个结局完全出乎我的意料。caught me off guard 是“让我措手不及”，潜台词是“这片子真会编，我一点没猜到”。老外聊电影最爱用这句起头，后面自然接得上讨论。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"HeForShe —— 平等是每个人的事", person:"Emma Watson", blocks:[
      {en:"Today we are launching a campaign called “HeForShe.” I am reaching out to you because I need your help. We want to end gender inequality—and to do that we need everyone to be involved. This is the first campaign of its kind at the UN: we want to try and galvanize as many men and boys as possible to be advocates for gender equality. And we don’t just want to talk about it, but make sure it is tangible.", cn:"今天，我们发起了一项名为“HeForShe”的倡议。我向你们伸出手，因为我需要你们的帮助。我们想终结性别不平等，而要做到这一点，需要每一个人都参与进来。这是联合国有史以来第一个这样的倡议：我们想动员尽可能多的男人和男孩，成为推动性别平等的倡导者。我们不只想谈论它，更要确保它是实实在在的。"},
      {en:"I was appointed six months ago and the more I have spoken about feminism the more I have realized that fighting for women’s rights has too often become synonymous with man-hating. If there is one thing I know for certain, it is that this has to stop.", cn:"我在六个月前被任命，而我谈论女权主义越多，就越意识到，为女性权利而斗争常常被等同于仇恨男性。如果有一件事我非常确定，那就是这种情况必须停止。"},
      {en:"For the record, feminism by definition is: “The belief that men and women should have equal rights and opportunities. It is the theory of the political, economic and social equality of the sexes.”", cn:"郑重说明，女权主义的定义是：“相信男性和女性应该享有平等的权利和机会。这是一种关于两性在政治、经济和社会上平等的理论。”"},
    ]},
  ]},
  "2026-10-28": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"公园散步：跟遛弯的人这样聊", blocks:[
      {en:"It's such a lovely morning for a stroll.", cn:"公园里跟人打招呼时说：今天早上出来散步真是太舒服了。stroll 就是“悠闲地散步”，潜台词是“我心情正好，顺便跟你搭句话”。语气慢悠悠的，对方笑着回一句就能聊起来。"},
      {en:"Your dog is so well-behaved!", cn:"碰到遛狗的人夸一句：你家狗狗真听话。well-behaved 是“举止得体、听话”，潜台词是“我注意到你的狗了，而且它一点不闹人”。夸狗等于夸主人，对方立马眉开眼笑。"},
      {en:"Mind if I join you for a lap?", cn:"想跟熟人搭伴走一圈时问：介意我跟你走一圈吗。lap 在这儿是“绕公园一圈”，潜台词是“一个人走有点闷，咱俩搭个伴”。用 Mind if 开头，客气又不生分，对方说 Sure 就能并肩走了。"},
      {en:"This loop is my favorite part of the park.", cn:"聊到公园路线时说：这条环线是我最喜欢的一段。loop 是“环形路线”，潜台词是“我常来，这条路我熟，走着最舒服”。老外聊常去的地方都爱用 favorite，等于在分享自己的小秘密基地。"},
      {en:"Let's sit on that bench for a bit.", cn:"走累了提议：咱们去那条长椅上坐一会儿吧。for a bit 是“一会儿”，潜台词是“不赶时间，坐下来歇歇、看看风景”。语气轻松，像在说“走，歇会儿再走”。"},
      {en:"The flowers here smell amazing.", cn:"路过花坛时感叹一句：这儿的花闻起来真香。smell amazing 是“闻起来棒极了”，潜台词是“这香味让我停下脚步了”。老外散步时爱随口夸一句眼前的东西，身边的人听了也会跟着闻一闻。"},
      {en:"I come here almost every morning.", cn:"跟常碰面的人聊起：我几乎每天早上都来这儿。almost every morning 是“几乎每天早上”，潜台词是“咱俩以后还会常碰见，算是半个熟人了”。一句话就把关系从陌生人拉近了一步。"},
      {en:"See you tomorrow, same time?", cn:"散步结束告别时说：明天同一时间见？same time 是“同一时间”，潜台词是“今天聊得挺开心，明天还想在这儿碰见你”。比干巴巴的 Bye 有约定的意思，听着特别暖。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Make Your Bed —— 从叠好被子开始", person:"William H. McRaven", blocks:[
      {en:"It was a simple task — mundane at best. But every morning we were required to make our bed to perfection. It seemed a little ridiculous at the time, particularly in light of the fact that were aspiring to be real warriors, tough battle-hardened SEALs, but the wisdom of this simple act has been proven to me many times over.", cn:"这是一件再简单不过的小事——平凡到不能再平凡。但每天早上，我们都被要求把被子叠到完美。当时看来这有点荒唐，毕竟我们立志要成为真正的战士、身经百战的海豹队员，但这件小事背后的道理，后来一次又一次得到了证明。"},
      {en:"If you make your bed every morning you will have accomplished the first task of the day. It will give you a small sense of pride, and it will encourage you to do another task and another and another. By the end of the day, that one task completed will have turned into many tasks completed. Making your bed will also reinforce the fact that little things in life matter. If you can't do the little things right, you will never do the big things right.", cn:"如果你每天早上都叠好被子，你就完成了当天的第一件事。它会给你一点小小的成就感，还会鼓动你再做一件事、又一件事、再一件事。到一天结束时，那一件完成的事已经变成许多件完成的事。叠被子还会让你明白，生活中的小事很重要。如果你连小事都做不好，就永远做不好大事。"},
      {en:"And, if by chance you have a miserable day, you will come home to a bed that is made — that you made — and a made bed gives you encouragement that tomorrow will be better.", cn:"而且，万一你度过了糟糕的一天，回到家会看到一张铺好的床——那是你亲手铺的——一张铺好的床会给你鼓励，让你相信明天会更好。"},
      {en:"If you want to change the world, start off by making your bed.", cn:"如果你想改变世界，就从叠好被子开始。"},
    ]},
  ]},
  "2026-10-29": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"超市买菜：挑新鲜问价格这样说", blocks:[
      {en:"Is this in season?", cn:"买菜先问一句：这是当季的吗。in season 是“当季、正应季”，潜台词是“当季的才新鲜好吃，价格也实在”。老外挑菜先问这一句，摊主一听就知道你是懂行的。"},
      {en:"Are these sweet?", cn:"挑水果时问：这些甜吗。sweet 在这儿就是“甜不甜”，潜台词是“我要挑甜的，不甜我就不拿”。问得直接，摊主一般会让你尝一个。"},
      {en:"Can I get half a kilo of these?", cn:"想少买点时说：这些能给我来半公斤吗。half a kilo 是“半公斤”，潜台词是“家里人少，买多了放不住”。老外买菜不按袋拿，按重量现称很常见。"},
      {en:"Could you pick out the fresh ones for me?", cn:"请摊主帮忙挑：能帮我挑新鲜的吗。pick out 是“挑出来”，潜台词是“你天天卖菜，眼光比我准，帮我挑准没错”。用 Could you 开头，客气又不生分。"},
      {en:"How much is it per kilo?", cn:"问价最实用的一句：按公斤多少钱。per kilo 是“每公斤”，潜台词是“先报个价，合适我再称”。菜市场问价先问单价，心里有数才不被宰。"},
      {en:"Do you have anything fresher in the back?", cn:"摊面上的看着不新鲜，问一句：后面还有更新鲜的吗。in the back 是“里屋、后头”，潜台词是“摆出来的我不太满意，给我拿点刚到的”。老外买菜很爱用这句，一点不觉得不好意思。"},
      {en:"That'll do, thanks.", cn:"称好结账时说：这些就够了，谢谢。That'll do 是“这些就够了”，潜台词是“不用再添了，就这些”。语气干脆利落，摊主直接装袋结账。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"The Hill We Climb —— 我们一起登上山丘", person:"Amanda Gorman", blocks:[
      {en:"We will not march back to what was, but move to what shall be, a country that is bruised but whole, benevolent but bold, fierce and free. We will not be turned around or interrupted by intimidation, because we know our inaction and inertia will be the inheritance of the next generation. […] But one thing is certain: if we merge mercy with might and might with right, then love becomes our legacy and change our children's birthright.", cn:"我们不往回走，要走向未来——走向一个遍体鳞伤却依然完整、仁慈而勇敢、狂野而自由的国家。我们不会被恐吓吓退、打断，因为我们知道，我们的不作为和惰性，将成为下一代继承的东西。[…]但有一件事是确定的：如果我们把仁慈与力量结合，把力量与正义结合，那么爱就会成为我们的遗产，改变就会成为我们孩子的天赋权利。"},
      {en:"So let us leave behind a country better than the one we were left. With every breath from my bronze-pounded chest, we will raise this wounded world into a wondrous one. We will rise from the golden hills of the West. We will rise from the windswept Northeast where our forefathers first realized revolution. We will rise from the lakeland cities of the Midwestern states. We will rise from the sunbaked South.", cn:"所以，让我们留下一个比我们接手时更好的国家。带着我青铜般胸膛里的每一次呼吸，我们要把这个受伤的世界变成一个奇妙的世界。我们要从西部金色的山丘上站起来，从东北部风吹过的土地上站起来——我们的先辈就是在那里第一次实现了革命。我们要从中西部湖畔的城市站起来，从阳光炙烤的南方站起来。"},
      {en:"We will rebuild, reconcile and recover, in every known nook of our nation, in every corner called our country, our people, diverse and beautiful, will emerge, battered and beautiful. When day comes we step out of the shade, aflame and unafraid. The new dawn blooms as we free it. For there is always light, if only we're brave enough to see it, if only we're brave enough to be it.", cn:"我们要重建、和解、复苏，在我们国家的每一个已知角落，在我们祖国的每一个角落，我们多样而美丽的人民将走出来，伤痕累累却依然美丽。当白天来临，我们走出阴影，燃烧着、毫不畏惧，新的黎明在我们释放它时绽放。因为总有光，只要我们足够勇敢去看见它，只要我们足够勇敢去成为它。"},
    ]},
  ]},
  "2026-10-30": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"药店买药：跟店员说清症状这样买", blocks:[
      {en:"Do you have anything for a headache?", cn:"进药店先说症状：有治头疼的药吗。anything for 是“治……的药”，潜台词是“我头疼，你帮我找对症的”。不用先报药名，店员会按症状推荐。"},
      {en:"I need something for a sore throat.", cn:"嗓子疼时说：我想要点治嗓子疼的药。sore throat 是“嗓子疼”，潜台词是“我嗓子不舒服，给我点缓解的”。说症状比说药名更不容易买错。"},
      {en:"Do I need a prescription for this?", cn:"拿起一盒药先问：这个需要处方吗。prescription 是“处方”，潜台词是“能直接买我现在就买，别让我白排队”。老外买药先问这一句，省得结账时被拦下。"},
      {en:"How often should I take this?", cn:"买到药别急着走，问一句：这个多久吃一次。how often 是“多久一次”，潜台词是“我要按时吃，不想吃错剂量”。用法问清楚再出门最保险。"},
      {en:"Should I take it before or after food?", cn:"再追问一句：饭前吃还是饭后吃。before or after food 是“饭前还是饭后”，潜台词是“空腹吃会不会伤胃，我得先知道”。老外买药必问，胃舒服不舒服就看这一句。"},
      {en:"I'm allergic to penicillin, just so you know.", cn:"有过敏史主动说：我对青霉素过敏，先跟你说一声。allergic to 是“对……过敏”，潜台词是“别给我开含这个成分的药”。just so you know 是提前打招呼，店员一听就会帮你避开。"},
      {en:"Is there a generic version of this?", cn:"觉得原研药贵，问一句：有通用版的吗。generic version 是“成分一样的平价版”，潜台词是“效果一样的话，我想买便宜点的”。老外买药省钱的常用一问，一点不丢人。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"This Is Water —— 这就是水", person:"David Foster Wallace", blocks:[
      {en:"The really important kind of freedom involves attention and awareness and discipline, and being able truly to care about other people and to sacrifice for them over and over in myriad petty, unsexy ways every day. That is real freedom. That is being educated, and understanding how to think.", cn:"真正重要的自由，是专注、觉察和自律，是能够真正关心别人，并且每天一次又一次地用许多不起眼的小事为他们付出。这就是真正的自由。这就是受过教育，就是懂得如何思考。"},
      {en:"[...] The capital-T Truth is about life before death. [...] It is about the real value of a real education, which has almost nothing to do with knowledge, and everything to do with simple awareness; awareness of what is so real and essential, so hidden in plain sight all around us, all the time, that we have to keep reminding ourselves over and over: \"This is water.\"", cn:"[…] 大写的真理关乎生前的生活。[…] 它关乎真正教育的真正价值，这种价值几乎与知识无关，而与简单的觉察有关——觉察那些如此真实、如此重要、就藏在我们眼前、时时刻刻围绕着我们的东西，以至于我们必须一遍又一遍地提醒自己：“这就是水。”"},
      {en:"It is unimaginably hard to do this, to stay conscious and alive in the adult world day in and day out. Which means yet another grand cliché turns out to be true: your education really is the job of a lifetime. And it commences now. I wish you way more than luck.", cn:"做到这一点是难以想象的难——在成人的世界里日复一日地保持清醒、保持鲜活。这也意味着又一句老生常谈原来是真的：你的教育真的是一辈子的功课。而它现在就开始了。祝你拥有的远不止运气。"},
    ]},
  ]},
  "2026-10-31": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"万圣节：敲门要糖这样说", blocks:[
      {en:"Trick or treat!", cn:"万圣节晚上敲开邻居家门，第一句就是这句：不给糖就捣蛋。trick 是“恶作剧”、treat 是“糖果招待”，潜台词是“快拿糖出来，不然我就捣蛋啦”。当然只是玩笑话，说的时候要配上笑脸和张开的糖袋子。"},
      {en:"Happy Halloween!", cn:"万圣节的万能招呼，相当于“万圣节快乐”。见面、敲门、告别都能说，潜台词是“今晚玩得开心”。语气越欢快越好，邻居听了也会笑着回你一句。"},
      {en:"What are you dressed as?", cn:"看到对方的装扮好奇一问：你扮的是谁呀。dressed as 是“装扮成……”，潜台词是“你这身造型太有意思了，我想知道灵感来源”。比直接问 What are you 更地道，对方会很乐意讲自己的角色。"},
      {en:"I love your costume!", cn:"夸对方装扮最直接的一句：我太喜欢你的装扮了。costume 就是“万圣节服装”，潜台词是“你这身花了心思，我一眼就看出来了”。万圣节晚上夸装扮等于夸人，对方一整晚都会记得这句。"},
      {en:"Can I take a picture with you?", cn:"碰到特别棒的装扮想合影时问：能跟你拍张照吗。潜台词是“你的造型值得留念，我想记录下来”。用 Can I 开头客气又自然，对方说 Sure 就可以拍了。"},
      {en:"My bag is already full!", cn:"糖袋子装满了，跟同伴炫耀一句：我的袋子已经满啦。already full 是“已经满了”，潜台词是“今晚收获颇丰，可以打道回府了”。语气里带着点小得意，朋友听了都会笑。"},
      {en:"Thanks, have a spooky night!", cn:"拿到糖告别时说：谢谢，祝你度过一个惊悚的夜晚。spooky 是“阴森又好玩的”，潜台词是“谢谢你的糖，今晚继续玩得尽兴”。把普通的 Good night 换成 spooky night，万圣节氛围一下就来了。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Press On with Purpose —— 带着使命向前走", person:"Chadwick Boseman", blocks:[
      {en:"Graduating class, hear me well on this day. This day, when you have reached the hilltop and you are deciding on next jobs, next steps, careers, further education, you would rather find purpose than a job or career. Purpose crosses disciplines. Purpose is an essential element of you. It is the reason you are on the planet at this particular time in history. Your very existence is wrapped up in the things you are here to fulfill. Whatever you choose for a career path, remember, the struggles along the way are only meant to shape you for your purpose. When I dared to challenge the system that would relegate us to victims and stereotypes with no clear historical backgrounds, no hopes or talents, when I questioned that method of portrayal, a different path opened up for me, the path to my destiny. When God has something for you, it doesn't matter who stands against it. God will move someone that's holding you back away from the door and put someone there who will open it for you if it's meant for you.", cn:"毕业班的同学们，请在今天好好听我说。今天，你们已经登上了山顶，正在决定下一份工作、下一个步骤、下一段职业、下一段学业——比起一份工作或职业，你们更应该找到使命。使命跨越学科。使命是你身上最核心的东西。它是你在这个特定的历史时刻来到这个星球的原因。你的存在本身，就与你来这里要完成的事紧紧相连。无论你选择什么样的职业道路，请记住，沿途的磨练只是为了塑造你，让你成就自己的使命。当我敢于挑战那个把我们贬为受害者和刻板印象、没有清晰历史背景、没有希望、没有才华的体制，当我质疑那种刻画方式时，一条不同的路为我打开了——那条通往我命运的路。当上天为你准备了什么的时候，谁反对都不重要。上天会把挡在你门前的人移开，换一个会在属于你的时刻为你开门的人。"},
    ]},
  ]},
  "2026-11-03": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"酒店入住：前台办理入住这样说", blocks:[
      {en:"Hi, I have a reservation for tonight.", cn:"到酒店前台先打招呼再说正事：你好，我今晚有预订。for tonight 是“今晚的”，潜台词是“我提前订好了，不是临时来碰运气”。先说这句，前台马上就会问你姓名查订单。"},
      {en:"Could I check in, please?", cn:"办入住最直接的一句：能帮我办理入住吗。check in 就是“登记入住”，用 Could I 开头客气又自然，潜台词是“我到了，麻烦把手续办一下”。前台听到就知道流程开始了。"},
      {en:"What time is check-out?", cn:"入住时顺便问一句：退房是几点。check-out 是“退房”，潜台词是“我先问清时间，免得第二天超时被多收费”。老外入住时几乎都会问这一句，特别实用。"},
      {en:"Can I get a room on a higher floor?", cn:"想要高楼层时说：能给我安排高一点楼层的房间吗。higher floor 是“更高的楼层”，潜台词是“高楼层安静、视野好，我想住得舒服点”。提要求时语气轻松，前台有房一般都会尽量满足。"},
      {en:"Is breakfast included?", cn:"问早餐最省事的一句：早餐包含在房费里吗。included 是“包含在内”，潜台词是“早餐要不要另外付钱，我得先算清楚”。问清了，第二天早上就不会在餐厅门口愣住。"},
      {en:"Could I have an extra key, please?", cn:"同行两个人时说：能再给我一把房卡吗。extra key 是“多一把钥匙”，潜台词是“我们分开出门，各拿一把更方便”。用 Could I 开头，前台递卡前可能要确认一下同住人身份。"},
      {en:"Can I leave my luggage here after check-out?", cn:"退房后还想在附近逛逛时问：退房后我能把行李寄存在这里吗。leave luggage here 是“把行李留在这里”，潜台词是“行李我先放你们这儿，晚上回来再取，不用拖着箱子逛街”。酒店基本都有这项服务，问一句就能轻装上阵。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Never Be Ashamed of Trying —— 不必为努力感到羞耻", person:"Taylor Swift", blocks:[
      {en:"And while we're talking about things that make us squirm but really shouldn't, I'd like to say that I'm a big advocate for not hiding your enthusiasm for things. It seems to me that there is a false stigma around eagerness in our culture of 'unbothered ambivalence.' This outlook perpetuates the idea that it's not cool to 'want it.' That people who don't try hard are fundamentally more chic than people who do. And I wouldn't know because I have been a lot of things but I've never been an expert on 'chic.' But I'm the one who's up here so you have to listen to me when I say this: Never be ashamed of trying. Effortlessness is a myth. The people who wanted it the least were the ones I wanted to date and be friends with in high school. The people who want it most are the people I now hire to work for my company.", cn:"说到那些让我们坐立难安、但其实大可不必如此的事，我想说，我非常支持不要藏起你对一件事的热情。在我们这种“漫不经心才时髦”的文化里，对一件事表现出渴望似乎成了一种污名。这种看法助长了一种观念：“想要”是不酷的。不怎么努力的人从根本上比努力的人更时髦。至于这一点我就不清楚了，因为我做过很多事，但从来不是“时髦”方面的专家。不过既然是我站在这里，你就得听我说：永远不要为努力感到羞耻。毫不费力是个神话。上高中时，那些最不想要的人，是我想约会、想交朋友的人。而现在，那些最想要的人，是我雇来为我的公司工作的人。"},
    ]},
  ]},
  "2026-11-04": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"邮局寄包裹：寄件问运费这样说", blocks:[
      {en:"I'd like to send this parcel to Beijing.", cn:"到邮局先说正事：我想把这个包裹寄到北京。parcel 就是“包裹”，潜台词是“我东西带来了，目的地也定了，直接帮我办手续”。先说目的地，店员马上就知道该走哪条线、收多少钱。"},
      {en:"How much does it cost to send this by air?", cn:"问空运价格最直接的一句：空运寄这个要多少钱。by air 是“走空运”，潜台词是“我赶时间，想知道空运比普通寄贵多少”。问清价格再决定走哪种，不会被结账时的数字吓一跳。"},
      {en:"Could you weigh this for me, please?", cn:"递上包裹时说：能帮我称一下这个吗。weigh 是“称重”，潜台词是“运费按重量算，先称准了我心里有数”。用 Could you 开头客客气气，店员顺手就放到秤上了。"},
      {en:"Do you have a box that fits this?", cn:"东西没装箱时问：有没有刚好装得下这个的盒子。fits this 是“装得下这个、尺寸正好”，潜台词是“我不想盒子太大晃来晃去，也不想塞不进去”。邮局一般都有各种尺寸的盒子，问一句就不用自己到处找。"},
      {en:"How long will it take to get there?", cn:"寄出前一定要问：多久能到。get there 是“送到那儿”，潜台词是“对方等着收，我得告诉人家大概哪天到”。老外寄东西几乎都会问时效，问完还能顺便决定要不要加急。"},
      {en:"Can I track this parcel online?", cn:"想随时查物流时问：这个包裹能在网上查吗。track 是“追踪、查物流”，潜台词是“寄出去了我也想知道它走到哪儿了，别石沉大海”。有单号就能在网上查，店员还会告诉你去哪儿查。"},
      {en:"Can I send this express?", cn:"赶时间就问一句：这个能寄加急吗。express 是“加急、特快”，潜台词是“我愿意多付点钱，只要它能快点到”。问清加急要多花多少，再决定值不值。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Be a Doer, Not a Dreamer —— 做行动派，别只做梦", person:"Shonda Rhimes", blocks:[
      {en:"Guess what? I couldn't be Nobel Prize winning author Toni Morrison. Because Toni Morrison already had that job and she wasn't interested in giving it up. Years later, I had dinner with Toni Morrison. All she wanted to talk about was Grey's Anatomy. That never would have happened if I hadn't stopped dreaming of becoming her and gotten busy becoming myself.", cn:"猜猜怎么着？我成不了诺贝尔奖得主、作家托妮·莫里森。因为托妮·莫里森已经有了那份工作，而且她没兴趣让出来。多年后，我和托妮·莫里森一起吃了顿饭。她只想聊《实习医生格蕾》。如果我没有停止梦想成为她、转而忙着成为我自己，这一切永远不会发生。"},
      {en:"[...] I think a lot of people dream. And while they are busy dreaming, the really happy people, the really successful people, the really interesting, engaged, powerful people, are busy doing. Dreams are lovely. But they are just dreams. Fleeting, ephemeral, pretty. But dreams do not come true just because you dream them. It's hard work that makes things happen. It's hard work that creates change.", cn:"[…] 我觉得很多人都在做梦。而当他们忙着做梦的时候，那些真正快乐的人、真正成功的人、真正有趣、投入、有力量的人，都在忙着行动。梦想很美好。但它们只是梦想。短暂、虚幻、漂亮。但梦想不会因为你做了梦就成真。是努力工作让事情发生。是努力工作带来改变。"},
      {en:"Maybe you know exactly what it is you dream of being, or maybe you're paralyzed because you have no idea what your passion is. The truth is, it doesn't matter. You don't have to know. You just have to keep moving forward. You just have to keep doing something, seizing the next opportunity, staying open to trying something new. It doesn't have to fit your vision of the perfect job or the perfect life. Perfect is boring and dreams are not real.", cn:"也许你很清楚自己梦想成为什么样的人，也许你因为完全不知道自己的热情在哪儿而卡住了。说实话，这都不重要。你不必知道答案。你只需要一直向前走。你只需要一直做点什么，抓住下一个机会，保持开放，去尝试新东西。它不必符合你对完美工作或完美生活的想象。完美很无聊，梦想也不是真的。"},
    ]},
  ]},
  "2026-11-05": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"面包房：买面包这样说", blocks:[
      {en:"Could I have two of these croissants, please?", cn:"指着牛角包跟店员说：能给我拿两个这种牛角包吗。these 是“这种”，潜台词是“我就要眼前这款，不用再介绍别的”。用 Could I 开头客客气气，店员直接装袋，买面包最省事的开口方式。"},
      {en:"Is this baked today?", cn:"拿起面包先问一句：这是今天烤的吗。baked today 是“今天现烤的”，潜台词是“我要最新鲜的，昨天的可不行”。老外买面包很在意是不是当天烤，问一句就知道该不该拿。"},
      {en:"Can you cut this loaf in half for me?", cn:"买了一整个大面包、不想一次吃完时说：能帮我把这条面包切成两半吗。loaf 是“一条面包”，in half 是“切成两半”，潜台词是“切开了好分着吃、也好保存”。面包房一般都有切片机，问一句就能帮你切好。"},
      {en:"I'll take the whole wheat one, please.", cn:"选好了直接说：我要全麦那款，谢谢。whole wheat 是“全麦”，潜台词是“我已经看中了，就要这个，不用再纠结”。语气干脆，店员一听就知道该拿哪一个。"},
      {en:"Do you have anything without nuts?", cn:"对坚果过敏或者不爱吃坚果时问：有没有不含坚果的。without nuts 是“不含坚果”，潜台词是“我得先确认成分，别买回去吃出问题”。买面包先问成分，安全又放心。"},
      {en:"Can I get a bag for these, please?", cn:"面包挑好了问一句：能给我个袋子装这些吗。a bag for these 是“装这些的袋子”，潜台词是“面包我拿着不方便，装起来更好带走”。老外买面包结账前常顺带要个袋子，特别自然。"},
      {en:"How long will this keep?", cn:"买得多、怕放坏时问：这个能放多久。keep 在这儿是“保存、放得住”，潜台词是“放几天会不会硬、会不会坏，我得心里有数”。问清保质期，回家就知道该先吃哪个。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Take a Chance on What You Love —— 为热爱冒险一次", person:"Jim Carrey", blocks:[
      {en:"So many of us choose our path out of fear disguised as practicality. What we really want seems impossibly out of reach and ridiculous to expect, so we never dare to ask the universe for it. I'm saying, I'm the proof that you can ask the universe for it — please! And if it doesn't happen for you right away, it's only because the universe is so busy fulfilling my order. It's party size!", cn:"我们很多人选路，是出于伪装成现实的恐惧。真正想要的东西看起来遥不可及、荒唐得不敢奢望，于是我们从来不敢向宇宙开口要。我是说，我就是证明——你真的可以向宇宙开口要——拜托了！就算它没有马上为你实现，也只是因为宇宙正忙着为我准备订单，而且是派对大份！"},
      {en:"My father could have been a great comedian, but he didn't believe that was possible for him, and so he made a conservative choice. Instead, he got a safe job as an accountant, and when I was 12 years old, he was let go from that safe job and our family had to do whatever we could to survive.", cn:"我的父亲本来可以成为一位伟大的喜剧演员，但他不相信这对他来说是可能的，于是他做了一个保守的选择。相反，他找了一份会计的安全工作，而当我12岁时，他被那份安全工作解雇了，我们全家不得不尽一切努力活下去。"},
      {en:"I learned many great lessons from my father, not the least of which was that you can fail at what you don't want, so you might as well take a chance on doing what you love.", cn:"我从父亲那里学到了很多重要的功课，其中最重要的一条就是：你也可能在不想要的事情上失败，所以不如冒险去做你热爱的事。"},
      {en:"That's not the only thing he taught me though: I watched the affect my father's love and humor had on the world around me, and I thought, \"That's something to do, that's something worth my time.\"", cn:"但这并不是他教给我的唯一一件事：我看到父亲的爱与幽默对周围世界产生了怎样的影响，我想：“这就是值得做的事，这就是值得花时间的事。”"},
    ]},
  ]},
  "2026-11-06": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"干洗店：把衣服送去干洗这样说", blocks:[
      {en:"I'd like to drop these off for dry cleaning.", cn:"把衣服送来干洗时说：我想把这几件送来干洗。drop off 是“送来、放下”，潜台词是“衣服我带来了，洗好我再来取”。干洗店最常见的开场白，店员一听就知道该接过去登记。"},
      {en:"Can you get this stain out?", cn:"指着一块污渍问：这个污渍能洗掉吗。stain 是“污渍”，get out 是“去掉、洗掉”，潜台词是“这块脏得厉害，我先问问能不能洗干净，别白花钱”。送洗前先问一句，心里有底。"},
      {en:"When will they be ready?", cn:"交完衣服问一句：什么时候能取。be ready 是“洗好、能取了”，潜台词是“我得知道哪天来拿，别白跑一趟”。老外送洗必问，店员会直接告诉你取衣时间。"},
      {en:"I need this back by Friday.", cn:"着急穿就说：我周五前要取回来。back by Friday 是“周五之前拿回来”，潜台词是“这件我赶着穿，时间帮我卡死”。说清期限，店员会按加急给你安排。"},
      {en:"Do you do same-day service?", cn:"特别赶的时候问：你们有当天取的服务吗。same-day service 是“当天服务”，潜台词是“我今天就要，能不能加急处理”。很多干洗店都有这项服务，问一句就能省下一天。"},
      {en:"Could you press these pants too?", cn:"顺带说一句：这条裤子也帮我熨一下吧。press 是“熨烫”，too 是“也、顺便”，潜台词是“反正都送来了，熨平了穿起来才精神”。用 Could you 开头客客气气，店员顺手就做了。"},
      {en:"There's a button missing — can you sew it back on?", cn:"发现掉了颗扣子说：这儿少了颗扣子，能帮我缝上吗。sew back on 是“缝回去”，潜台词是“扣子掉了别扔，缝上还能穿”。干洗店一般都能顺手补扣子，问一句就搞定。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Helping Others Win —— 帮别人赢，也是赢", person:"Fred Rogers", blocks:[
      {en:"Have you heard my favorite story that came from the Seattle Special Olympics? Well, for the 100-yard dash, there were nine contestants, all of them so-called physically or mentally disabled.", cn:"你听过我最喜欢的那个来自西雅图特奥会的故事吗？在100码短跑比赛中，有九名选手，他们都被称作身体或智力上有障碍的人。"},
      {en:"All nine of them assembled at the starting line, and at the sound of the gun, they took off. But not long afterward, one little boy stumbled and fell and hurt his knee and began to cry. The other eight children heard him crying.", cn:"九个人都站到了起跑线上，枪声一响，他们就出发了。但没过多久，一个小男孩绊倒了，摔伤了膝盖，开始哭起来。其他八个孩子听到了他的哭声。"},
      {en:"They slowed down, turned around, and ran back to him. Every one of them ran back to him. One little girl with Down syndrome bent down and kissed the boy and said, \"This will make it better.\" And the little boy got up, and he and the rest of the runners linked their arms together and joyfully walked to the finish line.", cn:"他们放慢了脚步，转身跑了回去。他们每一个人都跑了回去。一个患有唐氏综合征的小女孩弯下腰，亲了亲那个男孩，说：“这样会好起来的。”小男孩站了起来，他和其余的选手们手挽着手，高高兴兴地一起走向了终点线。"},
      {en:"They all finished the race at the same time. And when they did, everyone in that stadium stood up and clapped and whistled and cheered for a long, long time. People who were there are still telling the story with great delight. And you know why. Because deep down, we know that what matters in this life is more than winning for ourselves. What really matters is helping others win, too. Even if it means slowing down and changing our course now and then.", cn:"他们同时冲过了终点。当他们冲过终点时，体育场里的每一个人都站起来，鼓掌、吹口哨、欢呼了很久、很久。在场的人们至今仍满怀喜悦地讲述这个故事。你知道为什么吗？因为在内心深处，我们都知道，人生中重要的事不只是为自己赢。真正重要的，是帮助别人一起赢。哪怕这意味着要放慢脚步、偶尔改变一下自己的方向。"},
    ]},
  ]},
  "2026-11-07": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"花店买花：挑花送人这样说", blocks:[
      {en:"I'd like a bouquet of roses, please.", cn:"进花店先说正事：我想买一束玫瑰花。bouquet 是“一束花”，潜台词是“我就买玫瑰，不用再推荐别的”。直接报花名，店员马上就知道该拿哪一束。"},
      {en:"Are these flowers fresh?", cn:"挑花先问一句：这些花新鲜吗。fresh 是“新鲜的”，潜台词是“花放久了蔫得快，我要刚到的”。老外买花很在意新鲜度，问一句就知道该不该拿。"},
      {en:"How long will they last?", cn:"怕花放不住时问：这花能放多久。last 在这儿是“能维持多久”，潜台词是“送人之前别蔫了，我得心里有数”。问清花期，回家也知道该怎么养。"},
      {en:"Could you wrap them up for me?", cn:"挑好花说一句：能帮我包起来吗。wrap up 是“包起来”，潜台词是“包得好看点，这是要送人的”。用 Could you 开头客客气气，花店一般都会免费包装。"},
      {en:"Do you have anything in pink?", cn:"想要特定颜色时问：有粉色的吗。in pink 是“粉色系的”，潜台词是“对方喜欢粉色，我就按这个颜色挑”。先说颜色，店员直接带你去看那一排。"},
      {en:"I need something for a birthday.", cn:"不知道买什么时说：我想买束花送人过生日。for a birthday 是“用来过生日的”，潜台词是“场合我告诉你了，你帮我挑束合适的”。说清用途，店员推荐起来也更有谱。"},
      {en:"Can you add a card with a message?", cn:"想附张贺卡时问：能加张写祝福的卡片吗。a card with a message 是“写着祝福语的卡片”，潜台词是“花是心意，卡片上的话才是重点”。花店一般都有小卡片，写好了一起插进花束里。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Dream More —— 梦想和愿望不一样", person:"Dolly Parton", blocks:[
      {en:"I'm very grateful for my life, but if I had but one wish for you, it would be for you to dream more. Now when I was a kid, I used to put a tin can on a broom handle. I used to stick it down in the crack out on the porch of our old cabin. And of course, in my mind's eye, I was standing on stage with my guitar singing my heart out in this microphone. And those were not chickens out there in the yard, it was my audience. And that was no ragged dress that I was wearing, it was a dress glittering with rhinestones and it was made of the finest silk — in my mind. So, you have to stay true to your heart and to your dreams.", cn:"我对自己的人生心怀感激，但如果我只能对你们许一个愿望，那就是希望你们多做梦。我小时候常常把一个铁罐套在扫帚把上，插进老木屋门廊的缝隙里。在我的想象中，我正站在舞台上，抱着吉他，用这支话筒纵情歌唱。院子里那些根本不是鸡，而是我的观众。我身上穿的也不是破旧的裙子，而是一条缀满水钻、用最上等丝绸做成的裙子——在我心里就是这样。所以，你们一定要忠于自己的心，忠于自己的梦想。"},
      {en:"[...] Now dreams build convictions because you work hard to pay the price to make sure that they come true. Wishes are hoping good things will happen to you, but there's no fire in your gut that causes you to put everything forth, you know, to overcome all the obstacles. So, you have to dream more and never, ever, ever, ever blame somebody else if it doesn't happen. That is in your department.", cn:"[…] 梦想会让你坚定信念，因为你会努力付出代价，让它成真。而愿望只是盼着好事降临到自己头上，心里却没有那团火、没有那股劲儿去全力以赴、克服所有障碍。所以，你们要多做梦，而且永远、永远、永远不要在梦想没有实现时责怪别人。那是你们自己的事。"},
    ]},
  ]},
  "2026-11-08": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"宠物店：带狗狗去洗澡美容这样说", blocks:[
      {en:"I'd like to book a grooming appointment for my dog.", cn:"想给狗狗约个美容，先说这句：book an appointment 是“预约”，grooming 是“宠物美容”，潜台词是“先把时间约好，别白跑一趟”。"},
      {en:"Can you give him a bath and a trim?", cn:"能给他洗个澡、修修毛吗：a bath and a trim 是“洗澡加修剪”，潜台词是“全身上下都收拾利落点，洗得干干净净”。"},
      {en:"He's friendly, but he's a bit nervous around strangers.", cn:"他很亲人，就是对陌生人有点紧张：a bit nervous 是“有点紧张”，潜台词是“动作轻一点、慢慢来，别吓着他”。"},
      {en:"Could you trim his nails, please?", cn:"能帮他剪剪指甲吗：trim his nails 是“剪指甲”，潜台词是“指甲长了，顺手一起剪了，省得我回家再折腾”。"},
      {en:"How much does a full grooming cost?", cn:"全套美容要多少钱：full grooming 是“全套美容”，潜台词是“先报个价，合适我就办，不合适我再想想”。"},
      {en:"He's due for his shots — can I make a vet appointment?", cn:"他该打疫苗了，能约个兽医吗：due for 是“到了……的时候”，shots 在这儿是“疫苗”，潜台词是“疫苗不能拖，帮我约个最近的时间”。"},
      {en:"He sheds a lot — do you have a good brush for that?", cn:"他掉毛厉害，有没有好用的梳子：sheds 是“掉毛”，潜台词是“家里毛满天飞，我得买把管用的梳子回去”。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"The Danger of a Single Story —— 别让单一故事定义你", person:"Chimamanda Ngozi Adichie", blocks:[
      {en:"I'm a storyteller. And I would like to tell you a few personal stories about what I like to call \"the danger of the single story.\"", cn:"我是一个讲故事的人。我想跟你们讲几个我自己的小故事，关于我所说的“单一故事的危险”。"},
      {en:"I grew up on a university campus in eastern Nigeria. My mother says that I started reading at the age of two, although I think four is probably close to the truth. So I was an early reader, and what I read were British and American children's books.", cn:"我在尼日利亚东部的一所大学校园里长大。我妈妈说我两岁就开始认字，不过我觉得四岁可能更接近事实。总之我很小就开始读书，读的是英国和美国的儿童读物。"},
      {en:"I was also an early writer, and when I began to write, at about the age of seven, stories in pencil with crayon illustrations that my poor mother was obligated to read, I wrote exactly the kinds of stories I was reading: All my characters were white and blue-eyed, they played in the snow, they ate apples, and they talked a lot about the weather, how lovely it was that the sun had come out.", cn:"我也很小就开始写作，大概七岁的时候，用铅笔写故事、再配上蜡笔画，我那可怜的妈妈只好把它们都读完。而我写的，正是我读到的那种故事：我笔下所有的人物都是白皮肤、蓝眼睛，他们在雪地里玩耍，吃苹果，还总爱聊天气——太阳出来了，多好啊。"},
      {en:"Now, this is despite the fact that I lived in Nigeria. I had never been outside Nigeria. We didn't have snow, we ate mangoes, and we never talked about the weather, because there was no need to.", cn:"可事实上我生活在尼日利亚。我从来没有离开过尼日利亚。我们那儿没有雪，我们吃芒果，也从来不聊天气，因为根本没必要。"},
    ]},
  ]},
  "2026-11-09": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"奶茶店点单：加冰少糖这样说", blocks:[
      {en:"Can I get a bubble tea, please?", cn:"想喝奶茶先开口：能给我来杯奶茶吗。bubble tea 就是“珍珠奶茶、奶茶”，潜台词是“我就要杯奶茶，先点上再说”。老外进奶茶店第一句基本就是这个，店员马上会问你要什么口味。"},
      {en:"I'd like it half sweet, please.", cn:"想要少糖就说：我要半糖，谢谢。half sweet 是“半糖”，潜台词是“太甜我喝不惯，糖给我少放点”。点奶茶时说甜度是基本操作，店员一点不觉得你挑剔。"},
      {en:"Less ice, please.", cn:"冰少一点：冰给我少放点。less ice 是“少冰”，潜台词是“冰太多喝两口就没了，我想多喝点茶”。点单时顺嘴一说，店员直接给你少放。"},
      {en:"Can I add extra boba?", cn:"想多加点珍珠：能多加一份珍珠吗。extra boba 是“多加珍珠”，潜台词是“珍珠我最爱吃，多加点才过瘾”。加料一般要多付一点钱，店员会告诉你。"},
      {en:"Do you have anything without caffeine?", cn:"不想摄入咖啡因时问：有没有不含咖啡因的。without caffeine 是“不含咖啡因”，潜台词是“晚上喝怕睡不着，给我推款不含咖啡因的”。奶茶店一般都有水果茶、牛奶类可以选。"},
      {en:"Can I get it to go?", cn:"打包带走时说：能帮我打包带走吗。to go 是“带走”，潜台词是“我赶时间，拿着路上喝”。老外买饮料结账前常说这句，店员直接给你装好。"},
      {en:"How big is the large?", cn:"拿不准杯型时问：大杯有多大。how big 是“有多大”，潜台词是“大杯别大得喝不完，我先问清楚”。老外点饮料问杯型很常见，问完再决定点中杯还是大杯。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Be True to Yourself —— 做真实的自己", person:"Ellen DeGeneres", blocks:[
      {en:"Really when I look back on it, I wouldn't change a thing. I mean, it was so important for me to lose everything because I found out what the most important thing is, is to be true to yourself. Ultimately, that's what's gotten me to this place. I don't live in fear, I'm free; I have no secrets and I know I'll always be ok, because no matter what, I know who I am. So in conclusion, when I was younger I thought success was something different. [...] But my idea of success is different today. And as you grow, you'll realize the definition of success changes. [...] For me, the most important thing in your life is to live your life with integrity and not to give into peer pressure to try to be something that you're not, to live your life as an honest and compassionate person, to contribute in some way.", cn:"回头看，我一点都不想改变什么。失去一切对我来说如此重要，因为我因此发现了最重要的事：做真实的自己。正是这一点让我走到了今天。我不再活在恐惧里，我是自由的；我没有任何秘密，我知道自己永远都会好好的，因为无论如何，我都知道自己是谁。所以总的来说，我年轻时以为成功是另一回事。[…] 但今天，我对成功的看法不一样了。随着你慢慢长大，你会发现成功的定义也在变。[…] 对我来说，人生中最重要的事，是带着正直去生活，不屈服于同辈的压力、不去假装成不是自己的样子，要诚实、善良地活着，并以某种方式为这个世界做点贡献。"},
      {en:"So to conclude my conclusion, follow your passion, stay true to yourself. Never follow anyone else's path, unless you're in the woods and you're lost and you see a path and by all means you should follow that. [...] So my advice to you is to be true to yourself and everything will be fine.", cn:"所以最后我想说：追随你的热爱，做真实的自己。永远不要走别人的路，除非你在树林里迷了路、眼前出现了一条路——那你当然应该跟着它走。[…] 所以我给你的建议是：做真实的自己，一切都会好起来的。"},
    ]},
  ]},
  "2026-11-10": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"快递取件：去驿站取快递这样说", blocks:[
      {en:"Hi, I'm here to pick up a package.", cn:"来取快递先打招呼：你好，我来取个快递。pick up a package 是“取包裹”，潜台词是“我快递到了，来把它领走”。进驿站第一句就说这个，店员马上会问你取件码。"},
      {en:"The last four digits of my phone number are 1234.", cn:"报取件信息时说：我手机号后四位是 1234。last four digits 是“后四位数字”，潜台词是“凭这个就能证明快递是我的，赶紧帮我找”。国内取快递基本都报手机号后四位，说完店员直接去货架上找。"},
      {en:"I got a text saying my package arrived.", cn:"不确定快递到没到时说：我收到短信说快递到了。got a text 是“收到一条短信”，潜台词是“短信都发了，快递肯定在这儿，帮我找找”。要是店员说没找到，把短信拿出来给对方看最管用。"},
      {en:"Can you help me find it? It's a big box.", cn:"货架上东西太多时说：能帮我找找吗？是个大箱子。a big box 是“大箱子”，潜台词是“我自己找了半天没找着，你熟门熟路帮我一把”。说清大小颜色，店员找起来更快。"},
      {en:"Do I need to sign for this?", cn:"拿快递前问一句：这个需要签收吗。sign for 是“签收”，潜台词是“要不要我签字确认，签完我就走”。有些贵重包裹要签收，问一句免得拿错流程。"},
      {en:"Can I open it here to check?", cn:"怕东西坏了，先问一句：我能在这儿拆开检查一下吗。open it to check 是“拆开检查”，潜台词是“东西要是坏了我当场就说清楚，回家再发现就说不清了”。驿站一般都允许当场验货，检查完再走最稳妥。"},
      {en:"Could you hold this for me until tomorrow?", cn:"今天拿不走时说：能帮我留到明天吗。hold 是“先帮我留着”，潜台词是“我今天实在拿不了，明天一准来取，别给我退回去”。驿站一般都会帮你多放一两天，提前打个招呼最保险。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Grit: The Power of Passion and Perseverance —— 热爱与坚持的力量", person:"Angela Duckworth", blocks:[
      {en:"Grit is passion and perseverance for very long-term goals. Grit is having stamina. Grit is sticking with your future, day in, day out, not just for the week, not just for the month, but for years, and working really hard to make that future a reality. Grit is living life like it's a marathon, not a sprint.", cn:"坚毅力，就是对长远目标的热爱与坚持。坚毅力就是耐力。坚毅力就是守住你的未来，一天又一天，不只是一周，不只是一个月，而是年复一年，并且非常努力地让那个未来变成现实。坚毅力就是把人生当作马拉松来跑，而不是短跑。"},
      {en:"A few years ago, I started studying grit in the Chicago public schools. I asked thousands of high school juniors to take grit questionnaires, and then waited around more than a year to see who would graduate. Turns out that grittier kids were significantly more likely to graduate, even when I matched them on every characteristic I could measure, things like family income, standardized achievement test scores, even how safe kids felt when they were at school. So it's not just at West Point or the National Spelling Bee that grit matters. It's also in school, especially for kids at risk for dropping out. To me, the most shocking thing about grit is how little we know, how little science knows, about building it.", cn:"几年前，我开始在芝加哥的公立学校研究坚毅力。我让数千名高二学生填写坚毅力问卷，然后等了一年多，看看谁能顺利毕业。结果发现，更有坚毅力的孩子毕业的可能性明显更高，即使我把能衡量的每一个特征都对照过了——比如家庭收入、标准化考试成绩，甚至孩子们在学校里感觉有多安全。所以，坚毅力重要的地方，不只在西点军校或全国拼字比赛，也在学校里，尤其对那些有辍学风险的孩子来说。而对我来说，关于坚毅力最令人震惊的一点，是我们对它知之甚少，科学对如何培养它也知之甚少。"},
    ]},
  ]},
  "2026-11-11": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"点外卖：手机上点外卖这样说", blocks:[
      {en:"I'd like to order takeout, please.", cn:"想点外卖先开口：我想点个外卖。order takeout 就是“点外卖”，潜台词是“我不堂食，打包带走或者送到家里”。老外点外卖、打电话订餐第一句基本就是这个，店员马上会问你要点什么。"},
      {en:"Can I get this delivered to my place?", cn:"想送到家里时问：这个能送到我家吗。delivered to my place 是“送到我住的地方”，潜台词是“我不想出门，你直接送过来”。点外卖必问的一句，店员会接着问你地址。"},
      {en:"How long will delivery take?", cn:"下单前问一句：外卖多久能到。delivery 在这儿是“送餐”，潜台词是“我饿着呢，得知道大概等多久”。老外点外卖几乎都会问时效，问完心里就有数了。"},
      {en:"Could you leave it at the door, please?", cn:"不想开门取餐时说：能帮我放门口吗。leave it at the door 是“放在门口”，潜台词是“你放下就走，不用按门铃，我自己出来拿”。用 Could you 开头客客气气，外卖小哥一般都照办。"},
      {en:"I'd like it less spicy, please.", cn:"怕太辣就说：我要微辣，谢谢。less spicy 是“少辣一点”，潜台词是“辣味我扛不住，调料给我少放点”。点外卖时说辣度是基本操作，店家一点不觉得你挑剔。"},
      {en:"Can I have extra chopsticks, please?", cn:"家里人多、筷子不够时说：能多给几双筷子吗。extra chopsticks 是“多几双筷子”，潜台词是“餐具得够人头，少了不够分”。点外卖结账前顺带说一句，店家都会多放几双。"},
      {en:"The order is missing an item.", cn:"发现少了东西时说：订单里少了一样东西。missing an item 是“缺了一样东西”，潜台词是“我点的东西没送全，赶紧给我补上或者退钱”。外卖漏单时直接说这句，客服马上就会处理。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"Work Hard, Be Kind —— 努力工作，待人善良", person:"Conan O'Brien", blocks:[
      {en:"In 2000, I told graduates to not be afraid to fail, and I still believe that. But today, I tell you that whether you fear it or not, disappointment will come. The beauty is that through disappointment, you can gain clarity, and with clarity comes conviction and true originality. Many of you here today are getting your diploma at this Ivy League school because you have committed yourself to a dream and worked hard to achieve it. And there is no greater cliche in a commencement address than follow your dream. Well, I'm here to tell you that whatever you think your dream is now, it will probably change, and that's okay.", cn:"2000 年，我告诉毕业生们不要害怕失败，我至今仍然相信这一点。但今天，我要告诉你们，无论你怕不怕，失望总会来。美好之处在于，经历失望，你能获得清醒，而有了清醒，就有了信念和真正的原创性。今天在座的许多人能拿到这所常春藤名校的毕业证书，是因为你们为一个梦想投入了自己、努力去实现它。而毕业典礼演讲中再没有比“追随你的梦想”更大的陈词滥调了。好吧，我来告诉你们：不管你现在觉得自己的梦想是什么，它很可能会变，这样也没关系。"},
      {en:"[...]", cn:"[...]"},
      {en:"But through the good, and especially the bad, the person you are now is someone you could never have conjured in the fall of 2007. I've told you many things today, most of it foolish, but some of it true. I'd like to end my address by breaking a taboo and quoting myself from 17 months ago. At the end of my final program with NBC, just before signing off, I said, \"Work hard, be kind, and amazing things will happen.\" Today, receiving this honor and speaking to the Dartmouth class of 2011 from behind a tree trunk, I have never believed that more.", cn:"但无论经历好事、尤其是坏事，如今的你，都是 2007 年秋天那个你根本无法想象的人。今天我跟你们讲了很多事，大部分是胡说八道，但有些是真的。我想以打破一个禁忌的方式来结束今天的演讲——引用 17 个月前的我自己。在 NBC 最后一期节目结束前，我说：“努力工作，待人善良，好事就会发生。”今天，能站在这里接受这份荣誉、从一棵树干后面向 2011 届达特茅斯毕业生讲话，我比以往任何时候都更相信这句话。"},
    ]},
  ]},
  "2026-11-12": { items:[
    { cat:'tips', catLabel:'每日贴士', title:"租车自驾：取车还车这样说", blocks:[
      {en:"I'd like to pick up my reservation.", cn:"到租车柜台先说这句：我想取我预订的车。reservation 在这里就是你提前订好的车，潜台词是“我约好了，来取车”。语气很自然，不用客套寒暄，店员听完马上就会帮你查订单。"},
      {en:"Can I add an additional driver?", cn:"想让同行的人也能开这辆车，就加这句：能再加一个驾驶员吗。additional driver 是“额外驾驶员”，潜台词是“不只我一个人开，另一个人也要合法上路”。直接问就行，店员会告诉你加一个人要不要多收费。"},

  return '2026-10-'+pad2(n);
}

function cyrb53(str, seed){
  var h1 = 0xdeadbeef ^ (seed||0), h2 = 0x41c6ce57 ^ (seed||0);
  for(var i=0, ch; i<str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(36) + (h1>>>0).toString(36);
}
function contentKey(b){ return 'c:' + cyrb53(String((b&&b.en)||'').replace(/\s+/g,' ').trim(), 0); }
function isDeleted(key, b){ return delSet.has(key) || (b && delSet.has(contentKey(b))); }

function isSpecialDay(d){
  if(!DAYS[d]) return false;
  var items = DAYS[d].items;
  if(!items || !items.length) return false;
  var allSpeech = items.every(function(it){ return it.cat==='speech'; });
  var samePerson = items.every(function(it){ return it.person && it.person===items[0].person; });
  return allSpeech && samePerson;
}

function dayItems(){ return DAYS[day] ? DAYS[day].items : []; }

function renderDateRail(){
  dateRail.innerHTML = '';
  var activeChip = null;
  var curMonth = '';
  sortedDayKeys.forEach(function(key){
    var ym = key.slice(0,7);
    if(ym!==curMonth){
      curMonth = ym;
      var month = document.createElement('div');
      month.className = 'month-pin';
      month.textContent = (+key.slice(5,7)) + '月';
      dateRail.appendChild(month);
    }
    (function(k){
      var b = document.createElement('button');
      b.className = 'date-chip' + (k===day?' active':'');
      b.textContent = +k.slice(8,10);
      var dot = document.createElement('span'); dot.className='dot'; b.appendChild(dot);
      b.addEventListener('click', function(){ day = k; persistDay(); renderDateRail(); renderCatFilter(); renderContent(); window.scrollTo(0,0); });
      dateRail.appendChild(b);
      if(k===day) activeChip = b;
    })(key);
  });
  if(activeChip) activeChip.scrollIntoView({inline:'center',block:'nearest'});
}

dateRail.addEventListener('wheel', function(e){
  e.preventDefault();
  stepDay(e.deltaY > 0 ? 1 : -1);
}, {passive:false});

function stepDay(dir){
  var idx = sortedDayKeys.indexOf(day);
  var next = null;
  if(idx>=0){ next = sortedDayKeys[idx+dir]; }
  else if(dir>0){ for(var i=0;i<sortedDayKeys.length;i++){ if(sortedDayKeys[i]>day){ next = sortedDayKeys[i]; break; } } }
  else { for(var j=sortedDayKeys.length-1;j>=0;j--){ if(sortedDayKeys[j]<day){ next = sortedDayKeys[j]; break; } } }
  if(next){ day = next; persistDay(); renderDateRail(); renderCatFilter(); renderContent(); }
}

function chipLabel(it, active){
  var base = it.catLabel;
  if(!active) return base;
  var parts = [];
  if(it.person) parts.push(it.person);
  if(it.title && it.title !== base) parts.push(it.title);
  if(parts.length) return [base].concat(parts).join(' - ');
  return base;
}

}
function renderCatFilter(){
  if(isSpecialDay(day)){ catFilterEl.innerHTML=''; return; }
  catFilterEl.innerHTML = '';
  var items = dayItems();
  var seen = {}, cats = [];
  items.forEach(function(it){ if(!seen[it.cat]){ seen[it.cat]=1; cats.push(it); } });
  if(cats.length && (catFilter===null || !cats.some(function(c){ return c.cat===catFilter; }))){
    catFilter = cats[0].cat;
  }
  cats.forEach(function(it){
    var b = document.createElement('button');
    var active = (catFilter===it.cat);
    b.className = 'chip' + (active?' active':'');
    b.textContent = chipLabel(it, active);
    b.addEventListener('click', function(){ catFilter = it.cat; renderCatFilter(); renderContent(); });
    catFilterEl.appendChild(b);
  });
}

var ctxKey = null;

  ctxKey = key;

  ctxMenu.style.display = 'block';
  var mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  var left = r.right - mw;

  var top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = r.top - mh - 6;
  if(top < 8) top = 8;
  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top = top + 'px';
}

function renderSpecialDay(){
  var items = DAYS[day].items;
  if(activeSpeech[day]===undefined) activeSpeech[day]=0;
  var tabs = '<div class="speech-tabs">';
  var baseCat = items[0].catLabel || '名人演讲';
  items.forEach(function(it, idx){
    var isActive = (idx===activeSpeech[day]);
    var label;
    if(isActive){
      var parts = [];
      if(it.person) parts.push(it.person);
      if(it.title && it.title !== baseCat) parts.push(it.title);
      label = parts.length ? ([baseCat].concat(parts).join(' - ')) : baseCat;
    } else {
      label = it.short || it.title;
    }
    tabs += '<button class="speech-tab'+(isActive?' active':'')+'" data-idx="'+idx+'">'+label+'</button>';
  });
  tabs += '</div>';
  catFilterEl.innerHTML = tabs;

  var it2 = items[activeSpeech[day]];
  var remaining = 0;
  var html = '<div class="speech-view">';
  it2.blocks.forEach(function(b, bi){
    var key = unitKey(it2, bi);
    if(isDeleted(key, b)) return;
    remaining++;
    html += unitHTML(key, b);
  });
  html += '</div>';
  if(remaining===0) html += '<p class="empty">这段都被删光啦，点右上角「恢复已删」可找回。</p>';
  if(it2.video) html += '<div class="video-anchor"><a href="https://www.bilibili.com/video/'+it2.video.bv+'/" target="_blank" rel="noopener"><span class="play-icon">▶</span> '+it2.video.label+'</a></div>';
  content.innerHTML = html;

  catFilterEl.querySelectorAll('.speech-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeSpeech[day] = +btn.dataset.idx; persistSpeech();
      renderContent();
    });
  });
  bindMore();
}

function renderNormalDay(){
  var items = dayItems().filter(function(it){ return catFilter===null || it.cat===catFilter; });
  var html = '';
  var videoToShow = null;
  items.forEach(function(it){
    var units = '';
    it.blocks.forEach(function(b, bi){
      var key = unitKey(it, bi);
      if(isDeleted(key, b)) return;
      units += unitHTML(key, b);
    });
    html += units;
    if(!videoToShow && it.video) videoToShow = it.video;
  });
  if(!items.length) html = '<p class="empty">这天还没有推送内容～</p>';
  if(videoToShow) html += '<div class="video-anchor"><a href="https://www.bilibili.com/video/'+videoToShow.bv+'/" target="_blank" rel="noopener"><span class="play-icon">▶</span> '+videoToShow.label+'</a></div>';
  content.innerHTML = html;
  bindMore();
}

function renderContent(){
  if(isSpecialDay(day)) renderSpecialDay();
  else renderNormalDay();
  balanceAllUnits();
}

/* ---- 英中行数对齐：按英文高度收窄中文列 ---- */
function isTwoCol(){
  return !document.body.classList.contains('mode-en') && window.innerWidth > 860;
}
function linesOf(el){
  var lh = parseFloat(getComputedStyle(el).lineHeight);
  if(!lh || isNaN(lh)) lh = parseFloat(getComputedStyle(el).fontSize) * 1.5;
  return Math.max(1, Math.round(el.offsetHeight / lh));
}
function balanceUnit(unitEl){
  var pair = unitEl.querySelector('.pair');
  var en = pair && pair.querySelector('.en');
  var cn = pair && pair.querySelector('.cn');
  if(!en || !cn) return;
  var cs = getComputedStyle(pair);
  var cols = cs.gridTemplateColumns.trim().split(/\s+/).length;
  if(cols < 2){ pair.style.gridTemplateColumns=''; return; }
  pair.style.gridTemplateColumns = '';
  void pair.offsetHeight;
  var gap = parseFloat(getComputedStyle(pair).columnGap || getComputedStyle(pair).gap) || 0;
  var pairW = pair.clientWidth;
  if(!pairW) return;
  var minW = 60;
  var maxW = pairW - gap - minW;
  if(maxW < minW) return;
  var lo = minW, hi = maxW;
  var bestW = (pairW - gap) / 2;
  var bestDiff = Math.abs(linesOf(cn) - linesOf(en));
  for(var i=0;i<14;i++){
    var mid = Math.round((lo + hi) / 2);
    pair.style.gridTemplateColumns = '1fr ' + mid + 'px';
    void pair.offsetHeight;
    var enL = linesOf(en), cnL = linesOf(cn);
    var diff = cnL - enL;
    if(Math.abs(diff) < bestDiff){ bestDiff = Math.abs(diff); bestW = mid; }
    if(diff > 0) lo = mid; else if(diff < 0) hi = mid; else { bestW = mid; break; }
  }
  pair.style.gridTemplateColumns = '1fr ' + bestW + 'px';
}
function balanceAllUnits(){
  if(!isTwoCol()) return;
  document.querySelectorAll('.unit').forEach(balanceUnit);
}
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(balanceAllUnits, 120);
});

renderCatFilter();
renderContent();
updateFavBtn();
