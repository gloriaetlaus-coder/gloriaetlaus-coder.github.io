<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语自习室 · 合并预览</title>
<style>
:root{
  --bg:#f6f3ec;
  --card:#ffffff;
  --ink:#2b2620;
  --muted:#8a7f6a;
  --line:#e7dfce;
  --line-strong:#d8cdb4;
  --accent:#2b2620;
  --link:#0071e3;
  --link-deep:#0066cc;
  --tint:#f0ece2;
    --size-1:14px;
  --size-2:13px;
  --size-3:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-size:var(--size-1);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;font-weight:400;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6;}

.topbar{position:sticky;top:0;z-index:30;background:rgba(246,243,236,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.fav-btn{display:flex;align-items:center;gap:5px;font-size:var(--size-2);font-weight:700;border:1px solid #f0c0c0;background:#fff;color:#e0556b;border-radius:999px;padding:6px 13px;cursor:pointer;font-family:inherit;transition:background .15s;}
.fav-btn:hover{background:#fff5f7;}
.mode-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;}
.mode-switch button{font-size:var(--size-2);font-weight:700;border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
.mode-switch button.active{background:var(--accent);color:#fff;}
.rail-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;}

.date-rail{padding:4px 24px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;}
.date-rail::-webkit-scrollbar{height:0;}
.month-pin{position:sticky;left:0;z-index:2;flex:0 0 auto;display:flex;align-items:center;padding:6px 10px 6px 2px;font-size:var(--size-2);font-weight:700;color:var(--muted);background:rgba(246,243,236,.97);}
.brand-pin{display:flex;align-items:center;gap:6px;font-size:15px;color:#fff;padding:6px 14px;border:none;border-radius:999px;background:linear-gradient(135deg,#7d5a3a 0%,#a07b56 100%);letter-spacing:.4px;white-space:nowrap;flex:0 0 auto;font-weight:700;box-shadow:0 2px 6px rgba(125,90,58,.25);}
.brand-pin .icon{font-size:15px;}
.date-chip{position:relative;flex:0 0 auto;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 0;width:36px;text-align:center;font-size:var(--size-2);font-weight:700;cursor:pointer;color:var(--ink);}
.date-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.date-chip .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);}
.date-chip.active .dot{background:#fff;}

.feed{padding:6px 24px 16px;}
.tab-row{display:flex;align-items:center;gap:10px;padding:0 24px;margin:0 0 8px;}
.cat-filter{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;flex:1 1 auto;min-width:0;}
.cat-filter::-webkit-scrollbar{height:0;}
.tools-row{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-left:10px;border-left:1px solid var(--line);}
.chip{flex:0 0 auto;font-size:var(--size-2);font-weight:700;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 15px;cursor:pointer;color:var(--ink);font-family:inherit;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.speech-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;flex:1 1 auto;min-width:0;}
.speech-tabs::-webkit-scrollbar{height:0;}
.speech-tab{flex:0 0 auto;font-size:var(--size-2);font-weight:700;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 15px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;white-space:nowrap;}
.speech-tab:hover{border-color:var(--accent);color:var(--ink);}
.speech-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.speech-view{margin-top:2px;}

.item-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:18px 0 10px;padding-bottom:7px;border-bottom:1px dashed var(--line);}
.item-head:first-child{margin-top:4px;}
.item-head .ttl{font-size:var(--size-1);font-weight:400;color:var(--muted);}
.play-icon{font-size:10px;color:#fff;background:var(--link);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}

.unit{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 40px 9px 16px;margin-bottom:4px;transition:border-color .15s;display:block;}
.unit.faved{border-color:#f0b8c4;}
.video-anchor{display:flex;justify-content:flex-start;margin:10px 0 2px;padding-left:16px;}
.video-anchor a{display:inline-flex;align-items:center;gap:7px;font-size:var(--size-2);font-weight:400;color:var(--link-deep);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 16px;transition:background .15s,color .15s,border-color .15s;}
.video-anchor a:hover{background:var(--link);color:#fff;border-color:var(--link);}
.unit .pair{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;align-items:start;}
.en{font-family:inherit;font-size:var(--size-1);font-weight:400;line-height:1.4;color:var(--ink);}
.cn{font-size:var(--size-1);font-weight:400;line-height:1.36;color:var(--ink);padding-left:6px;border-left:1px solid var(--line);}
.more-btn{position:absolute;top:10px;right:10px;width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:50%;color:var(--muted);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:2;}
.more-btn:hover{border-color:var(--accent);color:var(--ink);}
.more-btn.faved{color:#e0556b;border-color:#f0b8c4;}
.count-note{font-size:var(--size-2);font-weight:400;color:var(--muted);margin:2px 0 12px;}

.ctx-menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:5px;display:none;min-width:128px;}
.ctx-menu button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;padding:9px 12px;border-radius:8px;font-size:var(--size-2);font-weight:400;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left;}
.ctx-menu button:hover{background:var(--tint);}
.ctx-menu .ic{font-size:16px;line-height:1;}

.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto;}
.modal.open{display:flex;}
.modal-box{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);font-size:var(--size-1);font-weight:400;}
.modal-close{border:none;background:var(--tint);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;color:var(--muted);}
.fav-list{padding:12px 16px;overflow-y:auto;}
.fav-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.fav-item .src{font-size:var(--size-2);font-weight:400;color:var(--muted);margin-bottom:6px;}
.fav-item .en{font-family:inherit;font-size:var(--size-1);font-weight:400;line-height:1.5;color:var(--ink);}
.fav-item .cn{font-size:var(--size-1);font-weight:400;line-height:1.6;color:var(--ink);margin-top:4px;padding-left:12px;border-left:1px solid var(--line);}
.fav-item .fav-del{margin-top:9px;font-size:var(--size-2);font-weight:400;color:#c0392b;background:none;border:none;cursor:pointer;padding:0;font-family:inherit;}
.fav-empty{font-size:var(--size-2);font-weight:400;color:var(--muted);padding:34px 8px;text-align:center;line-height:1.8;}

.empty{font-size:var(--size-2);font-weight:400;color:var(--muted);padding:30px 4px;}

body.mode-en .cn{display:none;}
body.mode-en .unit .pair{grid-template-columns:1fr;}

@media (max-width:860px){
  .date-rail{padding:0 14px;margin:8px 0;}
  /* 第二行（标签行）整行横向滚动，不再只有 chips 内部小范围滚动 */
  .tab-row{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 14px;margin:0 0 8px;}
  .tab-row > *{flex:0 0 auto;}
  .cat-filter,.speech-tabs{overflow:visible;min-width:0;}
  .tools-row{margin-left:0;border-left:none;padding-left:0;}
  .feed{padding:8px 14px 64px;}
  .unit{padding:13px 38px 13px 16px;}
  .unit .pair{grid-template-columns:1fr;gap:8px;}
  .cn{border-left:none;padding-left:0;margin-top:4px;}
  .brand-pin .name{display:none;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="date-rail" id="dateRail"></div>
  <div class="tab-row">
    <div id="tabLeft" class="cat-filter"></div>
    <div class="tools-row">
      <button id="favBtn" class="fav-btn">❤ 收藏 (0)</button>
      <div class="mode-switch" id="modeSwitch">
        <button data-mode="both" class="active">双语对照</button>
        <button data-mode="en">只看英文</button>
      </div>
    </div>
  </div>
</div>

<div class="feed">
  <div id="content"></div>
</div>

<div id="ctxMenu" class="ctx-menu">
  <button data-act="fav"><span class="ic">❤️</span> 收藏</button>
  <button data-act="del"><span class="ic">🗑️</span> 删除</button>
</div>

<div id="favModal" class="modal">
  <div class="modal-box">
    <div class="modal-head"><span>❤ 收藏夹</span><button class="modal-close" id="favClose">✕</button></div>
    <div class="fav-list" id="favList"></div>
  </div>
</div>

<script>
var DAYS = {
  1: { items:[
    { cat:'speech', catLabel:'名人演讲', title:'Women in Sports', person:'谷爱凌',
      video:{bv:'BV1uW421A7yL', label:'B站 · 中英双字幕'},
      blocks:[
        {en:"Left. Right. Left. Right again. Getting lost in the rhythm of my turns was one of my favorite parts of skiing. Feeling the soft, powdery snow beneath my skis, I feel like I'm capable of anything.", cn:"向左转。向右转。向左转。再向右转。我最喜欢滑雪的一点便是沉溺于自己旋转的节奏中。触摸滑板下那柔软又细腻的白雪，让我觉得自己无所不能。"},
        {en:"At that point, I was the only girl on my team. I was put down at first; nobody wanted to ride the chairlift with me. But as time passed, I was slowly accepted, and made some of my closest friends. However, this entire process took three whole years.", cn:"那时，我是队里唯一的女孩。一开始我被冷落，没人愿意和我一起坐升降椅。渐渐地我被接纳了，还交到了几个最好的朋友。但这整个过程用了整整三年。"},
        {en:"Life is going to be a bumpy road for all of us, and building resiliency early on is important. My experiences have made me more tenacious and have taught me to meet my setbacks in life with open arms.", cn:"对我们所有人来说，生活的道路都将是崎岖不平的，及早培养韧性很重要。我的经历让我更加坚韧，也教会我张开双臂迎接人生中的挫折。"},
        {en:"I encourage you all to step out of your comfort zone to show the boys that girls are just as powerful as they are.", cn:"我鼓励大家都走出自己的舒适区，向男孩们证明，女孩和他们一样强大。"}
      ]},
    { cat:'speech', catLabel:'名人演讲', title:'Harvard World Development Forum', person:'谷爱凌',
      video:{bv:'BV1BD42157tx', label:'B站 · 中文字幕'},
      blocks:[
        {en:"\"After all, we're only young. What could we possibly do?\" My response to this quandary is simple. We must recognize our youth not as a hindrance, but as a strength.", cn:"「毕竟，我们年纪轻轻，能成什么事呢？」面对这个困境，我的回答很简单：我们必须认识到，青春年少不是障碍，而是一种力量。"},
        {en:"To be curious is to be humble, and to be humble is to be willing to be wrong.", cn:"求知需要谦逊，而谦逊意味着愿意犯错。"},
        {en:"Skiing has taught me to appreciate the value of resilience when it comes to modifying my approach after my original ideas were disproven. And I have been wrong. A lot.", cn:"滑雪教会我欣赏坚韧的价值——当最初的判断被现实否定后，学会调整方式。我犯过错误，犯过很多。"}
      ]},
    { cat:'speech', catLabel:'名人演讲', title:"I Admit It. I'm in Love With Fear", person:'谷爱凌',
      video:{bv:'BV1uW421A7yL', label:'B站 · 谷爱凌英文演讲原声'},
      blocks:[
        {en:"\"Fear\" is really an umbrella term for three distinct sensations: excitement, uncertainty, and pressure. I've learned that the nuanced indicators of each of these feelings can be instrumental to success when recognized and positively leveraged, and harbingers of injury when ignored.", cn:"「恐惧」实际上概括了三种不同的感受：兴奋、不确定性和压力。我已经明白，如果意识到并积极利用这些感受中的微妙信号，会对成功有帮助；如果忽视它们，往往就是受伤的先兆。"},
        {en:"In the split second following my visualization, the knot in my chest flutters and spreads — those famous butterflies reaching their final stage of metamorphosis. Excitement, the child of adrenaline, my true love and addiction.", cn:"想象结束后的一刹那，堵在我胸口的疙瘩终于扑腾着舒展开来——就像化茧成蝶那著名的蜕变终章。随着肾上腺素而来的兴奋，就是我真正热爱和沉迷的东西。"},
        {en:"Instead of ignoring fear, we build unique relationships with it by developing a profound sense of self-awareness and making deliberate risk assessments.", cn:"我们不是忽视恐惧，而是通过深刻的自我意识和深思熟虑的风险评估，与恐惧建立起独特的关系。"},
        {en:"As I enter my early adulthood, I'm proud of the work I've done to cope with pressure by bolstering my self-esteem and minimizing my need for external validation. I focus on gratitude, perspective, and on the joy this sport brings me, regardless of whether I'm alone or in front of a worldwide TV audience.", cn:"刚刚步入成年，我很自豪自己已经学会应对压力——办法是增强自尊，减少对外界认可的依赖。无论独自一人，还是面对全世界的电视观众，我都专注于感恩、眼界，以及这项运动带给我的快乐。"},
        {en:"Though my views of myself and the world are constantly evolving, one thing is for certain: no matter how much time passes, I'll always be a hopeless romantic when it comes to fear.", cn:"虽说我对自己和这个世界的看法总在变化，但有一件事是确定的：无论时间过去多久，在恐惧面前，我永远是一个无可救药的浪漫主义者。"}
      ]}
  ]},
  2: { items:[
    { cat:'speech', catLabel:'名人演讲', title:'Work Super Hard', person:'马斯克',
      video:{bv:'BV1DP4y157Y5', label:'B站 · 中英字幕'},
      blocks:[
        {en:"I think the first is, depending on how well you wanna do and particularly if you're starting a company, you need to work super-hard. So what does super-hard mean? Well, when my brother and I was starting our first company, instead of getting an apartment we just rented a small office and we slept on the couch. And we showered at the YMCA, and we had just one computer. So the website was up during the day, and I was coding at night, seven days a week, all the time. Work hard, like every waking hour.", cn:"第一，取决于你想做得多好，尤其如果要创办一家公司，你需要超级努力地工作。什么叫超级努力？我和哥哥创办第一家公司时，没租公寓，只租了间小办公室，睡在沙发上，在基督教青年会洗澡，只有一台电脑。网站白天运行，我晚上写代码，一周七天，从不间断。努力工作，把每个清醒的小时都用上。"},
        {en:"If you're entering anything where there's an existing marketplace against large entrenched competitors, then your product or service needs to be much better than theirs. It can't be a little bit better... It's gotta be a lot better.", cn:"如果你要进入一个已有强大对手的市场，你的产品或服务必须比他们好得多。不能只好一点点，一定要好很多。"},
        {en:"The most important thing is to attract great people. All the company is, is a group of people that have gathered together to create a product or service. Depending upon how talented and hardworking that group is, and degree to which they are focused cohesively in a good direction, that will determine the success of the company.", cn:"最重要的是吸引优秀的人。公司说到底就是一群聚在一起创造产品或服务的人。这群人多有才华、多勤奋、能否朝着好的方向凝心聚力，决定了公司的成败。"},
        {en:"Focus on signal over noise. A lot of companies get confused. They spend money on things that don't actually make the product better. At Tesla we've never spent any money on advertising. We put all of the money into R&D and manufacturing and design, to try to make the car as good as possible.", cn:"专注于信号而非噪音。很多公司搞混了，把钱花在不能让产品更好的东西上。在特斯拉，我们从没在广告上花过一分钱，我们把所有钱投入研发、制造和设计，尽力把车做到最好。"},
        {en:"Now is the time to take risk. As you get older your obligations increase. And once you have a family you start taking risks not just for yourself but for your family as well. It gets much harder to do things that might not work out. So now is the time to do that before you have those obligations. So I would encourage you to take risks now. Do something bold. You won't regret it.", cn:"现在是冒险的时候。随着年龄增长，你的责任越来越多。一旦有了家庭，你冒险就不只是为自己，而是为家人。那些可能不成功的事，做起来会难得多。所以趁现在还没有这些负担，去冒险吧。做一些大胆的事，你不会后悔的。"}
      ]},
    { cat:'speech', catLabel:'名人演讲', title:'Think Big & Dream Even Bigger', person:'马斯克',
      video:{bv:'BV1Tv411L7Pz', label:'B站 · 原声演讲'},
      blocks:[
        {en:"I read a quote from Arthur C. Clarke which said that \"A sufficiently advanced technology is indistinguishable from magic.\" And that's really true.", cn:"我读到亚瑟·克拉克的一句话：「任何足够先进的技术都与魔法无异。」这千真万确。"},
        {en:"The thing about a rocket is, the passing grade is 100%. And you don't get to actually test the rocket in the real environment that it is going to be in.", cn:"火箭的及格线是100分，而且你无法在它将要运行的真实环境中提前测试它。"},
        {en:"We were able to, eventually with the fourth flight in 2008, reach orbit. That was also with the last bit of money that we had. Thank goodness that happened. I think the saying is 'fourth time is the charm.'", cn:"2008年我们终于用第四次发射进入轨道，用的还是我们最后的积蓄。谢天谢地它成功了。俗话说「第四次终成」。"},
        {en:"You guys are the magicians of the 21st century. Don't let anything hold you back. Imagination is the limit. Go out there and create some magic.", cn:"你们是21世纪的魔法师。不要让任何东西束缚你。想象力没有极限。走出去，创造一些魔法吧。"}
      ]},
    { cat:'speech', catLabel:'名人演讲', title:'G20 Innovation Ministerial', person:'马斯克',
      video:{bv:'BV1JUtj6QENd', label:'B站 · 双语音+文稿'},
      blocks:[
        {en:"You have to have an environment that's relatively free of regulation, meaning that new things must be default legal as opposed to default illegal.", cn:"你必须拥有一个监管相对较少的环境，这意味着新事物必须「默认合法」，而不是「默认非法」。"},
        {en:"I think AI will probably increase the global economy by 20% to 30% — that's my rough estimate — meaning on the order of $20 to $30 trillion per year. AI will be able to do anything digital, anything that does not require shaping of atoms by hand, probably by the end of next year.", cn:"我认为 AI 大概会把全球经济总量提升 20% 到 30%——这是我的粗略估计——也就是每年大约增加 20 到 30 万亿美元。AI 将能够处理任何数字化的事情，任何不需要动手改变原子形态的事情，大概到明年年底就能实现。"},
        {en:"It starts off very slowly, but then grows at an explosive rate. If you say 10 years from now, I would say there will be well over a billion humanoid robots. And the productivity per robot will be probably five times that of a human — this is one I'd be willing to put serious money betting on — that there will be at least a billion robots in 10 years, and that those robots will be at least five times the output of a human, meaning the billion humanoid robots will be more productive than all humans combined.", cn:"它开始时非常缓慢，但随后会以爆炸性的速度增长。如果看十年以后，我说将远超过十亿台人形机器人。而且每台机器人的生产力，很可能是人类的五倍——这是我愿意押重注的预测——十年内至少会有十亿台机器人，每台的产出至少是人类的五倍。也就是说，十亿台人形机器人的生产力，将超过所有人类的总和。"},
        {en:"The usefulness of a humanoid robot, a general-purpose robot, is going to be roughly the AI software — how good is the AI software — times how good is the AI chip in the robot times how good is the electromechanical dexterity, especially of the hands. Now, all three of those things are improving exponentially, and the usefulness of the robot is those three things multiplied by each other.", cn:"人形机器人（通用机器人）的实用性，大致等于：AI 软件有多出色，乘以机器人中 AI 芯片有多出色，再乘以机电灵巧度（尤其是手）有多出色。这三者都在指数级改善，而机器人的实用性，就是这三者相乘的结果。"}
      ]}
  ]},
  3: { items:[
    { cat:'tips', catLabel:'每日贴士', title:'开会和邮件里最高频的7句话', blocks:[
      {en:"Let's take this offline.", cn:"开会时有人开始跑题、纠结细节，外国同事会笑着甩出这句。意思是：这个咱们会下单独聊。潜台词：别在会上浪费大家时间。"},
      {en:"Just circling back on this...", cn:"邮件里最常见的\"催一下\"，一般放在开头。直译是\"绕回来看看\"，实际意思是：之前那事怎么样了？礼貌、自然，一点不尴尬。"},
      {en:"Does that make sense?", cn:"讲完方案、布置完任务后最常问的一句。= 我说明白了吗？大家跟上了吗？比 \"Do you understand?\"（你听懂了吗？）客气得多，后者有点像在质问。"},
      {en:"Thanks for flagging!", cn:"有人好心提醒你一件事，回这句准没错。= 谢谢提醒！职场万能回复，显得你靠谱又好相处。"},
      {en:"Let's park that for now.", cn:"park 本来是停车，这里是\"先搁置一下\"。讨论卡住、时间不够时用：这个咱们先放一放，回头再说。比 \"stop talking about it\" 体面多了。"},
      {en:"How's your morning going?", cn:"比 \"How are you?\" 更常用的开场白。周一早上、接电话、视频会议刚接通时都能用，对方一般回 \"Pretty good, you?\"，对话就打开了。"},
      {en:"Any fun plans for the weekend?", cn:"周五下午的固定节目。外国人问是真心想听答案，下周一还可以接着问 \"How was your weekend?\"——关系就是这么一句一句聊出来的。"}
    ]},
    { cat:'speech', catLabel:'名人演讲', title:'Stay Hungry, Stay Foolish', person:'Steve Jobs', blocks:[
      {en:"Your time is limited, so don't waste it living someone else's life. Don't be trapped by dogma — which is living with the results of other people's thinking. Don't let the noise of others' opinions drown out your own inner voice. And most important, have the courage to follow your heart and intuition. They somehow already know what you truly want to become. Everything else is secondary.", cn:"你的时间有限，不要浪费在过别人的生活上。不要被教条束缚——那意味着活在别人思考的结果里。不要让别人意见的噪音淹没了你内心的声音。最重要的是，要有勇气追随你的内心和直觉，它们早就知道你真正想成为什么。其他一切都是次要的。"},
      {en:"When I was young, there was an amazing publication called The Whole Earth Catalog, which was one of the bibles of my generation. It was created by a fellow named Stewart Brand not far from here in Menlo Park, and he brought it to life with his poetic touch. This was in the late 1960s, before personal computers and desktop publishing, so it was all made with typewriters, scissors and Polaroid cameras. It was sort of like Google in paperback form, 35 years before Google came along: it was idealistic, and overflowing with neat tools and great notions.", cn:"我年轻的时候，有一本非常棒的刊物叫《Whole Earth Catalog》（地球目录），是我们那一代人的圣经之一。它是一位名叫 Stewart Brand 的老兄创办的，就在离这里不远的门洛帕克，他用诗意的笔触赋予了它生命。那是上世纪六十年代末，还没有个人电脑和桌面排版，所以整本杂志都是用打字机、剪刀和拍立得做出来的。它有点像纸质版的谷歌，只不过早了三十五年：充满理想主义，满是精巧的工具和绝妙的点子。"},
      {en:"Stewart and his team put out several issues of The Whole Earth Catalog, and then when it had run its course, they put out a final issue. It was the mid-1970s, and I was your age. On the back cover of their final issue was a photograph of an early morning country road, the kind you might find yourself hitchhiking on if you were so adventurous. Beneath it were the words: \"Stay Hungry. Stay Foolish.\" It was their farewell message as they signed off. Stay Hungry. Stay Foolish. And I have always wished that for myself. And now, as you graduate to begin anew, I wish that for you.", cn:"Stewart 和他的团队出了好几期《地球目录》，后来在它完成使命之后，又出了最后一期。那是七十年代中期，我和你们现在差不多大。在最后一期的封底，是一张清晨乡间小路的照片，那种如果你够爱冒险、可能会去搭便车的小路。照片下面写着：\"Stay Hungry. Stay Foolish.\"（求知若饥，虚心若愚。）那是他们告别时的赠言。求知若饥，虚心若愚。我一直以此自勉。现在，你们毕业了，开启新的人生，我把这句话送给你们。"},
      {en:"\"Stay Hungry. Stay Foolish.\"", cn:"求知若饥，虚心若愚。"}
    ]}
  ]},
  4: { items:[
    { cat:'tips', catLabel:'每日贴士', title:'和外国同事自然开场', blocks:[
      {en:"How was your weekend?", cn:"周一早上最经典的开场白。= 你周末过得怎么样？对方一般简单说两句，你接一句 \"That sounds nice!\"（听起来不错！），对话就续上了。"},
      {en:"Did you do anything fun over the weekend?", cn:"比上一句更具体、更好接话。= 周末干点啥好玩的了吗？哪怕对方只说 \"Not much, just rested\"（没干啥，就休息了），你回 \"Sometimes that's the best kind of weekend.\"（有时候这就是最棒的周末。）就行。"},
      {en:"How's it going?", cn:"比 \"How are you?\" 更随意、更常用。= 最近咋样？电梯里、茶水间偶遇时用，对方回 \"Pretty good!\" 就行，不用真的汇报近况。"},
      {en:"This coffee is a lifesaver this morning.", cn:"lifesaver 本意是\"救生员\"，这里是夸张说法。= 今早这杯咖啡真是救了我。早上端着咖啡遇到同事，随口来一句，亲切感直接拉满。"},
      {en:"Looks like we're in for some rain later.", cn:"聊天气的万能句，永远不会错。= 看样子晚点要下雨。不知道聊啥的时候，天气永远是安全话题。"},
      {en:"What have you been up to lately?", cn:"= 最近在忙什么呢？比 \"How are you?\" 具体，适合有段时间没见的同事，对方会真的跟你分享两句近况。"},
      {en:"I could really use a coffee. How about you?", cn:"= 我真得来杯咖啡，你呢？上午犯困时跟同事说，经常能顺势一起下楼买咖啡，关系就是这么处出来的。"},
      {en:"It's been one of those days.", cn:"= 今天是那种\"诸事不顺\"的日子。连踩三个坑、加班到头秃的时候，跟同事相视一笑说这句，啥都懂了，不用多解释。"}
    ]}
  ]}
  5: { items:[
    { cat:'tips', catLabel:'每日贴士', title:"英美剧台词：外国人嘴边挂着的7句", blocks:[
      {en:"How you doin'?", cn:"出自《老友记》Joey 的标志性搭讪开场白。= 你怎么样啊？（挑眉坏笑版）。外国人笑着说这句通常是在模仿耍帅、调侃气氛，千万别当成正经问候回 \"I'm fine\"——人家在玩梗。"},
      {en:"We were on a break!", cn:"出自《老友记》Ross 的世纪甩锅名场面。= 那会儿我们分手了啊！（所以不算我错）。外国人犯错被抓包时搬出这句，就是学 Ross 死不认账，语气又急又委屈——重点不在讲道理，在自嘲玩梗。"},
      {en:"Winter is coming.", cn:"出自《权力的游戏》史塔克家家训。= 寒冬将至。外国人说这句不是聊天气，是在预警：难搞的事要来了。语气可以很凝重（真有麻烦），也可以是调侃（比如季度末赶 deadline 前互相打气）。"},
      {en:"Yada, yada, yada.", cn:"出自《宋飞传》，相当于中文的\"然后嘛、然后嘛\"。= 中间那谁谁说了啥啥啥（不重要，跳过）。外国人讲故事嫌啰嗦时用这三个词代替中间过程，语气漫不经心，潜台词是\"后面的事你懂的，不重要\"。"},
      {en:"I'll be back.", cn:"出自《终结者》施瓦辛格的经典台词。= 我会回来的。外国人暂时走开时甩出这句，自带\"我还会回来收拾局面\"的酷劲儿，比干巴巴的 \"See you later\" 戏剧感强得多。"},
      {en:"Live long and prosper.", cn:"出自《星际迷航》Spock 的祝福，配那个分指手势。= 生生不息，繁荣昌盛。外国 geek 圈告别或祝福时用，语气真诚又带点 nerd 式的可爱——收到这句，等于对方把你当自己人。"},
      {en:"That's what she said.", cn:"出自《办公室》Michael Scott 的口头禅。= 这话听着有歧义哦（带点颜色的那种）。当有人说的话听起来像双关（比如 \"This is so hard\"），外国人立刻接这句，全场爆笑。职场里慎用，但听懂了你就懂了半个美国办公室文化。"},
    ]},
    { cat:'speech', catLabel:'名人演讲', title:"谷爱凌：No matter if I land that trick", person:"Eileen Gu", blocks:[
      {en:"Whether I landed it or not, it was a testament to my character that was something I wanted to show the world. I feel sport is really a way that we can unite people. It is not something that can be used to divide people. We are all out here together, pushing the human limit.", cn:"无论我有没有落稳那个动作，它都证明了我的品格——我想让世界看到这一点。我觉得体育真的是一种能让人们团结在一起的方式，它不应该被用来制造分裂。我们所有人都在这里，一起挑战人类极限。"},
      {en:"I grew up spending 25-30% of every year in China. I feel I am just as American as I am Chinese. My mission is to use sport as a force for unity, to use it as a form to foster interconnection between countries and not use it as a divisive force. That benefits everyone and if you disagree with that, I feel that is someone else's problem.", cn:"我从小每年有四分之一到三成的时间在中国度过。我觉得我既是美国人，也是中国人。我的使命是把体育当作团结的力量，当作促进各国之间联结的纽带，而不是分裂的工具。这对所有人都有好处，如果你不同意，我觉得那是别人的问题。"},
      {en:"No matter if I land that trick, I win because the whole world can see my spirit. I want to break boundaries for girls, they can think as long as Eileen can do it, they can also do it.", cn:"不管我能不能落稳那个动作，我都赢了，因为全世界都能看到我的精神。我想为女孩子们打破边界，让她们觉得：既然谷爱凌能做到，我也能做到。"},
    ]},
  ]},
};

var now = new Date();
var today = now.getDate();
var DAY_KEY = 'merged-day-v1';
var SPEECH_KEY = 'merged-speech-v1';
var savedDay = parseInt(localStorage.getItem(DAY_KEY) || '', 10);
var day = (savedDay>=1 && savedDay<=31 && DAYS[savedDay]) ? savedDay : today;
var catFilter = null;
var activeSpeech = {};
try { activeSpeech = JSON.parse(localStorage.getItem(SPEECH_KEY) || '{}'); } catch(e){}
function persistDay(){ try{ localStorage.setItem(DAY_KEY, String(day)); }catch(e){} }
function persistSpeech(){ try{ localStorage.setItem(SPEECH_KEY, JSON.stringify(activeSpeech)); }catch(e){} }

var modeSwitch = document.getElementById('modeSwitch');
var dateRail = document.getElementById('dateRail');
var catFilterEl = document.getElementById('tabLeft');
var content = document.getElementById('content');
var favBtn = document.getElementById('favBtn');
var ctxMenu = document.getElementById('ctxMenu');
var favModal = document.getElementById('favModal');
var favList = document.getElementById('favList');

var DEL_KEY = 'merged-del-v8';
var delSet = new Set();
try { delSet = new Set(JSON.parse(localStorage.getItem(DEL_KEY) || '[]')); } catch(e){}
function persistDel(){ try{ localStorage.setItem(DEL_KEY, JSON.stringify(Array.from(delSet))); }catch(e){} }
persistDel();

var FAV_KEY = 'merged-fav-v8';
var favSet = new Set();
try { favSet = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){}
function persistFav(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favSet))); }catch(e){} }
function updateFavBtn(){ favBtn.textContent = '❤ 收藏 ('+favSet.size+')'; }
function unitKey(it, bi){ return day + ':' + DAYS[day].items.indexOf(it) + ':' + bi; }

var saved = null;
try { saved = localStorage.getItem('never-mode'); } catch(e){}
function applyMode(m){
  document.body.classList.remove('mode-en','mode-cn');
  if(m==='en') document.body.classList.add('mode-en');
  modeSwitch.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===m); });
  try{ localStorage.setItem('never-mode', m); }catch(e){}
}
modeSwitch.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(){ applyMode(b.dataset.mode); });
});
if(saved==='en'||saved==='cn'||saved==='both') applyMode(saved==='cn'?'both':saved);

function isSpecialDay(d){
  if(!DAYS[d]) return false;
  var items = DAYS[d].items;
  if(!items || !items.length) return false;
  var allSpeech = items.every(function(it){ return it.cat==='speech'; });
  var samePerson = items.every(function(it){ return it.person && it.person===items[0].person; });
  return allSpeech && samePerson;
}

function dayItems(){ return DAYS[day] ? DAYS[day].items : []; }

function renderDateRail(){
  var y = now.getFullYear(), m = now.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var monthLabel = (m+1) + '月';
  dateRail.innerHTML = '';
  var month = document.createElement('div');
  month.className = 'month-pin';
  month.textContent = monthLabel;
  dateRail.appendChild(month);
  var activeChip = null;
  for(var d=1; d<=days; d++){
    (function(dd){
      var b = document.createElement('button');
      b.className = 'date-chip' + (dd===day?' active':'');
      b.textContent = dd;
      if(DAYS[dd]){ var dot = document.createElement('span'); dot.className='dot'; b.appendChild(dot); }
      b.addEventListener('click', function(){ day = dd; persistDay(); renderDateRail(); renderCatFilter(); renderContent(); window.scrollTo(0,0); });
      dateRail.appendChild(b);
      if(dd===day) activeChip = b;
    })(d);
  }
  if(activeChip) dateRail.scrollLeft = Math.max(0, activeChip.offsetLeft - 150);
}

dateRail.addEventListener('wheel', function(e){
  e.preventDefault();
  stepDay(e.deltaY > 0 ? 1 : -1);
}, {passive:false});

function stepDay(dir){
  var max = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var d = day;
  while(true){
    d += dir;
    if(d < 1 || d > max) break;
    if(DAYS[d]){ day = d; persistDay(); renderDateRail(); renderCatFilter(); renderContent(); return; }
  }
}

function chipLabel(it, active){
  var base = it.catLabel;
  if(!active) return base;
  var parts = [];
  if(it.person) parts.push(it.person);
  if(it.title && it.title !== base) parts.push(it.title);
  if(parts.length) return [base].concat(parts).join(' - ');
  return base;
}
function appendBrandChip(items){
  var b = document.createElement('span');
  b.className = 'brand-pin';
  b.innerHTML = '<span class="icon">📚</span>英语自习室';
  items.appendChild(b);
}
function renderCatFilter(){
  if(isSpecialDay(day)){ catFilterEl.innerHTML=''; return; }
  catFilterEl.innerHTML = '';
  var items = dayItems();
  var seen = {}, cats = [];
  items.forEach(function(it){ if(!seen[it.cat]){ seen[it.cat]=1; cats.push(it); } });
  if(cats.length && (catFilter===null || !cats.some(function(c){ return c.cat===catFilter; }))){
    catFilter = cats[0].cat;
  }
  appendBrandChip(catFilterEl);
  cats.forEach(function(it){
    var b = document.createElement('button');
    var active = (catFilter===it.cat);
    b.className = 'chip' + (active?' active':'');
    b.textContent = chipLabel(it, active);
    b.addEventListener('click', function(){ catFilter = it.cat; renderCatFilter(); renderContent(); });
    catFilterEl.appendChild(b);
  });
}

function unitHTML(key, b){
  var faved = favSet.has(key);
  return '<div class="unit'+(faved?' faved':'')+'">'
    + '<button class="more-btn'+(faved?' faved':'')+'" data-key="'+key+'" title="收藏 / 删除">⋯</button>'
    + '<div class="pair"><div class="en">'+b.en+'</div><div class="cn">'+b.cn+'</div></div>'
    + '</div>';
}

function bindMore(){
  content.querySelectorAll('.more-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      openCtx(btn.dataset.key, btn);
    });
  });
}

var ctxKey = null;
function openCtx(key, btn){
  ctxKey = key;
  var r = btn.getBoundingClientRect();
  ctxMenu.style.display = 'block';
  var mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  var left = r.right - mw;
  if(left < 8) left = 8;
  var top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = r.top - mh - 6;
  if(top < 8) top = 8;
  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top = top + 'px';
}
function closeCtx(){ ctxMenu.style.display='none'; ctxKey=null; }
document.addEventListener('click', closeCtx);
ctxMenu.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(e){
    e.stopPropagation();
    if(!ctxKey) return;
    if(b.dataset.act==='fav'){
      if(favSet.has(ctxKey)) favSet.delete(ctxKey); else favSet.add(ctxKey);
      persistFav(); updateFavBtn();
    } else if(b.dataset.act==='del'){
      delSet.add(ctxKey); persistDel();     }
    closeCtx();
    renderContent();
  });
});

favBtn.addEventListener('click', function(){ renderFavList(); favModal.classList.add('open'); });
document.getElementById('favClose').addEventListener('click', function(){ favModal.classList.remove('open'); });
favModal.addEventListener('click', function(e){ if(e.target===favModal) favModal.classList.remove('open'); });
function renderFavList(){
  if(favSet.size===0){
    favList.innerHTML = '<p class="fav-empty">还没有收藏的句子。<br>点每段右上角的 ⋯，选 ❤️ 就能收进来。</p>';
    return;
  }
  var html = '';
  Array.from(favSet).forEach(function(key){
    var p = key.split(':'); var d=+p[0], gi=+p[1], bi=+p[2];
    var it = DAYS[d] && DAYS[d].items[gi]; if(!it) return;
    var b = it.blocks[bi]; if(!b) return;
    var src = (now.getMonth()+1)+'月'+d+'日 · '+(it.person?it.person+' · ':'')+it.title;
    html += '<div class="fav-item"><div class="src">'+src+'</div>'
      + '<div class="en">'+b.en+'</div><div class="cn">'+b.cn+'</div>'
      + '<button class="fav-del" data-key="'+key+'">♡ 取消收藏</button></div>';
  });
  favList.innerHTML = html;
  favList.querySelectorAll('.fav-del').forEach(function(btn){
    btn.addEventListener('click', function(){
      favSet.delete(btn.dataset.key); persistFav(); updateFavBtn(); renderFavList(); renderContent();
    });
  });
}

function renderSpecialDay(){
  var items = DAYS[day].items;
  if(activeSpeech[day]===undefined) activeSpeech[day]=0;
  var tabs = '<div class="speech-tabs">';
  tabs += '<span class="brand-pin"><span class="icon">📚</span>英语自习室</span>';
  var baseCat = items[0].catLabel || '名人演讲';
  items.forEach(function(it, idx){
    var isActive = (idx===activeSpeech[day]);
    var parts = [];
    if(isActive){
      if(it.person) parts.push(it.person);
      if(it.title && it.title !== baseCat) parts.push(it.title);
    }
    var label = parts.length ? ([baseCat].concat(parts).join(' - ')) : baseCat;
    tabs += '<button class="speech-tab'+(isActive?' active':'')+'" data-idx="'+idx+'">'+label+'</button>';
  });
  tabs += '</div>';
  catFilterEl.innerHTML = tabs;

  var it2 = items[activeSpeech[day]];
  var remaining = 0;
  var html = '<div class="speech-view">';
  it2.blocks.forEach(function(b, bi){
    var key = unitKey(it2, bi);
    if(delSet.has(key)) return;
    remaining++;
    html += unitHTML(key, b);
  });
  html += '</div>';
  if(remaining===0) html += '<p class="empty">这段都被删光啦，点右上角「恢复已删」可找回。</p>';
  if(it2.video) html += '<div class="video-anchor"><a href="https://www.bilibili.com/video/'+it2.video.bv+'/" target="_blank" rel="noopener"><span class="play-icon">▶</span> '+it2.video.label+'</a></div>';
  content.innerHTML = html;

  catFilterEl.querySelectorAll('.speech-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeSpeech[day] = +btn.dataset.idx; persistSpeech();
      renderContent();
    });
  });
  bindMore();
}

function renderNormalDay(){
  var items = dayItems().filter(function(it){ return catFilter===null || it.cat===catFilter; });
  var html = '';
  var videoToShow = null;
  items.forEach(function(it){
    var units = '';
    it.blocks.forEach(function(b, bi){
      var key = unitKey(it, bi);
      if(delSet.has(key)) return;
      units += unitHTML(key, b);
    });
    html += units;
    if(!videoToShow && it.video) videoToShow = it.video;
  });
  if(!items.length) html = '<p class="empty">这天还没有推送内容～</p>';
  if(videoToShow) html += '<div class="video-anchor"><a href="https://www.bilibili.com/video/'+videoToShow.bv+'/" target="_blank" rel="noopener"><span class="play-icon">▶</span> '+videoToShow.label+'</a></div>';
  content.innerHTML = html;
  bindMore();
}

function renderContent(){
  if(isSpecialDay(day)) renderSpecialDay();
  else renderNormalDay();
  balanceAllUnits();
}

/* ---- 英中行数对齐：按英文高度收窄中文列 ---- */
function isTwoCol(){
  return !document.body.classList.contains('mode-en') && window.innerWidth > 860;
}
function linesOf(el){
  var lh = parseFloat(getComputedStyle(el).lineHeight);
  if(!lh || isNaN(lh)) lh = parseFloat(getComputedStyle(el).fontSize) * 1.5;
  return Math.max(1, Math.round(el.offsetHeight / lh));
}
function balanceUnit(unitEl){
  var pair = unitEl.querySelector('.pair');
  var en = pair && pair.querySelector('.en');
  var cn = pair && pair.querySelector('.cn');
  if(!en || !cn) return;
  var cs = getComputedStyle(pair);
  var cols = cs.gridTemplateColumns.trim().split(/\s+/).length;
  if(cols < 2){ pair.style.gridTemplateColumns=''; return; }
  pair.style.gridTemplateColumns = '';
  void pair.offsetHeight;
  var gap = parseFloat(getComputedStyle(pair).columnGap || getComputedStyle(pair).gap) || 0;
  var pairW = pair.clientWidth;
  if(!pairW) return;
  var minW = 60;
  var maxW = pairW - gap - minW;
  if(maxW < minW) return;
  var lo = minW, hi = maxW;
  var bestW = (pairW - gap) / 2;
  var bestDiff = Math.abs(linesOf(cn) - linesOf(en));
  for(var i=0;i<14;i++){
    var mid = Math.round((lo + hi) / 2);
    pair.style.gridTemplateColumns = '1fr ' + mid + 'px';
    void pair.offsetHeight;
    var enL = linesOf(en), cnL = linesOf(cn);
    var diff = cnL - enL;
    if(Math.abs(diff) < bestDiff){ bestDiff = Math.abs(diff); bestW = mid; }
    if(diff > 0) lo = mid; else if(diff < 0) hi = mid; else { bestW = mid; break; }
  }
  pair.style.gridTemplateColumns = '1fr ' + bestW + 'px';
}
function balanceAllUnits(){
  if(!isTwoCol()) return;
  document.querySelectorAll('.unit').forEach(balanceUnit);
}
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(balanceAllUnits, 120);
});

renderDateRail();
renderCatFilter();
renderContent();
updateFavBtn();
</script>
