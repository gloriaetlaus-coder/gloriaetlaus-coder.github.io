var now = new Date();
var today = now.getDate();
var DAY_KEY = 'merged-day-v1';
var SPEECH_KEY = 'merged-speech-v1';
var savedDay = parseInt(localStorage.getItem(DAY_KEY) || '', 10);
var day = (savedDay>=1 && savedDay<=31 && DAYS[savedDay]) ? savedDay : today;
var catFilter = null;
var activeSpeech = {};
try { activeSpeech = JSON.parse(localStorage.getItem(SPEECH_KEY) || '{}'); } catch(e){}
function persistDay(){ try{ localStorage.setItem(DAY_KEY, String(day)); }catch(e){} }
function persistSpeech(){ try{ localStorage.setItem(SPEECH_KEY, JSON.stringify(activeSpeech)); }catch(e){} }

var modeSwitch = document.getElementById('modeSwitch');
var dateRail = document.getElementById('dateRail');
var catFilterEl = document.getElementById('tabLeft');
var content = document.getElementById('content');
var favBtn = document.getElementById('favBtn');
var ctxMenu = document.getElementById('ctxMenu');
var favModal = document.getElementById('favModal');
var favList = document.getElementById('favList');

var DEL_KEY = 'merged-del-v8';
var delSet = new Set();
try { delSet = new Set(JSON.parse(localStorage.getItem(DEL_KEY) || '[]')); } catch(e){}
function persistDel(){ try{ localStorage.setItem(DEL_KEY, JSON.stringify(Array.from(delSet))); }catch(e){} }
persistDel();

var FAV_KEY = 'merged-fav-v8';
var favSet = new Set();
try { favSet = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){}
function persistFav(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favSet))); }catch(e){} }
function updateFavBtn(){ favBtn.textContent = '❤ 收藏 ('+favSet.size+')'; }
function unitKey(it, bi){ return day + ':' + DAYS[day].items.indexOf(it) + ':' + bi; }
/* ---- 按内容指纹删除：推送更新/条目重排后，删掉的段落不再复活 ---- */
function cyrb53(str, seed){
  var h1 = 0xdeadbeef ^ (seed||0), h2 = 0x41c6ce57 ^ (seed||0);
  for(var i=0, ch; i<str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(36) + (h1>>>0).toString(36);
}
function contentKey(b){ return 'c:' + cyrb53(String((b&&b.en)||'').replace(/\s+/g,' ').trim(), 0); }
function isDeleted(key, b){ return delSet.has(key) || (b && delSet.has(contentKey(b))); }

var saved = null;
try { saved = localStorage.getItem('never-mode'); } catch(e){}
function applyMode(m){
  document.body.classList.remove('mode-en','mode-cn');
  if(m==='en') document.body.classList.add('mode-en');
  modeSwitch.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===m); });
  try{ localStorage.setItem('never-mode', m); }catch(e){}
}
modeSwitch.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(){ applyMode(b.dataset.mode); });
});
if(saved==='en'||saved==='cn'||saved==='both') applyMode(saved==='cn'?'both':saved);

function isSpecialDay(d){
  if(!DAYS[d]) return false;
  var items = DAYS[d].items;
  if(!items || !items.length) return false;
  var allSpeech = items.every(function(it){ return it.cat==='speech'; });
  var samePerson = items.every(function(it){ return it.person && it.person===items[0].person; });
  return allSpeech && samePerson;
}

function dayItems(){ return DAYS[day] ? DAYS[day].items : []; }

function renderDateRail(){
  var y = now.getFullYear(), m = now.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var monthLabel = (m+1) + '月';
  dateRail.innerHTML = '';
  var month = document.createElement('div');
  month.className = 'month-pin';
  month.textContent = monthLabel;
  dateRail.appendChild(month);
  var activeChip = null;
  for(var d=1; d<=days; d++){
    (function(dd){
      var b = document.createElement('button');
      b.className = 'date-chip' + (dd===day?' active':'');
      b.textContent = dd;
      if(DAYS[dd]){ var dot = document.createElement('span'); dot.className='dot'; b.appendChild(dot); }
      b.addEventListener('click', function(){ day = dd; persistDay(); renderDateRail(); renderCatFilter(); renderContent(); window.scrollTo(0,0); });
      dateRail.appendChild(b);
      if(dd===day) activeChip = b;
    })(d);
  }
  if(activeChip) activeChip.scrollIntoView({inline:'center',block:'nearest'});
}

dateRail.addEventListener('wheel', function(e){
  e.preventDefault();
  stepDay(e.deltaY > 0 ? 1 : -1);
}, {passive:false});

function stepDay(dir){
  var max = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var d = day;
  while(true){
    d += dir;
    if(d < 1 || d > max) break;
    if(DAYS[d]){ day = d; persistDay(); renderDateRail(); renderCatFilter(); renderContent(); return; }
  }
}

function chipLabel(it, active){
  var base = it.catLabel;
  if(!active) return base;
  var parts = [];
  if(it.person) parts.push(it.person);
  if(it.title && it.title !== base) parts.push(it.title);
  if(parts.length) return [base].concat(parts).join(' - ');
  return base;
}
function appendBrandChip(items){
  var b = document.createElement('span');
  b.className = 'brand-pin';
  b.innerHTML = '<span class="icon">📚</span>英语自习室';
  items.appendChild(b);
}
function renderCatFilter(){
  if(isSpecialDay(day)){ catFilterEl.innerHTML=''; return; }
  catFilterEl.innerHTML = '';
  var items = dayItems();
  var seen = {}, cats = [];
  items.forEach(function(it){ if(!seen[it.cat]){ seen[it.cat]=1; cats.push(it); } });
  if(cats.length && (catFilter===null || !cats.some(function(c){ return c.cat===catFilter; }))){
    catFilter = cats[0].cat;
  }
  cats.forEach(function(it){
    var b = document.createElement('button');
    var active = (catFilter===it.cat);
    b.className = 'chip' + (active?' active':'');
    b.textContent = chipLabel(it, active);
    b.addEventListener('click', function(){ catFilter = it.cat; renderCatFilter(); renderContent(); });
    catFilterEl.appendChild(b);
  });
}

function unitHTML(key, b){
  var faved = favSet.has(key);
  return '<div class="unit'+(faved?' faved':'')+'">'
    + '<button class="more-btn'+(faved?' faved':'')+'" data-key="'+key+'" title="收藏 / 删除">⋯</button>'
    + '<div class="pair"><div class="en">'+b.en+'</div><div class="cn">'+b.cn+'</div></div>'
    + '</div>';
}

function bindMore(){
  content.querySelectorAll('.more-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      openCtx(btn.dataset.key, btn);
    });
  });
}

var ctxKey = null;
function openCtx(key, btn){
  ctxKey = key;
  var r = btn.getBoundingClientRect();
  ctxMenu.style.display = 'block';
  var mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  var left = r.right - mw;
  if(left < 8) left = 8;
  var top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = r.top - mh - 6;
  if(top < 8) top = 8;
  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top = top + 'px';
}
function closeCtx(){ ctxMenu.style.display='none'; ctxKey=null; }
document.addEventListener('click', closeCtx);
ctxMenu.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(e){
    e.stopPropagation();
    if(!ctxKey) return;
    if(b.dataset.act==='fav'){
      if(favSet.has(ctxKey)) favSet.delete(ctxKey); else favSet.add(ctxKey);
      persistFav(); updateFavBtn();
    } else if(b.dataset.act==='del'){
      delSet.add(ctxKey);
      var _kp = ctxKey.split(':');
      var _it = DAYS[+_kp[0]] && DAYS[+_kp[0]].items[+_kp[1]];
      var _bl = _it && _it.blocks[+_kp[2]];
      if(_bl) delSet.add(contentKey(_bl));
      persistDel();     }
    closeCtx();
    renderContent();
  });
});

favBtn.addEventListener('click', function(){ renderFavList(); favModal.classList.add('open'); });
document.getElementById('favClose').addEventListener('click', function(){ favModal.classList.remove('open'); });
favModal.addEventListener('click', function(e){ if(e.target===favModal) favModal.classList.remove('open'); });
function renderFavList(){
  if(favSet.size===0){
    favList.innerHTML = '<p class="fav-empty">还没有收藏的句子。<br>点每段右上角的 ⋯，选 ❤️ 就能收进来。</p>';
    return;
  }
  var html = '';
  Array.from(favSet).forEach(function(key){
    var p = key.split(':'); var d=+p[0], gi=+p[1], bi=+p[2];
    var it = DAYS[d] && DAYS[d].items[gi]; if(!it) return;
    var b = it.blocks[bi]; if(!b) return;
    var src = (now.getMonth()+1)+'月'+d+'日 · '+(it.person?it.person+' · ':'')+it.title;
    html += '<div class="fav-item"><div class="src">'+src+'</div>'
      + '<div class="en">'+b.en+'</div><div class="cn">'+b.cn+'</div>'
      + '<button class="fav-del" data-key="'+key+'">♡ 取消收藏</button></div>';
  });
  favList.innerHTML = html;
  favList.querySelectorAll('.fav-del').forEach(function(btn){
    btn.addEventListener('click', function(){
      favSet.delete(btn.dataset.key); persistFav(); updateFavBtn(); renderFavList(); renderContent();
    });
  });
}

function renderSpecialDay(){
  var items = DAYS[day].items;
  if(activeSpeech[day]===undefined) activeSpeech[day]=0;
  var tabs = '<div class="speech-tabs">';
  var baseCat = items[0].catLabel || '名人演讲';
  items.forEach(function(it, idx){
    var isActive = (idx===activeSpeech[day]);
    var label;
    if(isActive){
      var parts = [];
      if(it.person) parts.push(it.person);
      if(it.title && it.title !== baseCat) parts.push(it.title);
      label = parts.length ? ([baseCat].concat(parts).join(' - ')) : baseCat;
    } else {
      label = it.short || it.title;
    }
    tabs += '<button class="speech-tab'+(isActive?' active':'')+'" data-idx="'+idx+'">'+label+'</button>';
  });
  tabs += '</div>';
  catFilterEl.innerHTML = tabs;

  var it2 = items[activeSpeech[day]];
  var remaining = 0;
  var html = '<div class="speech-view">';
  it2.blocks.forEach(function(b, bi){
    var key = unitKey(it2, bi);
    if(isDeleted(key, b)) return;
    remaining++;
    html += unitHTML(key, b);
  });
  html += '</div>';
  if(remaining===0) html += '<p class="empty">这段都被删光啦，点右上角「恢复已删」可找回。</p>';
  if(it2.video) html += '<div class="video-anchor"><a href="https://www.bilibili.com/video/'+it2.video.bv+'/" target="_blank" rel="noopener"><span class="play-icon">▶</span> '+it2.video.label+'</a></div>';
  content.innerHTML = html;

  catFilterEl.querySelectorAll('.speech-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeSpeech[day] = +btn.dataset.idx; persistSpeech();
      renderContent();
    });
  });
  bindMore();
}

function renderNormalDay(){
  var items = dayItems().filter(function(it){ return catFilter===null || it.cat===catFilter; });
  var html = '';
  var videoToShow = null;
  items.forEach(function(it){
    var units = '';
    it.blocks.forEach(function(b, bi){
      var key = unitKey(it, bi);
      if(isDeleted(key, b)) return;
      units += unitHTML(key, b);
    });
    html += units;
    if(!videoToShow && it.video) videoToShow = it.video;
  });
  if(!items.length) html = '<p class="empty">这天还没有推送内容～</p>';
  if(videoToShow) html += '<div class="video-anchor"><a href="https://www.bilibili.com/video/'+videoToShow.bv+'/" target="_blank" rel="noopener"><span class="play-icon">▶</span> '+videoToShow.label+'</a></div>';
  content.innerHTML = html;
  bindMore();
}

function renderContent(){
  if(isSpecialDay(day)) renderSpecialDay();
  else renderNormalDay();
  balanceAllUnits();
}

/* ---- 英中行数对齐：按英文高度收窄中文列 ---- */
function isTwoCol(){
  return !document.body.classList.contains('mode-en') && window.innerWidth > 860;
}
function linesOf(el){
  var lh = parseFloat(getComputedStyle(el).lineHeight);
  if(!lh || isNaN(lh)) lh = parseFloat(getComputedStyle(el).fontSize) * 1.5;
  return Math.max(1, Math.round(el.offsetHeight / lh));
}
function balanceUnit(unitEl){
  var pair = unitEl.querySelector('.pair');
  var en = pair && pair.querySelector('.en');
  var cn = pair && pair.querySelector('.cn');
  if(!en || !cn) return;
  var cs = getComputedStyle(pair);
  var cols = cs.gridTemplateColumns.trim().split(/\s+/).length;
  if(cols < 2){ pair.style.gridTemplateColumns=''; return; }
  pair.style.gridTemplateColumns = '';
  void pair.offsetHeight;
  var gap = parseFloat(getComputedStyle(pair).columnGap || getComputedStyle(pair).gap) || 0;
  var pairW = pair.clientWidth;
  if(!pairW) return;
  var minW = 60;
  var maxW = pairW - gap - minW;
  if(maxW < minW) return;
  var lo = minW, hi = maxW;
  var bestW = (pairW - gap) / 2;
  var bestDiff = Math.abs(linesOf(cn) - linesOf(en));
  for(var i=0;i<14;i++){
    var mid = Math.round((lo + hi) / 2);
    pair.style.gridTemplateColumns = '1fr ' + mid + 'px';
    void pair.offsetHeight;
    var enL = linesOf(en), cnL = linesOf(cn);
    var diff = cnL - enL;
    if(Math.abs(diff) < bestDiff){ bestDiff = Math.abs(diff); bestW = mid; }
    if(diff > 0) lo = mid; else if(diff < 0) hi = mid; else { bestW = mid; break; }
  }
  pair.style.gridTemplateColumns = '1fr ' + bestW + 'px';
}
function balanceAllUnits(){
  if(!isTwoCol()) return;
  document.querySelectorAll('.unit').forEach(balanceUnit);
}
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(balanceAllUnits, 120);
});

renderDateRail();
renderCatFilter();
renderContent();
updateFavBtn();
