<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7A5FC0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今朝 · My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Allura&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script src="html2canvas.min.js"></script>
<style>
:root {
  --primary: #7A5FC0;
  --primary-deep: #5C42A6;
  --primary-light: #B8A4DC;
  --primary-soft: #D4C5E8;
  --primary-pale: #F2EBFA;
  --primary-mist: #FAF6FF;
  --bg-1: #FAF7FF;
  --bg-2: #EFE6F8;
  --bg-3: #E5D9F2;
  --text: #2A1F3D;
  --text-soft: #5A4A75;
  --text-muted: #8B7AA6;
  --line: rgba(122, 95, 192, 0.14);
  --white: #ffffff;
  --shadow-lg: 0 18px 48px rgba(122, 95, 192, 0.16);
  --shadow-md: 0 8px 24px rgba(122, 95, 192, 0.12);
  --shadow-sm: 0 4px 12px rgba(122, 95, 192, 0.08);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --font-cn: "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", "宋体", serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-cn);
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(184, 164, 220, 0.18) 0%, transparent 50%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ====================================================
   银光呼吸发光背景 — 底图之下的银色光芒
   ==================================================== */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-glow .glow-orb {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(220, 210, 245, 0.30) 40%,
    rgba(200, 190, 235, 0.12) 65%,
    transparent 75%);
  filter: blur(36px);
  opacity: 0.35;
  animation: orb-breathe 6s ease-in-out infinite;
}
.bg-glow .glow-orb.orb1 {
  width: 420px; height: 420px;
  top: -120px; left: -80px;
}
.bg-glow .glow-orb.orb2 {
  width: 480px; height: 480px;
  bottom: -160px; right: -120px;
  animation-delay: 2s;
}
.bg-glow .glow-orb.orb3 {
  width: 340px; height: 340px;
  top: 42%; left: 55%;
  animation-delay: 3.2s;
}
.bg-glow .glow-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.75) 30%,
    rgba(215, 215, 235, 0.5) 50%,
    rgba(255, 255, 255, 0.75) 70%,
    transparent 100%);
  filter: blur(0.4px);
  opacity: 0.28;
  animation: line-shimmer 7s ease-in-out infinite;
}
.bg-glow .glow-line.ln1 { top: 22%; left: -5%; width: 110%; }
.bg-glow .glow-line.ln2 { top: 58%; left: -5%; width: 110%; animation-delay: 3.5s; }
.bg-glow .glow-line.ln3 { top: 80%; left: -5%; width: 110%; animation-delay: 1.2s; }
.bg-glow .glow-star {
  position: absolute;
  color: rgba(255, 255, 255, 0.8);
  font-size: 9px;
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
  animation: star-twinkle 3.2s ease-in-out infinite;
  opacity: 0;
}
.bg-glow .glow-star.gs1 { top: 14%; left: 18%; animation-delay: 0s; }
.bg-glow .glow-star.gs2 { top: 34%; right: 12%; animation-delay: 1.1s; }
.bg-glow .glow-star.gs3 { bottom: 30%; left: 22%; animation-delay: 0.6s; }
.bg-glow .glow-star.gs4 { bottom: 14%; right: 20%; animation-delay: 1.7s; }
.bg-glow .glow-star.gs5 { top: 60%; left: 10%; animation-delay: 2.2s; }
.bg-glow .glow-star.gs6 { bottom: 44%; right: 8%; animation-delay: 0.9s; }

@keyframes orb-breathe {
  0%, 100% { opacity: 0.25; transform: scale(0.9); }
  50%      { opacity: 0.55; transform: scale(1.12); }
}
@keyframes line-shimmer {
  0%, 100% { opacity: 0.12; transform: translateX(-18px); }
  50%      { opacity: 0.5;  transform: translateX(18px); }
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.25); }
}

body::before {
  content: '';
  position: fixed;
  top: -160px;
  right: -120px;
  width: 380px;
  height: 380px;
  background: radial-gradient(circle, rgba(184, 164, 220, 0.32) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  bottom: -200px;
  left: -120px;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(155, 126, 222, 0.22) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  padding: 12px 22px 20px;
  z-index: 1;
}

/* ====================================================
   HEADER — 浅紫色 + 发光 + 呼吸 + 漂浮
   ==================================================== */
.header {
  position: relative;
  text-align: center;
  margin: 0 0 10px;
  padding: 14px 0 4px;
  min-height: 196px;   /* 容纳放大后的标题 + 副标题 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.title-halo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 210px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center,
    rgba(184, 164, 220, 0.32) 0%,
    rgba(155, 126, 222, 0.12) 35%,
    transparent 70%);
  filter: blur(28px);
  pointer-events: none;
  z-index: 0;
  animation: halo-breathe 5s ease-in-out infinite;
}

@keyframes halo-breathe {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
  50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
}

.title {
  position: relative;
  z-index: 2;
  font-family: 'Great Vibes', 'Allura', 'Pacifico', cursive;
  font-size: 58px;
  font-weight: 400;
  line-height: 1.05;
  margin: 0;
  padding: 0 20px 0 12px;  /* 右侧留白，避免问号被遮挡 */
  letter-spacing: 0;
  background: linear-gradient(135deg,
    #FFFFFF 0%,
    #D4C5E8 22%,
    #B8A4DC 48%,
    #9B7EDE 78%,
    #FFFFFF 100%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter:
    drop-shadow(0 0 10px rgba(155, 126, 222, 0.50))
    drop-shadow(0 0 22px rgba(184, 164, 220, 0.40))
    drop-shadow(0 0 40px rgba(212, 197, 232, 0.25));
  animation:
    title-float 4.5s ease-in-out infinite,
    title-shimmer 6s linear infinite,
    title-breathe 4.5s ease-in-out infinite;
}

@keyframes title-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}

@keyframes title-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

.title-sub {
  position: relative;
  z-index: 2;
  margin: 14px 0 0;
  font-family: var(--font-cn);
  font-size: 30px;
  font-weight: 800;   /* 中文加粗 */
  color: var(--primary-light);
  letter-spacing: 4px;
  text-shadow: 0 0 14px rgba(184, 164, 220, 0.55);
  animation: sub-fade 4.5s ease-in-out infinite;
}
@keyframes sub-fade {
  0%, 100% { opacity: 0.82; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@keyframes title-breathe {
  0%, 100% {
    filter:
      drop-shadow(0 0 10px rgba(155, 126, 222, 0.40))
      drop-shadow(0 0 22px rgba(184, 164, 220, 0.30))
      drop-shadow(0 0 40px rgba(212, 197, 232, 0.20));
  }
  50% {
    filter:
      drop-shadow(0 0 18px rgba(155, 126, 222, 0.75))
      drop-shadow(0 0 36px rgba(184, 164, 220, 0.55))
      drop-shadow(0 0 60px rgba(212, 197, 232, 0.40));
  }
}

.sparkle {
  position: absolute;
  font-size: 12px;
  color: var(--primary-light);
  filter: drop-shadow(0 0 4px rgba(155, 126, 222, 0.8));
  animation: sparkle 3s ease-in-out infinite;
  z-index: 1;
  opacity: 0;
}
.sparkle.s1 { top: 25%; left: 18%;  animation-delay: 0s;   }
.sparkle.s2 { top: 18%; right: 16%; animation-delay: 1.2s; }
.sparkle.s3 { bottom: 22%; left: 14%; animation-delay: 0.6s; }
.sparkle.s4 { bottom: 18%; right: 18%; animation-delay: 1.8s; }

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0.6); }
  50%      { opacity: 1; transform: scale(1.2); }
}

/* ====================================================
   MOOD BUBBLES — 首页情绪泡泡（漂浮在卡面上）
   ==================================================== */
.mood-bubbles {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  max-width: 260px;
  z-index: 5;
  pointer-events: auto;
}
.mood-bubbles.hidden { display: none; }

.mood-bubble {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-bubble:nth-child(1) { animation-delay: 0s; }
.mood-bubble:nth-child(2) { animation-delay: .5s; }
.mood-bubble:nth-child(3) { animation-delay: 1s; }
.mood-bubble:nth-child(4) { animation-delay: .2s; }
.mood-bubble:nth-child(5) { animation-delay: .8s; }
.mood-bubble:nth-child(6) { animation-delay: .35s; }
.mood-bubble:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 8px 24px rgba(122, 95, 192, 0.2),
    0 0 24px rgba(255, 255, 255, 0.7) inset,
    0 0 16px rgba(184, 164, 220, 0.4);
}
.mood-bubble:active { transform: scale(.94); }

@keyframes bubble-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* 兼容旧样式名 */
.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(232, 224, 248, 0.75) 100%);
  border: 1px solid rgba(184, 164, 220, 0.3);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(122, 95, 192, 0.12),
    0 0 20px rgba(255, 255, 255, 0.5) inset,
    0 0 8px rgba(184, 164, 220, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: bubble-float 4s ease-in-out infinite;
  transition: transform .18s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.mood-chip:nth-child(2) { animation-delay: .5s; }
.mood-chip:nth-child(3) { animation-delay: 1s; }
.mood-chip:nth-child(4) { animation-delay: .2s; }
.mood-chip:nth-child(5) { animation-delay: .8s; }
.mood-chip:nth-child(6) { animation-delay: .35s; }
.mood-chip:hover { transform: translateY(-3px) scale(1.06); }
.mood-chip:active { transform: scale(.94); }

/* ====================================================
   CATEGORY CHIPS — 已移除（用户要求去掉分类按钮，卡片上移）
   保留样式定义以便兼容，但容器不再渲染
   ==================================================== */
.category-list {
  display: none;
}

.chip {
  padding: 11px 4px;
  text-align: center;
  font-size: 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.65);
  color: var(--text-soft);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.22s ease;
  font-family: inherit;
  font-weight: 700;   /* 中文加粗 */
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  white-space: nowrap;
}

.chip:active { transform: scale(0.94); }
.chip.active {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 6px 16px rgba(122, 95, 192, 0.32);
}

/* ====================================================
   SIGN STAGE — 竖着的长方形签条
   ==================================================== */
.stage {
  margin-top: -6px;
  display: flex;
  justify-content: center;
  perspective: 1200px;
  position: relative;  /* 让情绪泡泡 absolute 定位到卡面上 */
}

.sign-card-outer {
  position: relative;
  width: 100%;
  max-width: 280px;   /* 窄长比例 ~1:1.8，接近红框所示 */
  height: 520px;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.sign-card-outer.flipped { transform: rotateY(180deg); }

.sign-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* ---------- FRONT ---------- */
.sign-face.front {
  background:
    radial-gradient(circle at 80% 10%, rgba(212, 197, 232, 0.5) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(184, 164, 220, 0.3) 0%, transparent 50%),
    linear-gradient(145deg, #fff 0%, var(--primary-mist) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: visible;  /* 让魔法棒光晕、水面涟漪可以扩散出卡片，营造叩击水面的扩散感 */
}

.sign-illustration {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.sign-illustration::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(122, 95, 192, 0.3);
  animation: rotate 14s linear infinite;
}

.sign-illustration .icon {
  font-size: 52px;
  animation: gentleFloat 3.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 12px rgba(122, 95, 192, 0.3));
}

@keyframes gentleFloat {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}
@keyframes rotate { to { transform: rotate(360deg); } }

.tap-hint {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 6px;
  margin-bottom: 24px;
  font-weight: 700;   /* 中文加粗 */
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
  color: white;
  border: none;
  padding: 14px 36px;
  border-radius: 100px;
  font-size: 14px;
  letter-spacing: 6px;
  cursor: pointer;
  font-weight: 700;   /* 中文加粗 */
  font-family: inherit;
  box-shadow: 0 10px 26px rgba(122, 95, 192, 0.4);
  transition: all 0.2s;
}
.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 0 4px 14px rgba(122, 95, 192, 0.36);
}
.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

/* ---------- BACK — 竖签条 + 半透发光呼吸 ---------- */
.sign-face.back {
  transform: rotateY(180deg);
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(24px) saturate(125%);
  -webkit-backdrop-filter: blur(24px) saturate(125%);
  border: 1px solid rgba(184, 164, 220, 0.35);
  border-radius: 18px;
  padding: 22px 18px 20px;   /* 窄卡片：左右内边距收紧 */
  display: flex;
  flex-direction: column;
  animation: card-breathe 5s ease-in-out infinite;
}

@keyframes card-breathe {
  0%, 100% {
    background: rgba(255, 255, 255, 0.55);
    border-color: rgba(184, 164, 220, 0.32);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 8px 32px rgba(122, 95, 192, 0.10),
      0 0 40px rgba(155, 126, 222, 0.12);
  }
  50% {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(155, 126, 222, 0.45);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.8) inset,
      0 8px 32px rgba(122, 95, 192, 0.18),
      0 0 70px rgba(155, 126, 222, 0.28);
  }
}

.sign-meta {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.sign-date {
  justify-self: start;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 1px;
  white-space: nowrap;
}

.sign-weather {
  justify-self: center;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 1.5px;
  white-space: nowrap;
}

.sign-brand {
  justify-self: end;
  color: #B8A6DA;
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 600;
  font-style: italic;
  white-space: nowrap;
}

/* 签诗 — 非中文（英/日/德等）默认银白光泽 + shimmer + 漂浮 */
.sign-poem {
  margin: 0;
  font-size: 34px;
  line-height: 1.4;
  font-weight: 700;
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.55s forwards;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
  /* 银白光泽 — 亮银渐变（比旧版更亮，接近截图银白） */
  background: linear-gradient(180deg,
    #EFEAF8 0%,
    #D9D2EA 25%,
    #C4BCD8 50%,
    #B3AACA 75%,
    #EFEAF8 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter:
    drop-shadow(0 0 6px rgba(200, 190, 230, 0.65))
    drop-shadow(0 0 16px rgba(180, 168, 220, 0.35));
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
}

/* 中文签诗 — 始终偏深紫色 */
.sign-poem.sign-poem-cn {
  font-family: var(--font-cn);
  font-size: 34px;
  letter-spacing: 2px;
  font-weight: 700;
  font-style: italic;
  color: #6C52A8;
  background: none;
  -webkit-text-fill-color: initial;
  background-clip: border-box;
  -webkit-background-clip: border-box;
  filter:
    drop-shadow(0 0 6px rgba(155, 130, 222, 0.45))
    drop-shadow(0 0 14px rgba(155, 130, 222, 0.25));
}

.sign-poem.english {
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
  font-size: 34px;
  letter-spacing: 0;
  font-style: italic;
  line-height: 1.35;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
}

@keyframes poem-silver-shimmer {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.seg {
  display: inline-block;
  white-space: nowrap;
  vertical-align: top;
}

.sign-poem.english .seg {
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

@keyframes poem-fade-in {
  to { opacity: 1; }
}

.sign-content {
  flex: 1;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px 0 6px;
}

.sign-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;   /* 确保 block 级子元素内容居中 */
  width: 100%;
}

.sign-mid {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
}

.sign-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
}

.sign-meaning {
  margin: 0;
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-soft);
  text-align: center;
  letter-spacing: 0.5px;
  opacity: 0;
  animation: fadeUp 0.5s 0.5s forwards;
  font-family: var(--font-cn);
  font-weight: 700;
}

.sign-cn {
  margin: 14px 0 0;
  font-size: 34px;
  text-align: center;
  letter-spacing: 2px;
  font-weight: 700;
  font-family: var(--font-cn);
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.55s forwards;
  overflow-wrap: break-word;
  word-break: keep-all;
  /* 中文主题词 — 始终偏深紫色 */
  color: #6C52A8;
  background: none;
  -webkit-text-fill-color: initial;
  background-clip: border-box;
  -webkit-background-clip: border-box;
  filter:
    drop-shadow(0 0 6px rgba(155, 130, 222, 0.45))
    drop-shadow(0 0 14px rgba(155, 130, 222, 0.25));
}

.skew-wrap {
  display: inline-block;
  transform: skewX(-8deg);
}

.sign-literal {
  margin: 10px 0 0;
  font-size: 34px;
  line-height: 1.35;
  text-align: center;
  letter-spacing: 2px;
  font-weight: 700;
  font-family: var(--font-cn);
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.58s forwards;
  overflow-wrap: break-word;
  word-break: keep-all;
  /* 中文直译 — 偏深紫色 */
  color: #6C52A8;
  background: none;
  -webkit-text-fill-color: initial;
  background-clip: border-box;
  -webkit-background-clip: border-box;
  filter:
    drop-shadow(0 0 6px rgba(155, 130, 222, 0.45))
    drop-shadow(0 0 14px rgba(155, 130, 222, 0.25));
}

.sign-cn-en {
  margin: 10px 0 0;
  font-size: 34px;
  line-height: 1.35;
  text-align: center;
  letter-spacing: 0;
  font-weight: 700;
  font-family: Georgia, "Times New Roman", "Playfair Display", serif;
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.55s forwards;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
  /* 英文翻译 — 银白光泽 */
  background: linear-gradient(180deg,
    #EFEAF8 0%,
    #D9D2EA 25%,
    #C4BCD8 50%,
    #B3AACA 75%,
    #EFEAF8 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter:
    drop-shadow(0 0 6px rgba(200, 190, 230, 0.65))
    drop-shadow(0 0 16px rgba(180, 168, 220, 0.35));
}

.sign-tip {
  margin: 0;
  font-size: 12px;
  line-height: 1.7;
  color: var(--primary-light);
  text-align: center;
  letter-spacing: 1px;
  font-weight: 700;  /* 中文加粗 */
  font-family: var(--font-cn);
  opacity: 0;
  animation: fadeUp 0.5s 0.6s forwards;
}

.sign-source {
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  letter-spacing: 1.5px;
  font-style: italic;
  opacity: 0;
  animation: fadeUp 0.5s 0.65s forwards;
  font-family: var(--font-cn);
  font-weight: 700;  /* 中文加粗 */
}

@keyframes fadeUp {
  from { opacity: 0; }
  to { opacity: 1; }
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: auto;
  padding-top: 18px;
}

.btn-ghost {
  padding: 11px 6px;
  background: var(--primary-pale);
  color: var(--primary);
  border: none;
  border-radius: 100px;
  font-size: 14px;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 800;
  letter-spacing: 1px;
}
.btn-ghost:active { transform: scale(0.96); }
.btn-ghost.solid {
  background: var(--primary);
  color: var(--white);
}

/* ====================================================
   TOAST
   ==================================================== */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(42, 31, 61, 0.94);
  color: white;
  padding: 12px 22px;
  border-radius: 100px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  letter-spacing: 1px;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ====================================================
   WATER RIPPLE — 魔法棒叩击水面后的涟漪波纹
   ==================================================== */
.water-ripple {
  position: absolute;
  left: 50%;
  top: 54%;
  width: 30px;
  height: 30px;
  border: 2px solid rgba(140, 165, 230, 0.55);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.3);
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}
.water-ripple::before,
.water-ripple::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 2px solid rgba(140, 165, 230, 0.4);
  border-radius: 50%;
  opacity: 0;
}
.water-ripple.active {
  animation: ripple-main 1s ease-out both;
}
.water-ripple.active::before {
  animation: ripple-echo 1s 0.12s ease-out both;
}
.water-ripple.active::after {
  animation: ripple-echo 1s 0.28s ease-out both;
}

@keyframes ripple-main {
  0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.9; }
  100% { transform: translate(-50%, -50%) scale(7);   opacity: 0; }
}
@keyframes ripple-echo {
  0%   { transform: scale(0.5); opacity: 0.8; }
  100% { transform: scale(3.2); opacity: 0; }
}

/* 点击魔法棒：叩击水面 —— 涟漪扩散 + 轻微下沉再弹起 */
.sign-illustration.tap-wave {
  animation: wand-tap 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave .icon {
  animation: wand-strike 0.85s cubic-bezier(0.22, 0.68, 0.35, 1) both;
}
.sign-illustration.tap-wave::after {
  animation: tap-ripple 0.9s ease-out both;
}

@keyframes wand-tap {
  0%   { transform: translateY(0) scale(1); }
  18%  { transform: translateY(8px) scale(0.96); }
  32%  { transform: translateY(6px) scale(0.97); }
  55%  { transform: translateY(-14px) scale(1.08); }
  75%  { transform: translateY(-6px) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes wand-strike {
  0%   { transform: translateY(0) rotate(0deg); }
  18%  { transform: translateY(10px) rotate(-14deg) scale(0.9); }
  32%  { transform: translateY(8px) rotate(-10deg) scale(0.92); }
  55%  { transform: translateY(-18px) rotate(10deg) scale(1.12); }
  75%  { transform: translateY(-8px) rotate(4deg) scale(1.05); }
  100% { transform: translateY(0) rotate(0deg) scale(1); }
}

@keyframes tap-ripple {
  0%   { transform: scale(0.8); opacity: 0.9; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ====================================================
   SHAKE ANIMATION（已由水面波纹替代，保留定义不生效）
   ==================================================== */
.sign-card-outer.shaking {
  animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0); }
  15%  { transform: translateX(-8px) rotate(-1.5deg); }
  30%  { transform: translateX(8px)  rotate(1.5deg); }
  45%  { transform: translateX(-6px) rotate(-1deg); }
  60%  { transform: translateX(6px)  rotate(1deg); }
  75%  { transform: translateX(-4px) rotate(-0.6deg); }
  90%  { transform: translateX(4px)  rotate(0.6deg); }
}

/* ====================================================
   RESPONSIVE
   ==================================================== */
@media (max-width: 360px) {
  .app { padding: 14px 16px 30px; }

  .title-halo { width: 300px; height: 150px; }

  .sign-poem.sign-poem-cn { font-size: 26px; }
  .sign-cn { font-size: 26px; margin-top: 12px; }

}

  .sign-card-outer { max-width: 300px; height: 560px; }
}

function pickSign() {
  return FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
}

/* 情绪 → 推荐签分类 */
const MOOD_CATS = {
  happy:  ['study', 'relationship', 'confidence'],
  down:   ['selfcare', 'confidence', 'action'],
  sad:    ['selfcare', 'confidence'],
  calm:   ['selfcare', 'career', 'study'],
  praise: ['confidence', 'career', 'study'],
  random: null,
};

function pickSignByMood(mood) {
  const cats = MOOD_CATS[mood] || null;
  if (!cats) return pickSign();
  const pool = FORTUNES.filter(f => cats.includes(f.cat));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : pickSign();
}

function isAscii(str) {
  return /^[\x00-\x7F\s]+$/.test(str);
}

/* ====================================================
   日期 + 天气感知 — 显示「2026/08/19 · 晴 28℃」
   天气优先取 localStorage 手动设置；无则用本地时间推算季节天气
   ==================================================== */
const WEATHER_ICONS = {
  sun: '☀️', cloud: '☁️', rain: '🌧️', snow: '❄️', fog: '🌫️',
  thunder: '⛈️', wind: '💨', moon: '🌙', star: '✨'
};

function getSeasonWeather() {
  // 根据月份 + 时段给一个温和的默认天气（无需联网、离线可用）
  const d = new Date();
  const mon = d.getMonth() + 1;
  const h = d.getHours();
  if (mon >= 3 && mon <= 5)  return { icon: 'sun',  label: '晴' };
  if (mon >= 6 && mon <= 8)  return { icon: h >= 18 || h < 6 ? 'moon' : 'sun',  label: '晴' };
  if (mon >= 9 && mon <= 11) return { icon: 'sun',  label: '晴' };
  return { icon: h >= 18 || h < 6 ? 'moon' : 'sun', label: '晴' };
}

function getWeatherText() {
  const saved = localStorage.getItem('sisterSign.weather');
  if (saved) {
    try {
      const w = JSON.parse(saved);
      if (w && w.label) return w;
    } catch (e) {}
  }
  return getSeasonWeather();
}

function formatDateLine() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
  const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${y}/${m}/${day} 周${wd}`;
}

function formatWeatherLine() {
  const w = getWeatherText();
  const icon = WEATHER_ICONS[w.icon] || WEATHER_ICONS.sun;
  const temp = localStorage.getItem('sisterSign.temperature');
  const tempStr = temp ? ` · ${temp}℃` : '';
  return `${icon} ${w.label}${tempStr}`;
}

function renderSign(sign) {
  // 中文主题词：若 poem 本身是中文（成语/谚语），poem 即中文主题 → 银色发光大标题；
  // 若 poem 是英文（心理签），cn 中文 → 银色发光大标题
  const poemIsCn = !isAscii(sign.poem);
  const poemClass = poemIsCn ? 'sign-poem sign-poem-cn' : 'sign-poem english';
  const joinSegs = (segs) => segs.map(seg => `<span class="seg">${seg}</span>`)
    .join(segs.some(sg => /[\x00-\x7F]/.test(sg)) ? ' ' : '');
  // 英文签诗按子句断段（keepSpace），避免逐词竖排；中文按语义断句
  const poemHtml = poemIsCn
    ? `<span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.poem), 7))}</span>`
    : joinSegs(smartSegments(escapeHtml(sign.poem), 9, !poemIsCn));
  // cn：若 poem 是中文，cn 是英文翻译 → 英文小号样式；若 poem 是英文，cn 是中文主题 → 银色大样式
  const cnIsAscii = sign.cn && /[\x00-\x7F]/.test(sign.cn);
  const cnLine = sign.cn
    ? `<p class="${cnIsAscii ? 'sign-cn-en' : 'sign-cn'}">${cnIsAscii ? escapeHtml(sign.cn) : `<span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.cn), 7))}</span>`}</p>`
    : '';
  const literalLine = sign.literal
    ? `<p class="sign-literal"><span class="skew-wrap">${joinSegs(smartSegments(escapeHtml(sign.literal), 7))}</span></p>`
    : '';
  const tipLine = sign.tip
    ? `<p class="sign-tip">${joinSegs(smartSegments(escapeHtml(sign.tip), 18))}</p>`
    : '';
  const meaningHtml = joinSegs(smartSegments(escapeHtml(sign.meaning), 16));
  const sourceHtml = sign.source
    ? joinSegs(smartSegments(escapeHtml('— ' + sign.source), 18))
    : '';
  return `
    <div class="sign-meta">
      <span class="sign-date">${formatDateLine()}</span>
      <span class="sign-weather">${formatWeatherLine()}</span>
      <span class="sign-brand">今朝·My Day</span>
    </div>
    <div class="sign-content">
      <div class="sign-top">
        <p class="${poemClass}">${poemHtml}</p>
        ${cnLine}
        ${literalLine}
      </div>
      <div class="sign-mid">
        <p class="sign-meaning">${meaningHtml}</p>
      </div>
      <div class="sign-bottom">
        ${tipLine}
        ${sign.source ? `<p class="sign-source">${sourceHtml}</p>` : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="copy-btn">📋 复制</button>
      <button class="btn-ghost" id="save-btn">🖼️ 保存</button>
      <button class="btn-ghost solid" id="again-btn">🔁 再次</button>
    </div>
  `;
}

function escapeHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}


/* 智能断行：把长文本切成「语义段」，
   每段 inline-block 不换行，整段放不下才整体换到下一行，
   保证括号、单词、短句不被拆成两半。
   - 中文：按句末标点断句；过长无标点段再按字数拆
   - 英文：按空格断词（词不拆），逗号/句号后也断开 */
function smartSegments(text, maxCn = 9, keepSpace = false) {
  if (!text) return [];
  const segs = [];
  let cur = '';
  const flush = () => {
    const t = cur.trim();
    if (t) {
      // 纯标点段（如「。」「—」）并入前一段，避免孤立符号占一行
      if (!/[a-zA-Z0-9\u4e00-\u9fff]/.test(t) && segs.length > 0) {
        segs[segs.length - 1] += t;
      } else if (/[\u4e00-\u9fff]/.test(t) && t.length > maxCn && !/[，。！？、；：]/.test(t)) {
        const breakers = ['需要', '就是', '也是', '就能', '才是', '没有', '还有', '我们', '成为'];
        let cutAt = -1;
        for (const b of breakers) {
          const idx = t.indexOf(b, 4);
          if (idx > 0 && idx < t.length - 2 && idx <= maxCn) { cutAt = idx; break; }
        }
        if (cutAt > 0) {
          segs.push(t.slice(0, cutAt));
          segs.push(t.slice(cutAt));
        } else {
          for (let i = 0; i < t.length; i += maxCn) segs.push(t.slice(i, i + maxCn));
        }
      } else {
        // 过短段（1-2字中文）并入前段，避免孤立单字占一行
        if (segs.length > 0 && /[\u4e00-\u9fff]/.test(t) && t.length <= 2 && !/[，。！？、；：]/.test(t)) {
          segs[segs.length - 1] += t;
        } else {
          segs.push(t);
        }
      }
    }
    cur = '';
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    // 「·」与两侧空格保留（如 美国 · 孔子），不拆散
    if (ch === '·') { cur += ch; continue; }
    if (ch === '（' || ch === '(') {
      const close = text.indexOf(ch === '（' ? '）' : ')', i + 1);
      if (close > -1) {
        // 括号段与括号前累积的内容合并为完整一段（避免括号被拆两半）
        const full = cur + text.slice(i, close + 1);
        if (full.trim()) segs.push(full.trim());
        cur = '';
        i = close;
        continue;
      }
    }
    cur += ch;
if (ch === ' ') {
      // 纯标点累积（如「—」开头）不因空格打断，继续与后文合并
      const curTrim = cur.trim();
      if (curTrim && !/[a-zA-Z0-9\u4e00-\u9fff]/.test(curTrim)) continue;
      // keepSpace（英文签诗）：空格已由 cur += ch 累积，仅按标点断句，避免逐词竖排
      if (keepSpace) { continue; }
      flush(); continue;
    }
    // 硬断点：句末标点（。！？；）→ 保证句子完整换行
    if (/[。！？；!?;]/.test(ch)) { flush(); continue; }
    // 软断点：逗号/顿号/冒号 → 只有当前段已接近行宽上限才断开，
    // 否则保留在段内，避免「停一停，」「路反而顺。」被拆成孤立段
    if (/[，、：,]/.test(ch)) {
      if (cur.length >= Math.max(4, maxCn * 0.8)) { flush(); }
      continue;
    }
    if (ch === '.') {
      const next = text[i + 1];
      if (next === undefined || next === ' ') { flush(); continue; }
    }
  }
  flush();
  return segs;
}

function drawSign(mood) {
  if (state.isDrawing) return;
  state.isDrawing = true;
  hideHome();   // 抽签后隐藏情绪泡泡

  const card  = document.getElementById('card');
  const drawBtn = document.getElementById('draw-btn');
  const wand  = document.getElementById('wand');
  if (drawBtn) drawBtn.disabled = true;

  if (navigator.vibrate) {
    try { navigator.vibrate(40); } catch(e) {}
  }

  // 魔法棒叩击水面：涟漪扩散 → 片刻后牌面翻开（不再摇晃）
  if (wand) {
    wand.classList.remove('tap-wave');
    void wand.offsetWidth;  // 强制重绘以重新触发动画
    wand.classList.add('tap-wave');
  }

  // 触发水面涟漪波纹
  const ripple = document.getElementById('water-ripple');
  if (ripple) {
    ripple.classList.remove('active');
    void ripple.offsetWidth;
    ripple.classList.add('active');
  }

  setTimeout(() => {
    if (wand) wand.classList.remove('tap-wave');
    card.classList.remove('shaking');
    const sign = mood ? pickSignByMood(mood) : pickSign();
    state.currentSign = sign;

    const back = document.getElementById('face-back');
    back.innerHTML = renderSign(sign);
    card.classList.add('flipped');

    bindResultEvents();

    setTimeout(() => {
      state.isDrawing = false;
      if (drawBtn) drawBtn.disabled = false;
      addToHistory(sign);
    }, 700);
  }, 560);
}

function resetCard() {
  if (state.isDrawing) return;
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  state.currentSign = null;
  showHome();
}

/* 返回首页：显示情绪泡泡 */

  const bubbles = document.getElementById('mood-bubbles');

/* 抽签后：隐藏情绪泡泡 */
function hideHome() {
  const bubbles = document.getElementById('mood-bubbles');

}

function bindResultEvents() {
  const copyBtn     = document.getElementById('copy-btn');
  const saveBtn     = document.getElementById('save-btn');
  const againBtn    = document.getElementById('again-btn');
  if (copyBtn) copyBtn.onclick = copySign;
  if (saveBtn) saveBtn.onclick = downloadSign;
  if (againBtn) againBtn.onclick = (e) => {
    e.stopPropagation();
    drawSign();   // 直接再抽，不经过 resetCard（避免闪回首页）
  };
  // 点击签文空白处 → 返回首页（绑在 back 面上，事件更可靠）
  const back = document.getElementById('face-back');
  if (back) {
    back.onclick = (e) => {
      // 点击按钮区域不触发返回
      if (e.target.closest('.btn-ghost, .actions, a, button')) return;
      resetCard();
    };
  }
}

function copySign() {
  const s = state.currentSign;
  if (!s) return;
  const lines = [];
  lines.push(`【${formatDateLine()} ${formatWeatherLine()}】`);
  lines.push('');
  if (s.poem) lines.push(s.poem);
  if (s.cn) lines.push(`（${s.cn}）`);
  if (s.literal) lines.push(`（${s.literal}）`);
  lines.push('');
  if (s.meaning) lines.push(`*${s.meaning}`);
  if (s.tip) lines.push(`*${s.tip}`);
  if (s.source) lines.push(`—— ${s.source}`);
  lines.push('');
  lines.push('《今朝 · My Day》');
  const text = lines.join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('文字已复制 · 去发小红书'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('文字已复制 · 去发小红书');
  } catch (e) {
    showToast('复制失败，请长按选择文字');
  }
  document.body.removeChild(ta);
}

async function downloadSign() {
  const s = state.currentSign;
  if (!s) return;

  if (typeof html2canvas === 'undefined') {
    showToast('保存功能加载中，稍等一秒');
    return;
  }

  showToast('生成图片中…');

  try {
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (e) {}
    }

    const node = document.getElementById('face-back');
    // 关键修复：html2canvas 会把背面的 rotateY(180deg) 翻转也渲染出来导致图片颠倒。
    // 真正翻转在父级 .sign-card-outer.flipped 上（父级 rotateY(180deg) + preserve-3d 会让整个背面倒过来）。
    // 必须在真实 DOM 上临时去掉父级 flipped 类和子级的 transform（onclone 对 3D 容器不生效），截图后再恢复。
    const card = document.getElementById('card');
    const cardHadFlipped = card.classList.contains('flipped');
    if (cardHadFlipped) card.classList.remove('flipped');
    const prevTransform = node.style.transform;
    const prevTransformStyle = node.style.transformStyle;
    const prevBackface = node.style.backfaceVisibility;
    node.style.transform = 'none';
    node.style.transformStyle = 'flat';
    node.style.backfaceVisibility = 'visible';
    let canvas;
    try {
      canvas = await html2canvas(node, {
        backgroundColor: '#FAF7FF',
        scale: 2,
        useCORS: true,
        logging: false,
        onclone: (doc) => {
          const el = doc.getElementById('face-back');
          if (el) {
            el.style.animation = 'none';
            el.style.transform = 'none';
            el.style.transformStyle = 'flat';
            el.style.backfaceVisibility = 'visible';
            el.style.boxShadow = '0 8px 32px rgba(122, 95, 192, 0.18), 0 0 60px rgba(155, 126, 222, 0.25)';
            // 隐藏交互按钮：截图保存的图片只展示签条内容，不包含 UI 控制
            const actions = el.querySelector('.actions');
            // 品牌文字与日期天气同色
            const brand = el.querySelector('.sign-brand');
            if (brand) brand.style.color = '#B8A6DA';
            if (actions) actions.style.display = 'none';
            // 强制显示原本依赖 fade-in 动画才能显示的元素（关掉动画后 opacity 会卡在 0）
            el.querySelectorAll('.sign-poem, .sign-cn, .sign-cn-en, .sign-literal, .sign-meaning, .sign-tip, .sign-source').forEach(n => {
              n.style.opacity = '1';
            });
            // html2canvas 不支持 background-clip:text / -webkit-text-fill-color:transparent，
            // 银白渐变签诗 → 截图时换实色银白 + glow 保持视觉接近
            el.querySelectorAll('.sign-poem').forEach(n => {
              n.style.backgroundImage = 'none';
              n.style.backgroundClip = 'border-box';
              n.style.webkitBackgroundClip = 'border-box';
              n.style.webkitTextFillColor = '#D8D2E8';
              n.style.color = '#D8D2E8';
              n.style.filter = 'drop-shadow(0 0 5px rgba(215, 208, 238, 0.8)) drop-shadow(0 0 12px rgba(200, 190, 235, 0.5))';
              n.style.textShadow = '0 0 12px rgba(210, 202, 235, 0.6)';
            });
            // 释义、出处也改为浅色，与签诗协调
            el.querySelectorAll('.sign-meaning').forEach(n => {
              n.style.color = '#A892CE';
            });
            el.querySelectorAll('.sign-cn').forEach(n => {
              // 中文主题词（偏深紫）→ 截图实色深紫
              n.style.backgroundImage = 'none';
              n.style.backgroundClip = 'border-box';
              n.style.webkitBackgroundClip = 'border-box';
              n.style.webkitTextFillColor = '#6C52A8';
              n.style.color = '#6C52A8';
              n.style.filter = 'drop-shadow(0 0 4px rgba(155, 130, 222, 0.55))';
              n.style.textShadow = 'none';
            });
            el.querySelectorAll('.sign-cn-en').forEach(n => {
              // 英文翻译 → 实色银白
              n.style.backgroundImage = 'none';
              n.style.backgroundClip = 'border-box';
              n.style.webkitBackgroundClip = 'border-box';
              n.style.webkitTextFillColor = '#D8D2E8';
              n.style.color = '#D8D2E8';
              n.style.filter = 'drop-shadow(0 0 4px rgba(215, 208, 238, 0.8)) drop-shadow(0 0 10px rgba(200, 190, 235, 0.5))';
              n.style.textShadow = '0 0 10px rgba(210, 202, 235, 0.6)';
            });
            el.querySelectorAll('.sign-literal').forEach(n => {
              // 中文直译 → 实色深紫
              n.style.backgroundImage = 'none';
              n.style.backgroundClip = 'border-box';
              n.style.webkitBackgroundClip = 'border-box';
              n.style.webkitTextFillColor = '#6C52A8';
              n.style.color = '#6C52A8';
              n.style.filter = 'drop-shadow(0 0 5px rgba(155, 130, 222, 0.55))';
              n.style.textShadow = 'none';
            });
            el.querySelectorAll('.sign-tip').forEach(n => {
              n.style.color = '#B8A6DA';
            });
            el.querySelectorAll('.sign-source').forEach(n => {
              n.style.color = '#B8A6DA';
            });
            // 顶部日期行、分隔线调浅
            const meta = el.querySelector('.sign-meta');
            if (meta) {
              meta.style.color = '#B8A6DA';
              meta.style.borderColor = 'rgba(184, 164, 220, 0.25)';
            }
            el.querySelectorAll('.sign-date, .sign-weather').forEach(n => {
              n.style.color = '#B8A6DA';
            });
          }
        }
      });
    } finally {
      // 无论成功失败都恢复卡片 3D 翻转样式，保证页面正常
      if (cardHadFlipped) card.classList.add('flipped');
      node.style.transform = prevTransform;
      node.style.transformStyle = prevTransformStyle;
      node.style.backfaceVisibility = prevBackface;
    }

    // 真实下载路径：先把图片转成 data URL，再创建 <a> 标签触发下载
    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `今朝-${new Date().toISOString().slice(0, 10)}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('卡片图片已开始下载 · 去发小红书');
  } catch (err) {
    console.error(err);
    showToast('下载失败，请截图保存');
  }
}

function addToHistory(sign) {
  state.history = state.history.filter(h => h.poem !== sign.poem);
  state.history.unshift({ ...sign, time: Date.now() });
  state.history = state.history.slice(0, 3);
  saveHistory();
}

function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state.history = JSON.parse(saved);
  } catch (e) {}
}

function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
  } catch (e) {}
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function init() {
  loadHistory();
  const drawBtn = document.getElementById('draw-btn');
  if (drawBtn) drawBtn.addEventListener('click', drawSign);
  const wand = document.getElementById('wand');
  if (wand) wand.addEventListener('click', drawSign);

  // 情绪入口：点击推荐对应签文
  const bubbles = document.getElementById('mood-bubbles');
  if (bubbles) {
    bubbles.querySelectorAll('.mood-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        drawSign(chip.dataset.mood);
      });
    });
  }
}

init();
</script>
